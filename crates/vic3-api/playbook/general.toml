# Playbook rules for every country. Written in our own words from strategy
# guides and the 1.13.9 game files; each rule names its sources and patch.
# Schema: crates/vic3-api/src/playbook.rs (`Rule`, `When`). Unknown keys fail the tests.

# --- Budget and bankruptcy ---------------------------------------------------

[[rule]]
id = "gen.debt-unhealthy"
domain = "economy"
goal = "budget"
phase = "any"
title = "Debt is over half the credit limit: freeze new state spending"
detail = "Start no new government construction or military units until debt is back under half the credit limit."
why = "The game treats debt at or above 50% of the credit limit as an unhealthy economy. The credit limit is about 100K plus building cash reserves plus half of GDP, so a recession shrinks it at the same moment interest grows. That is how a slow deficit turns into a sudden default."
sources = ["https://vic3.paradoxwikis.com/Budget", "game files: common/defines (CREDIT_RATIO_HEALTH_THRESHOLD = 0.5)"]
patch = "1.13"
[rule.when]
debt_share_of_limit_at_least = 0.5
debt_share_of_limit_below = 0.85

[[rule]]
id = "gen.near-default"
domain = "economy"
priority = 1
goal = "budget"
phase = "any"
title = "Default is close: act this week"
detail = "Raise the tax level one step, lower government and military wages one step, and pause the most expensive construction."
why = "At the credit limit the country defaults. Construction stops, and throughput, offense and defense take -5% at once, worsening by -1% a week down to -50%. Declaring bankruptcy wipes the debt, but it resets institutions, empties building cash, radicalises 10% of pops, and adds -75% prestige and +50% interest that decay over 10 years. Avoiding default is always cheaper than recovering from it."
sources = ["https://vic3.paradoxwikis.com/Budget", "game files: common/defines (DECLARE_BANKRUPTCY_*)"]
patch = "1.13"
done = { type = "weekly_balance", at_least = 0.0 }
[rule.when]
debt_share_of_limit_at_least = 0.85
balance_below = 0.0

[[rule]]
id = "gen.tax-bridge"
domain = "economy"
priority = 1
goal = "budget"
phase = "any"
title = "Debt is nearing half the credit limit: raise taxes one level as a bridge"
detail = "Raise the tax level one step in the Budget panel now, and plan to lower it again once spending is cut or new industry pays taxes."
why = "An empty treasury alone is no reason: the state then borrows cheaply. Once debt approaches half the credit limit, the game's unhealthy line, interest starts to bite and a tax bridge buys time. Under per-capita taxation, going from Medium to High raises the per-capita rate from 0.70 to 0.85 and the land rate from 0.35 to 0.425, about +20% on poll taxes. It costs -10% legitimacy, +50% radicals from movements and squeezes the poorest pops, so it is a bridge, not a policy."
sources = ["https://vic3.paradoxwikis.com/Budget", "game files: common/laws/00_taxation.txt, common/defines (CREDIT_RATIO_HEALTH_THRESHOLD = 0.5)"]
patch = "1.13"
done = { type = "weekly_balance", at_least = 0.0 }
[rule.when]
balance_below = 0.0
debt_share_of_limit_at_least = 0.35
debt_share_of_limit_below = 0.85

[[rule]]
id = "gen.keep-per-capita"
domain = "laws"
goal = "reforms"
phase = "early"
title = "Do not switch to Proportional Taxation yet"
detail = "Most of your income is poll tax; Proportional Taxation would delete that line. Switch only once wage income outweighs subsistence pops."
why = "law_proportional_taxation has no per-capita or land tax at all; it only taxes consumption, income (20% at Medium instead of 10%) and dividends. While poll tax is your largest income line, switching roughly doubles income tax but loses the whole poll tax."
sources = ["game files: common/laws/00_taxation.txt", "https://vic3.paradoxwikis.com/Budget"]
patch = "1.13"
[rule.when]
laws = ["law_per_capita_based_taxation"]
income_share_at_least = { poll_taxes = 0.45 }

[[rule]]
id = "gen.lower-taxes-when-rich"
domain = "economy"
goal = "reforms"
phase = "any"
title = "Lower the tax level instead of hoarding gold"
detail = "You have no debt and a large surplus: lower the tax level one step."
why = "A lower tax level leaves money with pops, which raises their standard of living, gives +5% legitimacy at Low (+10% at Very Low) and -10%/-20% radicals from movements. A treasury above about 20% of annual GDP has diminishing returns anyway; if you still have unused money, build instead."
sources = ["https://vic3.paradoxwikis.com/Budget", "game files: common/defines (GOLD_RESERVE_LIMIT_FACTOR = 0.2)"]
patch = "1.13"
[rule.when]
in_debt = false
balance_share_of_income_at_least = 0.15

# --- Military without bankruptcy --------------------------------------------

[[rule]]
id = "gen.army-share"
domain = "war"
goal = "military"
phase = "any"
title = "The standing army eats the budget"
detail = "Bring the army's running cost under about 40% of income in peacetime: fewer regular battalions, cheaper unit types, conscripts as the reserve."
why = "In 1.13 every battalion pays wages through its barracks and buys upkeep goods (small arms, ammunition, artillery, grain, iron) through the Army Logistics Center in its HQ state, all the time, even in peace. Conscription centers cost almost nothing until conscripts are raised, so they are the cheap reserve; regular battalions are the expensive standing force."
sources = ["game files: common/combat_unit_types/00_land_combat_unit_types.txt, common/buildings/05_military.txt"]
patch = "1.13.9"
[rule.when]
expense_share_at_least = { military = 0.45 }
balance_below = 0.0

[[rule]]
id = "gen.goods-hungry-units"
domain = "war"
goal = "military"
phase = "any"
title = "Disband or convert goods-hungry battalions first"
detail = "Your army spends far more on goods than on wages: cut lancers first, then cuirassiers and dragoons, then mobile artillery, then skirmish infantry in rear armies."
why = "Weekly upkeep per battalion at base prices: lancers about 240, skirmish infantry 170 (2 small arms + 1 ammunition), cuirassiers and dragoons 140, mobile artillery 140, but line infantry only 60, cannon artillery 70 and hussars 20. Converting the units that will not fight soon trades a little combat power for most of the goods bill. If the formation screen will not change a unit type, disband and recruit the cheaper type."
sources = ["game files: common/combat_unit_types/00_land_combat_unit_types.txt (upkeep_modifier), common/goods"]
patch = "1.13.9"
[rule.when]
expense_ratio_at_least = { "military_goods/military_wages" = 1.4 }
expense_share_at_least = { military = 0.3 }

[[rule]]
id = "gen.small-arms"
domain = "war"
goal = "military"
phase = "any"
title = "Make small arms cheap: build arms industry"
detail = "Small arms cost over 10% above base price; add arms industry levels in your main market until they are at or below base."
why = "The Army Logistics Center buys small arms at market price, so a 25% markup costs 25% more every week. Domestic arms production lowers the price, employs workers who pay income tax, and pays dividends on state-owned levels."
sources = ["game files: building_arms_industry (unlocked by gunsmithing)"]
patch = "1.13.9"
[rule.when]
techs = ["gunsmithing"]
price_above_base = { small_arms = 0.1 }

[[rule]]
id = "gen.ammunition"
domain = "war"
goal = "military"
phase = "early"
title = "Make ammunition cheap: build munition plants"
detail = "Ammunition costs over 10% above base price; every skirmish battalion uses one a week and trench infantry later uses two."
why = "Ammunition shortages put input-shortage penalties on supply, and since 1.13.5 formations also take production-shortage penalties. Cheap ammunition also prepares the move to better infantry."
sources = ["game files: building_munition_plant (unlocked by percussion_cap)", "https://vic3.paradoxwikis.com/Patch_1.13.X"]
patch = "1.13.9"
[rule.when]
techs = ["percussion_cap"]
price_above_base = { ammunition = 0.1 }

[[rule]]
id = "gen.grain"
domain = "economy"
goal = "military"
phase = "any"
title = "Grain is expensive: build wheat or rye farms"
detail = "Grain costs over 15% above base price. It feeds cavalry, mobilised units and your pops."
why = "Every cavalry type eats grain and each mobilised unit adds 0.75 grain. Grain is also the staple pop food, so an expensive grain price raises military cost and lowers standard of living at the same time."
sources = ["game files: combat unit upkeep, common/mobilization_options/00_mobilization_option.txt"]
patch = "1.13.9"
[rule.when]
price_above_base = { grain = 0.15 }

[[rule]]
id = "gen.military-wages"
domain = "war"
goal = "military"
phase = "any"
title = "Set military wages to Low while the Armed Forces are out of government"
detail = "You are losing money and the Armed Forces are not in government: lower military wages one step in the Budget panel."
why = "Low wages cut the military wage bill by 15% (Very Low by 30%) but cost Armed Forces approval, army prestige and training rate. With the Armed Forces out of government their displeasure does not destabilise your coalition; with them in government, keep Normal."
sources = ["https://vic3.paradoxwikis.com/Budget"]
patch = "1.13"
[rule.when]
balance_below = 0.0
igs_not_in_government = ["ig_armed_forces"]
expense_share_at_least = { military_wages = 0.15 }

# --- Industry ----------------------------------------------------------------

[[rule]]
id = "gen.paper"
domain = "economy"
goal = "industry"
phase = "opening"
title = "Cut the cost of the state itself: build paper mills"
detail = "Government goods are over a fifth of spending and they are almost all paper. Build paper mills (and logging camps to feed them) until paper is at or below base price."
why = "Government administrations with Horizontal Drawer Cabinets use 10 paper per level, bought at market price. Cheaper paper cuts a fixed state cost directly; downgrading the production method would cost bureaucracy instead."
sources = ["game files: common/production_methods/07_government.txt, building_paper_mill"]
patch = "1.13.9"
[rule.when]
expense_share_at_least = { government_goods = 0.2 }

[[rule]]
id = "gen.construction-inputs"
domain = "economy"
goal = "industry"
phase = "early"
title = "Make construction inputs cheap"
detail = "Wood, fabric, iron or tools are over 15% above base price: build logging camps, iron mines or tooling workshops for whichever is dear."
why = "Construction sectors burn wood and fabric (Wooden Buildings) or wood, fabric, iron and tools (Iron Frame) for every construction point, at market price. Cheaper inputs mean more buildings for the same money."
sources = ["game files: common/production_methods/13_construction.txt", "https://steamcommunity.com/app/529340/discussions/0/3717188807309600790 (older)"]
patch = "1.13.9"
[rule.when]
levels_at_least = { building_construction_sector = 1.0 }
any_price_above_base = { wood = 0.15, fabric = 0.15, iron = 0.15, tools = 0.15 }

[[rule]]
id = "gen.iron-frame"
domain = "economy"
goal = "industry"
phase = "early"
title = "Switch construction sectors to Iron Frame Buildings"
detail = "Iron and tools are cheap now: Iron Frame Buildings give more construction per sector."
why = "Iron Frame needs iron and tools on top of wood and fabric. Switching while those goods are expensive raises the construction bill more than the extra speed is worth; with them at base price it is a clear gain."
sources = ["game files: pm_iron_frame_buildings (unlocked by urban_planning)"]
patch = "1.13.9"
[rule.when]
techs = ["urban_planning"]
price_ratio_at_most = { iron = 1.0, tools = 1.1 }

[[rule]]
id = "gen.steel"
domain = "economy"
goal = "industry"
phase = "mid"
title = "Build steel mills next to your coal and iron"
detail = "Steel is over 10% above base price: build steel mills in the states that already have coal and iron mines."
why = "Steel feeds railways, tools and later construction methods. Producing it next to its inputs inside your market keeps input prices low and the wages taxed at home."
sources = ["game files: building_steel_mill (unlocked by steelworking)"]
patch = "1.13.9"
[rule.when]
techs = ["steelworking"]
levels_at_least = { building_coal_mine = 1.0, building_iron_mine = 1.0 }
price_above_base = { steel = 0.1 }

[[rule]]
id = "gen.tax-base-shift"
domain = "economy"
goal = "industry"
phase = "mid"
title = "Industrialisation is lagging behind"
detail = "Income tax is still small next to poll tax: build factories that employ peasants rather than more military or luxury projects."
why = "Income tax is charged on wages, not on subsistence output. While most taxes come from subsistence farmers, revenue only grows with population. Every peasant who becomes a factory worker pays more tax and buys more goods, which also pay consumption tax."
sources = ["https://vic3.paradoxwikis.com/Budget"]
patch = "1.13"
[rule.when]
from_year = 1845
income_share_below = { income_taxes = 0.25 }

[[rule]]
id = "gen.sector-pacing"
domain = "economy"
goal = "industry"
phase = "any"
title = "Add construction sectors one at a time"
detail = "You have a surplus and little debt: add one construction sector, then check the balance again a few weeks later."
why = "Each sector adds wages and goods (wood and fabric, later iron and tools) every week, costs 25 construction itself and needs 1,000 workers since 1.12. Adding many at once is how players overshoot into debt before the new factories pay back."
sources = ["https://vic3.paradoxwikis.com/Patch_1.12", "https://vic3.paradoxwikis.com/Construction"]
patch = "1.13"
[rule.when]
balance_share_of_income_at_least = 0.05
debt_share_of_limit_below = 0.25

[[rule]]
id = "gen.laissez-faire"
domain = "laws"
goal = "industry"
phase = "mid"
title = "Consider Laissez-Faire once private investment can carry construction"
detail = "The Industrialists are strong enough to back it: Laissez-Faire moves building costs off the state budget."
why = "Laissez-Faire gives -25% loan interest, a larger private construction share and +25% investment efficiency for shopkeepers and capitalists. The price is less direct control over what gets built."
sources = ["game files: common/laws/00_economic_system.txt (unlocked by international_trade)"]
patch = "1.13.9"
done = { type = "law_active", law = "law_laissez_faire" }
[rule.when]
laws = ["law_interventionism"]
techs = ["international_trade"]
ig_clout_at_least = { ig_industrialists = 0.15 }

# --- Reforms and stability ---------------------------------------------------

[[rule]]
id = "gen.industrialists-in"
domain = "laws"
goal = "reforms"
phase = "early"
title = "Bring the Industrialists into government"
detail = "The Industrialists have clout but no seat: add them to the government."
why = "A law's base chance to pass is the clout of the government interest groups that endorse it, plus movements and the ruler. Landowners and the Armed Forces back few economic reforms; the Industrialists back the market reforms your industry needs."
sources = ["https://vic3.paradoxwikis.com/Laws"]
patch = "1.13"
[rule.when]
ig_clout_at_least = { ig_industrialists = 0.15 }
igs_not_in_government = ["ig_industrialists"]

[[rule]]
id = "gen.free-the-peasants"
domain = "laws"
goal = "reforms"
phase = "mid"
title = "Move land reform from Tenant Farmers to Commercialized Agriculture"
detail = "Tenant Farmers keeps peasants on the land and your taxes on the poorest pops."
why = "Tenant Farmers forbids peasants from migrating inside the country and reserves 25% of arable land for subsistence, so factories cannot draw on the rural labour pool. Landowners will oppose the change, so pass it with the Industrialists or Petty Bourgeoisie in government."
sources = ["game files: common/laws/00_land_reform.txt"]
patch = "1.13.9"
done = { type = "law_active", law = "law_commercialized_agriculture" }
[rule.when]
laws = ["law_tenant_farmers"]
techs = ["mutual_funds"]

[[rule]]
id = "gen.voting"
domain = "laws"
goal = "reforms"
phase = "mid"
title = "Plan the move off Autocracy to a limited franchise"
detail = "Democracy is researched: move to Census or Wealth Voting once Industrialists or Petty Bourgeoisie can carry it."
why = "Census and Wealth Voting let the middle classes count in elections and are a stable halfway house before universal suffrage. Since 1.13 coups need a reason and enacting a law is one, so do not start it while the Armed Forces are angry."
sources = ["https://vic3.paradoxwikis.com/Patch_1.13", "game files: law unlocks"]
patch = "1.13"
[rule.when]
laws = ["law_autocracy"]
techs = ["democracy"]

[[rule]]
id = "gen.assembly"
domain = "laws"
goal = "reforms"
phase = "mid"
title = "Liberalise speech to Right of Assembly"
detail = "Censorship is in force and the Intelligentsia have clout: move to Right of Assembly."
why = "Liberal interest groups and movements push for it. Passing it removes a source of radicalism and opens the way to the labour and welfare laws that raise standard of living."
sources = ["game files: law_right_of_assembly (unlocked by human_rights)"]
patch = "1.13.9"
done = { type = "law_active", law = "law_right_of_assembly" }
[rule.when]
laws = ["law_censorship"]
techs = ["human_rights"]
ig_clout_at_least = { ig_intelligentsia = 0.1 }

[[rule]]
id = "gen.welfare-when-solvent"
domain = "laws"
goal = "reforms"
phase = "late"
title = "Enact Poor Laws now that the budget can carry them"
detail = "You have a solid surplus and little debt: Poor Laws raise standard of living and lower radicalism."
why = "Welfare pays pops below a standard-of-living threshold directly from the budget, an open-ended expense that grows in recessions. Enacted in deficit it is a common route to bankruptcy; enacted with a surplus it buys stability."
sources = ["https://vic3.paradoxwikis.com/Budget", "game files: law_poor_laws (unlocked by democracy)"]
patch = "1.13"
done = { type = "law_active", law = "law_poor_laws" }
[rule.when]
laws = ["law_no_social_security"]
techs = ["democracy"]
balance_share_of_income_at_least = 0.1
debt_share_of_limit_below = 0.2

# --- Early game (1836–1850): foundations ------------------------------------

[[rule]]
id = "gen.early-schools"
domain = "laws"
goal = "reforms"
phase = "early"
title = "Start schooling: enact Religious or Private Schools"
detail = "Literacy is under 30% and there is no school system: enact Religious Schools (with rationalism) or Private Schools (with academia)."
why = "Literacy gates research speed, the qualifications pops need for skilled jobs (clerks, engineers, machinists) and the political awareness of the middle class. A school law started early pays for decades; Public Schools (empiricism) is the stronger but costlier step later."
sources = ["game files: common/laws/00_education_system.txt (law_religious_schools: rationalism, law_private_schools: academia, law_public_schools: empiricism)"]
patch = "1.13.9"
done = { type = "law_inactive", law = "law_no_schools" }
[rule.when]
laws = ["law_no_schools"]
literacy_below = 0.3

[[rule]]
id = "gen.early-tools"
domain = "economy"
goal = "industry"
phase = "early"
title = "Make tools at home: build tooling workshops"
detail = "Tools are over 20% above base price: build tooling workshops next to iron and wood."
why = "Tools are the input of almost every early upgrade: mines, logging camps, farms and Iron Frame construction all run on them. Dear tools make every later production-method switch unprofitable, so the tool chain comes before consumer factories."
sources = ["game files: building_tooling_workshop (unlocked by manufacturies)"]
patch = "1.13.9"
[rule.when]
techs = ["manufacturies"]
price_above_base = { tools = 0.2 }

[[rule]]
id = "gen.early-coal"
domain = "economy"
goal = "industry"
phase = "early"
title = "Open coal mines before railways and steel"
detail = "Coal is over 20% above base price: open coal mines in your coal states."
why = "Coal powers railways, steam engines in mines and later steel. Building the mines before the demand arrives keeps the first railways and steel mills profitable instead of fighting over imports."
sources = ["game files: building_coal_mine"]
patch = "1.13.9"
[rule.when]
price_above_base = { coal = 0.2 }

[[rule]]
id = "gen.early-railways-research"
domain = "economy"
goal = "industry"
phase = "early"
title = "Research railways"
detail = "It is past 1840 and railways is not researched: put it at the front of the production queue."
why = "Railways unlock the railway building, the main source of infrastructure and market access. Without it, every state you industrialise hits its infrastructure cap and loses output to the market-access penalty."
sources = ["game files: building_railway (unlocked by railways)"]
patch = "1.13.9"
[rule.when]
from_year = 1840
techs_missing = ["railways"]

# --- Mid game (1850–1890): railways, heavy industry, institutions ------------

[[rule]]
id = "gen.mid-railways"
domain = "economy"
goal = "industry"
phase = "mid"
title = "Build railways where infrastructure runs out"
detail = "One or more of your states use more infrastructure than they have: build railways there before new factories."
why = "A state over its infrastructure gets a market-access penalty: its buildings sell and buy less on the national market, so new factories there earn less than the analyzer's ranking expects. Railways also raise demand for engines and coal at home."
sources = ["game files: building_railway (unlocked by railways), building_port"]
patch = "1.13.9"
[rule.when]
techs = ["railways"]
infrastructure_short_states_at_least = 1

[[rule]]
id = "gen.mid-engines"
domain = "economy"
goal = "industry"
phase = "mid"
title = "Make engines: build motor industry"
detail = "Engines are over 20% above base price: build motor industry next to your steel or iron."
why = "Railways, steam-powered mines and later factories all consume engines. Importing them at high prices drains the money the railways were meant to make."
sources = ["game files: building_motor_industry (unlocked by atmospheric_engine)"]
patch = "1.13.9"
[rule.when]
techs = ["atmospheric_engine"]
price_above_base = { engines = 0.2 }

[[rule]]
id = "gen.mid-universities"
domain = "economy"
goal = "industry"
phase = "mid"
title = "Build a university"
detail = "You have academia and no university: build one in your most literate state."
why = "Universities add innovation (research speed) and are the first building that turns the budget into faster technology. Later technologies are what make each worker more productive."
sources = ["game files: building_university (unlocked by academia)"]
patch = "1.13.9"
done = { type = "building_levels", building_type = "building_university", at_least = 1.0 }
[rule.when]
techs = ["academia"]
levels_below = { building_university = 1.0 }
balance_at_least = 0.0

[[rule]]
id = "gen.mid-professional-army"
domain = "war"
goal = "military"
phase = "mid"
title = "Move from Peasant Levies to a Professional Army"
detail = "You have military drill and still raise peasant levies: enact Professional Army."
why = "Levies pull workers out of farms and factories when mobilised and fight poorly. A smaller professional army costs wages but keeps the economy running in war, which is the war you can afford."
sources = ["game files: common/laws/00_army_model.txt (law_professional_army: military_drill)"]
patch = "1.13.9"
done = { type = "law_active", law = "law_professional_army" }
[rule.when]
from_year = 1850
laws = ["law_peasant_levies"]
techs = ["military_drill"]

[[rule]]
id = "gen.mid-public-schools"
domain = "laws"
goal = "reforms"
phase = "mid"
title = "Upgrade to Public Schools while the budget allows"
detail = "Literacy is under 50% and you run Religious or Private Schools with a surplus: enact Public Schools."
why = "Public Schools raise literacy fastest and feed the qualifications late industry needs. It is a budget expense, so it belongs to a surplus, not a deficit."
sources = ["game files: common/laws/00_education_system.txt (law_public_schools: empiricism)"]
patch = "1.13.9"
done = { type = "law_active", law = "law_public_schools" }
[rule.when]
techs = ["empiricism"]
laws_missing = ["law_no_schools", "law_public_schools"]
literacy_below = 0.5
balance_share_of_income_at_least = 0.05
debt_share_of_limit_below = 0.3

# --- Late game (1890–1936): new goods, welfare, the great war ----------------

[[rule]]
id = "gen.late-electricity"
domain = "economy"
goal = "industry"
phase = "late"
title = "Build power plants"
detail = "You have electrical generation and no power plants: build them next to coal (later oil)."
why = "Electricity is the input of the late production methods that multiply factory output. A late-game economy without power plants pays more per unit than its rivals in every factory."
sources = ["game files: building_power_plant (unlocked by electrical_generation)"]
patch = "1.13.9"
done = { type = "building_levels", building_type = "building_power_plant", at_least = 1.0 }
[rule.when]
techs = ["electrical_generation"]
levels_below = { building_power_plant = 1.0 }

[[rule]]
id = "gen.late-oil"
domain = "economy"
goal = "industry"
phase = "late"
title = "Drill oil"
detail = "Oil is over 20% above base price: build oil rigs in your oil states (or secure one)."
why = "Oil feeds power plants, motor vehicles, synthetics and late warships. Late wars and late factories are decided by who owns the oil; buying it on a tight market costs more each year."
sources = ["game files: building_oil_rig (unlocked by pumpjacks)"]
patch = "1.13.9"
[rule.when]
techs = ["pumpjacks"]
price_above_base = { oil = 0.2 }

[[rule]]
id = "gen.late-rubber"
domain = "economy"
goal = "industry"
phase = "late"
title = "Secure rubber"
detail = "Rubber is over 30% above base price: build rubber plantations in tropical states you own, or trade for it."
why = "Rubber grows only in a few tropical states and is needed by automobiles, electrics and late military goods. It is usually the reason for late colonial or trade deals, so plan it before demand peaks."
sources = ["game files: building_rubber_plantation (unlocked by rubber_mastication)"]
patch = "1.13.9"
[rule.when]
techs = ["rubber_mastication"]
price_above_base = { rubber = 0.3 }

[[rule]]
id = "gen.late-fertilizer"
domain = "economy"
goal = "industry"
phase = "late"
title = "Make fertilizer: build chemical plants"
detail = "Fertilizer is over 20% above base price: build chemical plants."
why = "Fertilizer production methods raise farm output a lot, freeing peasants for factories. Dear fertilizer keeps farms on old methods and food expensive."
sources = ["game files: building_chemical_plant (unlocked by intensive_agriculture)"]
patch = "1.13.9"
[rule.when]
techs = ["intensive_agriculture"]
price_above_base = { fertilizer = 0.2 }

[[rule]]
id = "gen.late-artillery"
domain = "war"
goal = "military"
phase = "late"
title = "Make artillery at home before a great war"
detail = "Artillery is over 20% above base price after 1880: build artillery foundries."
why = "Late armies consume artillery every week, and mobilisation multiplies that. An army supplied from imports turns a war into a budget crisis in months."
sources = ["game files: building_artillery_foundry (unlocked by gunsmithing)"]
patch = "1.13.9"
[rule.when]
from_year = 1880
techs = ["gunsmithing"]
price_above_base = { artillery = 0.2 }

[[rule]]
id = "gen.late-wage-subsidies"
domain = "laws"
goal = "reforms"
phase = "late"
title = "Move from Poor Laws to Wage Subsidies when solvent"
detail = "You have labor movement, Poor Laws, a solid surplus and little debt: enact Wage Subsidies."
why = "Wage subsidies lift the poorest workers' standard of living and cut radicals, but they are a budget expense that grows in recessions, so only with a surplus."
sources = ["game files: common/laws/00_welfare.txt (law_wage_subsidies: labor_movement)"]
patch = "1.13.9"
done = { type = "law_active", law = "law_wage_subsidies" }
[rule.when]
laws = ["law_poor_laws"]
techs = ["labor_movement"]
balance_share_of_income_at_least = 0.1
debt_share_of_limit_below = 0.2

[[rule]]
id = "gen.late-universal-suffrage"
domain = "laws"
goal = "reforms"
phase = "late"
title = "Answer the radicals: enact Universal Suffrage"
detail = "After 1885, with Wealth Voting, egalitarianism and over 10% radicals: enact Universal Suffrage."
why = "A narrow franchise leaves lower-strata movements no road but radicalism. A wider franchise turns them into parties, which costs the old ruling groups clout but lowers turmoil and revolution risk."
sources = ["game files: common/laws/00_distribution_of_power.txt (law_universal_suffrage: egalitarianism)"]
patch = "1.13.9"
done = { type = "law_active", law = "law_universal_suffrage" }
[rule.when]
from_year = 1885
laws = ["law_wealth_voting"]
techs = ["egalitarianism"]
radicals_share_at_least = 0.1

# --- Every phase: warning signs ----------------------------------------------

[[rule]]
id = "gen.radicals-high"
domain = "laws"
goal = "stability"
phase = "any"
priority = 1
title = "Radicals are over 15% of the population"
detail = "Stop enacting laws the largest interest groups oppose, make food and clothes cheaper, and check which interest group's radicals grow fastest."
why = "Radicals lower legitimacy and fuel political movements that can revolt. A revolution splits off states and their buildings; prevention is cheaper than the civil war."
sources = ["game files: radical_fraction trigger, common/journal_entries/00_fascism.txt"]
patch = "1.13.9"
[rule.when]
radicals_share_at_least = 0.15

[[rule]]
id = "gen.sol-low"
domain = "economy"
goal = "stability"
phase = "any"
title = "Standard of living is low: make basic goods cheaper"
detail = "Average standard of living is under 10 after 1840 and grain, clothes or furniture is dear: build farms, textile mills or furniture manufacturies for the dearest one."
why = "Low standard of living turns pops radical and slows the growth of the middle class that pays most taxes. Cheaper basic goods raise it without a budget cost."
sources = ["game files: average_sol trigger"]
patch = "1.13.9"
[rule.when]
from_year = 1840
sol_below = 10.0
any_price_above_base = { grain = 0.1, clothes = 0.1, furniture = 0.1 }

[[rule]]
id = "gen.infrastructure-short"
domain = "economy"
goal = "industry"
phase = "any"
title = "A state is short of infrastructure and you have no railways"
detail = "At least one of your states uses more infrastructure than it has: build a port there if it is coastal, and research railways."
why = "Over the infrastructure cap a state's market access drops, so new buildings there earn less than they cost. Fix the cap first, then expand."
sources = ["game files: building_railway, building_port"]
patch = "1.13.9"
[rule.when]
infrastructure_short_states_at_least = 1
techs_missing = ["railways"]
