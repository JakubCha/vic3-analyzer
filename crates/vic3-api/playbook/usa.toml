# United States (USA). Research: tmp/playbook-usa.md (game files 1.13.9,
# vic3 wiki United States (1.13) and Strategy: America (1.9–1.10)).
# In the save ig_landowners = Southern Planters, ig_rural_folk = Yeoman Farmers.

[[rule]]
id = "usa.construction-sectors"
countries = ["USA"]
domain = "economy"
goal = "industry"
phase = "opening"
title = "Turn the surplus into construction sectors in New York and Pennsylvania"
detail = "The USA starts with only 6 construction sector levels for a huge territory: add sectors in NY or PA (iron and coal nearby) until the weekly surplus is close to zero."
why = "Every plan is limited by build speed. Construction sectors are paid from the budget through the goods they consume, so a surplus converts directly into build speed; stop when the surplus is gone, not when the queue is empty. The sectors start on Iron Frame, so watch iron and tools prices."
sources = ["https://vic3.paradoxwikis.com/Strategy:_America", "https://vic3.paradoxwikis.com/United_States", "game files: common/history/buildings/05_north_america.txt"]
patch = "1.13"
[rule.when]
until_year = 1840
levels_below = { building_construction_sector = 10.0 }
balance_at_least = 0.0

[[rule]]
id = "usa.luxury-taxes"
countries = ["USA"]
domain = "economy"
goal = "budget"
phase = "opening"
title = "Tax luxuries before raising the general tax level"
detail = "Put consumption taxes on luxury goods (tobacco, liquor, wine, services, luxury furniture) in the Budget panel."
why = "The USA starts at a Low tax level with very wealthy pops, so luxury consumption taxes mostly hit middle and upper strata who can afford them. Per-capita tax hits every pop equally, so raising the general level pushes poor workers into lower standard of living and radicalism. Consumption taxes cost authority, not money."
sources = ["https://vic3.paradoxwikis.com/Strategy:_America"]
patch = "1.10"
[rule.when]
until_year = 1840
laws = ["law_per_capita_based_taxation"]
balance_below = 0.0

[[rule]]
id = "usa.proportional-tax"
countries = ["USA"]
domain = "laws"
goal = "industry"
phase = "early"
title = "Move to Proportional Taxation now that wages carry the economy"
detail = "Poll tax is no longer your main income: Proportional Taxation doubles the income-tax rate (0.075 → 0.15 at Low) and grows with industry."
why = "Proportional Taxation drops per-capita and land tax. As factories create capitalists and well-paid workers, income tax grows with the economy while per-capita tax stays flat. Check the expected income in the law tooltip before switching."
sources = ["game files: common/laws/00_taxation.txt", "https://vic3.paradoxwikis.com/Strategy:_America"]
patch = "1.13.9"
done = { type = "law_active", law = "law_proportional_taxation" }
[rule.when]
laws = ["law_per_capita_based_taxation"]
techs = ["egalitarianism"]
income_share_below = { poll_taxes = 0.35 }

[[rule]]
id = "usa.build-north"
countries = ["USA"]
domain = "economy"
goal = "slavery_debate"
phase = "early"
title = "Build new factories in the North while slavery stands"
detail = "Put new industry in New York, Pennsylvania, New England, Ohio and the Great Lakes states, not in the slave states."
why = "If the Civil War fires, the slave states leave with their buildings and become the war zone, so southern factories turn into enemy assets. Northern industry keeps producing during the war and pays for it. After the Slavery Debate completes, southern investment is safe again."
sources = ["https://vic3.paradoxwikis.com/Strategy:_America", "game files: common/journal_entries/00_acw_entries.txt (je_acw_countdown)"]
patch = "1.13"
how = ["Construction panel: place every new factory in New York, Pennsylvania, New England, Ohio or the Great Lakes states.", "Queue no new factories in the slave states."]
[rule.when]
laws = ["law_legacy_slavery"]

[[rule]]
id = "usa.dedicated-police"
countries = ["USA"]
domain = "laws"
goal = "slavery_debate"
phase = "early"
title = "Replace Local Police with Dedicated Police"
detail = "Local Police feeds the Southern Planters' political strength."
why = "Local Police gives the Southern Planters (ig_landowners) +5% political strength per police institution level, and the USA starts at level 2. Removing it lowers Planter clout before abolition and lowers the radicalisation the slavery change causes."
sources = ["game files: common/laws/00_policing.txt", "https://vic3.paradoxwikis.com/Strategy:_America"]
patch = "1.13.9"
done = { type = "law_active", law = "law_dedicated_police" }
[rule.when]
laws = ["law_local_police", "law_legacy_slavery"]
techs = ["law_enforcement"]

[[rule]]
id = "usa.not-yet-abolition"
countries = ["USA"]
domain = "laws"
goal = "slavery_debate"
phase = "early"
title = "Do not rush abolition yet: time works for you"
detail = "Spend these years on construction and northern industry; enact Slavery Banned later."
why = "The Missouri Compromise modifier gives the Planters +25% political strength and big voting power, but it decays over 50 years. Jacksonian Democrat characters back the pro-slavery movement, and changing the slavery law while Jackson lives can push the Yeoman Farmers to the secessionists."
sources = ["game files: common/static_modifiers/content_1_modifiers.txt, common/political_movements/00_ideological_movements.txt", "https://vic3.paradoxwikis.com/United_States"]
patch = "1.13"
how = ["Nothing to enact now: do not press Enact on Slavery Banned yet.", "Fill the construction queue with factories in the northern states (Construction panel)."]
[rule.when]
until_year = 1844
laws = ["law_legacy_slavery"]
ig_clout_at_least = { ig_landowners = 0.15 }

[[rule]]
id = "usa.abolition-ready"
countries = ["USA"]
domain = "laws"
priority = 1
goal = "slavery_debate"
phase = "mid"
title = "You are ready: enact Slavery Banned"
detail = "The Planters are out of government and weak, and the budget is healthy. Start Slavery Banned and avoid any other war or big law change until the debate ends."
why = "The Slavery Debate (je_acw_countdown) completes only after slavery has been banned for 10 years with no civil war. The war starts when the pro-slavery movement revolts, which is easier the stronger the Planters and the more unstable the country. A war fought in debt ends in default quickly, so start from a surplus."
sources = ["game files: common/journal_entries/00_acw_entries.txt", "https://vic3.paradoxwikis.com/Strategy:_America"]
patch = "1.13"
done = { type = "law_active", law = "law_slavery_banned" }
[rule.when]
from_year = 1845
laws = ["law_legacy_slavery"]
igs_not_in_government = ["ig_landowners"]
ig_clout_below = { ig_landowners = 0.12 }
balance_at_least = 0.0
debt_share_of_limit_below = 0.25

[[rule]]
id = "usa.war-industry"
countries = ["USA"]
domain = "war"
goal = "military"
phase = "mid"
title = "Build war industry in the North before abolition"
detail = "Add arms industry, munition plants and artillery foundries in northern states."
why = "The USA starts with 4 arms, 1 munitions and 1 artillery level. In a civil war mobilised battalions consume far more goods than at peace, so shortages cut combat strength and imports drain the treasury. Owning the factories turns war spending into domestic wages and profit."
sources = ["https://vic3.paradoxwikis.com/Strategy:_America", "game files: common/history/buildings/05_north_america.txt"]
patch = "1.13"
[rule.when]
from_year = 1845
laws = ["law_legacy_slavery"]
levels_below = { building_arms_industry = 8.0 }

[[rule]]
id = "usa.manifest-destiny"
countries = ["USA"]
domain = "war"
goal = "manifest_destiny"
phase = "early"
title = "Take the Manifest Destiny decision, then let infamy decay"
detail = "Take the decision now; declare on Mexico only after infamy has fallen, with a mobilised conscript army you demobilise right after the war."
why = "The decision gives claims on Mexican regions and starts the Mexican Cession and Frontier Wars journals, whose completion adds American homelands. It costs about 24 infamy, so attacking at once invites great-power intervention and a costlier war."
sources = ["game files: common/decisions/manifest_destiny.txt", "https://vic3.paradoxwikis.com/United_States"]
patch = "1.13"
how = ["Decisions panel: take Manifest Destiny.", "Wait until your infamy (Diplomacy panel) has fallen, then start a Diplomatic Play against Mexico.", "Mobilise only the formations the play needs and press Demobilize right after the peace."]
[rule.when]
techs = ["nationalism"]
until_year = 1850

[[rule]]
id = "usa.texas"
countries = ["USA"]
domain = "war"
goal = "manifest_destiny"
phase = "opening"
title = "Annex Texas peacefully"
detail = "Raise relations with Texas to cordial and keep it out of other subject deals."
why = "Texan Statehood (je_texas_usa) completes when Texas is independent, not at war and at least cordial with the USA, which leads to peaceful annexation. If Mexico crushes Texas first, Texas becomes a war goal instead."
sources = ["game files: common/journal_entries/00_texas.txt", "https://vic3.paradoxwikis.com/Strategy:_America"]
patch = "1.13"
how = ["Diplomacy panel: select Texas, Actions, Improve Relations, until relations read Cordial.", "Then use the annexation action the journal or the Diplomacy panel offers."]
[rule.when]
until_year = 1845

[[rule]]
id = "usa.quinine"
countries = ["USA"]
domain = "economy"
goal = "manifest_destiny"
phase = "early"
title = "Research pharmaceuticals, then quinine"
detail = "They speed up frontier colonisation and unlock the western mapping expeditions needed for Oregon."
why = "Colonies are land without people; finishing them sooner gives room for farms and migrants, and the expeditions are a prerequisite for the Oregon journal."
sources = ["https://vic3.paradoxwikis.com/Strategy:_America"]
patch = "1.10"
[rule.when]
laws = ["law_frontier_colonization"]
techs_missing = ["quinine"]

[[rule]]
id = "usa.commercialized-agriculture"
countries = ["USA"]
domain = "laws"
goal = "industry"
phase = "mid"
title = "Enact Commercialized Agriculture now that slavery is gone"
detail = "Homesteading reserves 35% of arable land for subsistence farming."
why = "That reserve caps the farms and plantations you can build. Commercialized Agriculture frees the land and pushes peasants into wage work. Before abolition the Planters and Yeoman Farmers block it; after, it also weakens the Planters further."
sources = ["game files: common/laws/00_land_reform.txt", "https://vic3.paradoxwikis.com/Strategy:_America"]
patch = "1.13.9"
done = { type = "law_active", law = "law_commercialized_agriculture" }
[rule.when]
laws = ["law_homesteading", "law_slavery_banned"]
techs = ["mutual_funds"]

[[rule]]
id = "usa.multicultural"
countries = ["USA"]
domain = "laws"
goal = "reforms"
phase = "mid"
title = "Enact Multiculturalism to draw migrants"
detail = "The USA is short of people, not land; a Humanitarian interest-group leader makes the law easier."
why = "Migrants prefer countries that accept their culture, and Multiculturalism accepts all. It is also the main step of the Reconstruction journal (je_acw_equality) if the Civil War happened."
sources = ["https://vic3.paradoxwikis.com/Strategy:_America", "game files: law_multicultural (unlocked by human_rights)"]
patch = "1.10"
done = { type = "law_active", law = "law_multicultural" }
[rule.when]
laws = ["law_racial_segregation"]
techs = ["human_rights"]

[[rule]]
id = "usa.debt-during-debate"
countries = ["USA"]
domain = "economy"
priority = 1
goal = "slavery_debate"
phase = "mid"
title = "Get debt down while the slavery clock runs"
detail = "Slavery is banned and debt is over half the credit limit: in the Construction panel press Cancel Construction on the most expensive government projects, and in the Budget panel set Military Wages one step lower, until the debt falls."
why = "In the 10 years after abolition the pro-slavery revolt can still fire. High debt means a civil war would push you into default fast, and a stable surplus keeps standard of living up, which lowers radicalism in the southern states."
sources = ["https://vic3.paradoxwikis.com/Strategy:_America"]
patch = "1.13"
[rule.when]
laws = ["law_slavery_banned"]
until_year = 1880
debt_share_of_limit_at_least = 0.5

[[rule]]
id = "usa.planters-out"
countries = ["USA"]
domain = "laws"
priority = 1
goal = "slavery_debate"
phase = "mid"
title = "Remove the Southern Planters from government"
detail = "They are in government while slavery is banned."
why = "An interest group in government that hates a current law loses approval and radicalises its supporters. Planters in government after abolition is a direct path to the pro-slavery revolution that fails the Slavery Debate."
sources = ["game files: common/journal_entries/00_acw_entries.txt"]
patch = "1.13.9"
how = ["Politics panel: press Reform Government.", "Press Remove From Government on the Southern Planters and confirm."]
[rule.when]
laws = ["law_slavery_banned"]
igs_in_government = ["ig_landowners"]
