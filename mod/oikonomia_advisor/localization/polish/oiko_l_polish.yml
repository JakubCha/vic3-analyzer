 alert_oiko_debt_half_alert_name:0 "Dług ponad połowę limitu kredytu"
 alert_oiko_debt_half_alert_desc:0 "Dług wynosi [GetPlayer.MakeScope.ScriptValue('oiko_debt_share')|0%] limitu kredytu."
