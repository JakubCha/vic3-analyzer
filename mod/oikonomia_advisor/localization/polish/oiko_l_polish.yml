l_polish:
 oiko_numbers:0 "Saldo tygodniowe: #bold [GetPlayer.MakeScope.ScriptValue('oiko_balance')|D]#! @money!\nSkarbiec: #bold [GetPlayer.MakeScope.ScriptValue('oiko_treasury')|D]#! @money! (starczy na ok. #bold [GetPlayer.MakeScope.ScriptValue('oiko_weeks_to_debt')|0]#! tyg.)\nDług / limit kredytu: #bold [GetPlayer.MakeScope.ScriptValue('oiko_debt_share')|0%]#!\nWojsko w wydatkach: #bold [GetPlayer.MakeScope.ScriptValue('oiko_military_share')|0%]#!"

 je_oiko_budget_guard:0 "Strażnik budżetu"
 je_oiko_budget_guard_reason:0 "Państwo wydaje więcej, niż zarabia.\n\n#bold Jak to działa:#! deficyt sam w sobie nie jest problemem. Gdy skarbiec się wyczerpie, państwo pożycza, a pożyczka na budowę zwraca się z podatków i dywidend nowych zakładów. Problemem staje się, gdy dług opłaca utrzymanie (armię, administrację) zamiast wzrostu: rośnie, dochodzą odsetki, a gdy przekroczy limit kredytu, kraj bankrutuje (budowa staje, kary do produkcji, ataku i obrony do -50%).\n\n#bold Dźwignie:#! poziom podatków i płace (wojsko, urzędnicy) w panelu Budżetu, mniejsza lub tańsza armia w czasie pokoju, tańsze towary, które kupuje państwo (papier, broń), oraz nowe zakłady płacące podatki."
 je_oiko_budget_guard_status_deficit:0 "$oiko_numbers$\n\n#bold Deficyt, ale bez długu.#! Napraw go, póki skarbiec ma pieniądze: najpierw największa pozycja wydatków."
 je_oiko_budget_guard_status_danger:0 "$oiko_numbers$\n\n#bold Niebezpieczeństwo:#! pożyczasz i dalej tracisz pieniądze. Nie zaczynaj wojny ani nowych drogich ustaw; zetnij wydatki lub podnieś podatki o jeden poziom."
 je_oiko_budget_guard_status_critical:0 "$oiko_numbers$\n\n#bold Bankructwo blisko!#! Jeszcze w tym tygodniu: podatki o jeden poziom w górę, płace wojska i urzędników w dół, wstrzymaj najdroższe budowy."

 oiko_box_military:0 "[SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(GetPlayer.MakeScope.ScriptValue('oiko_military_target'), GetPlayer.MakeScope.ScriptValue('oiko_military_share')),'@green_checkmark_box!','@simple_box!')] Wojsko poniżej 40% wydatków (teraz [GetPlayer.MakeScope.ScriptValue('oiko_military_share')|0%])"
 oiko_box_balance:0 "[SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(GetPlayer.MakeScope.ScriptValue('oiko_balance'), GetPlayer.MakeScope.ScriptValue('oiko_zero')),'@green_checkmark_box!','@simple_box!')] Saldo tygodniowe nie jest ujemne (teraz [GetPlayer.MakeScope.ScriptValue('oiko_balance')|D] @money!)"
 oiko_box_paper:0 "[SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(GetPlayer.MakeScope.ScriptValue('oiko_paper_ok'), GetPlayer.MakeScope.ScriptValue('oiko_one')),'@green_checkmark_box!','@simple_box!')] Papier najwyżej 10% powyżej ceny bazowej (papiernie)"
 oiko_box_small_arms:0 "[SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(GetPlayer.MakeScope.ScriptValue('oiko_small_arms_ok'), GetPlayer.MakeScope.ScriptValue('oiko_one')),'@green_checkmark_box!','@simple_box!')] Broń strzelecka najwyżej 10% powyżej ceny bazowej (zakłady zbrojeniowe)"
 oiko_box_construction:0 "[SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(GetPlayer.MakeScope.ScriptValue('oiko_construction_levels'), GetPlayer.MakeScope.ScriptValue('oiko_construction_target')),'@green_checkmark_box!','@simple_box!')] Co najmniej 10 poziomów sektora budowlanego (teraz [GetPlayer.MakeScope.ScriptValue('oiko_construction_levels')|0])"

 je_oiko_pru_opening:0 "Playbook: otwarcie Prus"
 je_oiko_pru_opening_reason:0 "W 1836 roku armia to cały deficyt Prus: ok. 70% dochodów idzie na żołd i zaopatrzenie.\n\n#bold Jak to działa:#! od 1.13 każdy batalion płaci żołd przez koszary i kupuje broń, amunicję i zboże na rynku przez Centrum Logistyczne Armii, także w czasie pokoju. 81 batalionów piechoty lekkiej (2 broń + 1 amunicja tygodniowo każdy) kosztuje ok. 13,8 tys.; jako piechota liniowa byłoby to ok. 4,9 tys., mniej więcej cały deficyt. Pobór (centra poborowe) kosztuje prawie nic, dopóki go nie zwołasz.\n\n#bold Kolejność:#! 1) rozwiąż lub przezbrój ułanów, kirasjerów i dragonów, potem część piechoty lekkiej na tyłach; 2) papiernie (papier to większość z 16 tys. na administrację); 3) zbrojownie w Brandenburgii i tartaki na drewno; 4) sektory budowlane po jednym, z pieniędzy skarbca, nie z długu. Przed wojną o przywództwo z Austrią (lata 50.–60.) odbuduj armię na tanim, własnym uzbrojeniu."
 je_oiko_pru_opening_status:0 "$oiko_box_military$\n$oiko_box_balance$\n$oiko_box_paper$\n$oiko_box_small_arms$\n$oiko_box_construction$"

 je_oiko_pru_germany:0 "Playbook: droga do Niemiec"
 je_oiko_pru_germany_reason:0 "#bold Jak to działa:#! zjednoczenie zaczyna się od zapału kulturowego (północni Niemcy 40, południowi 30), który rośnie dzięki szkołom publicznym, piśmienności i technologiom nacjonalizmu. Federacja Północnoniemiecka powstaje, gdy kwestia Szlezwika-Holsztyna jest rozwiązana, masz nacjonalizm i jesteś jedynym kandydatem (zwykle po wygranej z Austrią w grze dyplomatycznej o przywództwo). Wtedy wszystkie państwa północnoniemieckie z twojego Zollvereinu lub popierające twoją kandydaturę zostają przyłączone. Na koniec potrzebujesz technologii #bold pan-nationalism#!, rangi mocarstwa i 73% stanów Wielkich Niemiec.\n\nWojna w deficycie to klasyczna droga do bankructwa: mobilizacja mnoży koszt broni i amunicji o 1,5 i dokłada zboże."
 je_oiko_pru_germany_status:0 "[SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(GetPlayer.MakeScope.ScriptValue('oiko_has_public_schools'), GetPlayer.MakeScope.ScriptValue('oiko_one')),'@green_checkmark_box!','@simple_box!')] Szkoły publiczne (zapał kulturowy)\n[SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(GetPlayer.MakeScope.ScriptValue('oiko_has_nationalism'), GetPlayer.MakeScope.ScriptValue('oiko_one')),'@green_checkmark_box!','@simple_box!')] Zbadany nacjonalizm\n[SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(GetPlayer.MakeScope.ScriptValue('oiko_schleswig_solved'), GetPlayer.MakeScope.ScriptValue('oiko_one')),'@green_checkmark_box!','@simple_box!')] Kwestia Szlezwika-Holsztyna rozwiązana\n[SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(GetPlayer.MakeScope.ScriptValue('oiko_war_chest_ok'), GetPlayer.MakeScope.ScriptValue('oiko_one')),'@green_checkmark_box!','@simple_box!')] Dług poniżej 30% limitu kredytu (gotowość do wojny)\n[SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(GetPlayer.MakeScope.ScriptValue('oiko_is_ngf'), GetPlayer.MakeScope.ScriptValue('oiko_one')),'@green_checkmark_box!','@simple_box!')] Federacja Północnoniemiecka utworzona\n[SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(GetPlayer.MakeScope.ScriptValue('oiko_has_pan_nationalism'), GetPlayer.MakeScope.ScriptValue('oiko_one')),'@green_checkmark_box!','@simple_box!')] Zbadany pan-nationalism"

 oiko.1.t:0 "Skarbiec na krawędzi bankructwa"
 oiko.1.d:0 "Państwo pożycza na bieżące wydatki, a dług zbliża się do limitu kredytu.\n\n$oiko_numbers$\n\n#bold Co zrobić od razu:#! podnieś podatki o jeden poziom, obniż płace wojska i urzędników o jeden poziom, wstrzymaj najdroższe budowy i nie zaczynaj wojny. Szczegóły i dźwignie: dziennik #bold Strażnik budżetu#!."
 oiko.1.f:0 "Po przekroczeniu limitu kredytu przychodzi niewypłacalność: budowa staje, a kary do produkcji, ataku i obrony rosną co tydzień aż do -50%."
 oiko.1.a:0 "Biorę się za budżet"
