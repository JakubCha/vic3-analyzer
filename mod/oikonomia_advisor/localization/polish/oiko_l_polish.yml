 rule_oiko_cheats:0 "Oikonomia: cheat menu"
 setting_oiko_cheats_off:0 "Wyłączone"
 setting_oiko_cheats_off_desc:0 "Bez cheat menu."
 setting_oiko_cheats_on:0 "Włączone"
 setting_oiko_cheats_on_desc:0 "Wpis w dzienniku z przyciskami: pieniądze, spłata długu, szybsze badania, budowa i ustawy, spokojniejsza ludność, mniej infamii, lepsze stosunki. Blokuje osiągnięcia."

 je_oiko_cheats:0 "Oikonomia: cheat menu"
 je_oiko_cheats_reason:0 "Cheaty do nauki bez zaczynania kampanii od nowa. Użyj ich, żeby wyjść z błędu, a potem usuń jego przyczynę: Strażnik budżetu i playbook mówią, co nią jest.\n\n#bold Ratunek budżetu:#! pieniądze, spłata długu (kończy też bankructwo).\n#bold Przyspieszenie (na rok):#! badania, budowa, uchwalanie ustaw.\n#bold Polityka:#! lojaliści, infamia, stosunki."
 oiko_cheat_cash_button:0 "Dodaj pieniądze"
 oiko_cheat_cash_button_desc:0 "Dodaje do skarbca około dziesięciu tygodni wydatków (co najmniej 100 tys.): [GetPlayer.MakeScope.ScriptValue('oiko_cheat_cash')|D] @money!."
 oiko_cheat_debt_button:0 "Spłać dług"
 oiko_cheat_debt_button_desc:0 "Dodaje pieniądze równe długowi, co go spłaca: [GetPlayer.MakeScope.ScriptValue('oiko_cheat_debt')|D] @money!. Kończy bankructwo."
 oiko_cheat_research_button:0 "Badania dwa razy szybciej (rok)"
 oiko_cheat_research_button_desc:0 "Podwaja tygodniową innowacyjność na rok."
 oiko_cheat_construction_button:0 "Więcej budowy (rok)"
 oiko_cheat_construction_button_desc:0 "Dodaje 50 punktów budowy tygodniowo na rok."
 oiko_cheat_laws_button:0 "Łatwiejsze ustawy (rok)"
 oiko_cheat_laws_button_desc:0 "Zwiększa o 50 punktów szansę powodzenia każdego etapu uchwalania ustawy, na rok."
 oiko_cheat_calm_button:0 "Uspokój ludność"
 oiko_cheat_calm_button_desc:0 "Zamienia część ludności w lojalistów."
 oiko_cheat_infamy_button:0 "Zmniejsz infamię o 10"
 oiko_cheat_infamy_button_desc:0 "Inne kraje zapominają część twojej agresji."
 oiko_cheat_relations_button:0 "Lepsze stosunki ze wszystkimi"
