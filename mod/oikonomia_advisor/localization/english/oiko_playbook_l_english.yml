l_english:
 je_oiko_pb_pru_opening_army:0 "Opening: Prussia's opening: the army is the deficit"
 je_oiko_pb_pru_opening_army_reason:0 "military · Opening\n\nThe 1836 army is 81 skirmish infantry plus heavy cavalry and mobile artillery, about 70% of income. Cut lancers, cuirassiers and dragoons, move rear skirmish battalions to line infantry (or disband part), and keep the conscription centers as the wartime reserve.\n\nHow to do it:\n1. Budget panel: the tax level and the Military Wages and Government Wages levels are set there; change the one the detail names by one step.\n2. Army: open an army, its Buildings tab, a Barracks, and press Downsize once per battalion you do not need in peacetime.\n3. Construction panel: if the detail says to pause building, press Cancel Construction on the most expensive item in the queue.\n\nHow it works: At base prices the skirmish infantry alone cost about 13.8K a week in small arms and ammunition; as line infantry the same 81 battalions would cost about 4.9K, roughly the whole starting deficit. Conscripts cost almost nothing until raised. Treat the cut as temporary: rebuild a modern army on cheap domestic arms before the leadership war with Austria in the 1850s–60s.\n\nSources (1.13.9): game files: common/history/military_formations/00_military_formations_europe.txt, common/combat_unit_types/00_land_combat_unit_types.txt, https://vic3.paradoxwikis.com/Prussia"
 je_oiko_pb_pru_opening_army_status:0 "Now:\nMilitary share of spending: #bold [GetPlayer.MakeScope.ScriptValue('oiko_military_share')|0%]#! (rule: from 45%)"
 je_oiko_pb_sar_construction:0 "Opening: Queue two more construction sector levels in Piedmont first"
 je_oiko_pb_sar_construction_reason:0 "industry · Opening\n\nSardinia-Piedmont starts with a single construction sector, so every other project waits in line. Use Iron Frame Buildings: iron is cheap at the start.\n\nHow to do it:\n1. Open the Construction panel and choose Construction Sector.\n2. Pick the state the analyzer's Now list or Market tab names (resources, workers, payback) and queue a level.\n\nHow it works: A construction sector is a state building: its wages and its iron, tools and wood show up as government spending. Add levels only while the weekly balance stays positive, or a bigger queue just drains the [Concept('concept_treasury','treasury')] faster.\n\nSources (1.12): https://vic3.paradoxwikis.com/Sardinia-Piedmont, game files: common/history/buildings/01_south_europe.txt"
 je_oiko_pb_sar_construction_status:0 "Now:\nWeekly balance: #bold [GetPlayer.MakeScope.ScriptValue('oiko_balance')|D]#! @money!\nConstruction Sector: #bold [GetPlayer.MakeScope.ScriptValue('oiko_lvl_building_construction_sector')|0]#! levels (rule: below 3)"
 je_oiko_pb_aus_per_capita:0 "Opening: First law: switch to Per-Capita Taxation"
 je_oiko_pb_aus_per_capita_reason:0 "budget · Opening\n\nLand-based taxation leaves 20 million pops paying almost no direct tax.\n\nHow to do it:\n1. Open the Politics panel, Laws tab, and find Per Capita Based Taxation.\n2. Press Enact. Enactment takes months: keep the interest groups that support it in government, and watch the chance of success.\n3. Before it passes, check its effect on the budget: schools, health, police and welfare laws cost money every week.\n\nHow it works: Land-based taxation only taxes land rents and consumption: no poll tax and no income tax. Per-capita taxation adds a poll tax on every pop plus a small income tax, Austria's single biggest revenue lever, and it is unlocked from day one. The Geheime Staatskonferenz slows every enactment by 20%, so pass laws one at a time and start with this one.\n\nSources (1.13.9): game files: common/laws/00_taxation.txt, common/amendments/00_amendments_historical_04.txt"
 je_oiko_pb_aus_tax_capacity:0 "Opening: Build government administrations in Bohemia, Moravia, the Galicias and Lombardy"
 je_oiko_pb_aus_tax_capacity_reason:0 "budget · Opening\n\nBefore new factories there: these states are far over their tax capacity.\n\nHow to do it:\n1. Open the Construction panel and choose Government Administration.\n2. Pick the state the analyzer's Now list or Market tab names (resources, workers, payback) and queue a level.\n\nHow it works: A state taxes only 10,000 pops per point of tax capacity: 100 base points plus about 10 per administration level. Bohemia (4.15M pops), Moravia (2.1M with 1 level), both Galicias and Lombardy are well over that, so every tax there is cut proportionally. Administrations cost wages and paper but raise the yield of taxes you already levy.\n\nSources (1.13): game files: common/defines/00_defines.txt, common/production_methods/07_government.txt, https://vic3.paradoxwikis.com/Strategy:_Austria"
 je_oiko_pb_aus_tax_capacity_status:0 "Now:\nGovernment Administration: #bold [GetPlayer.MakeScope.ScriptValue('oiko_lvl_building_government_administration')|0]#! levels (rule: below 60)"
 je_oiko_pb_gbr_grain_warning:0 "Early game: Grain is over 25% above base: defuse the Corn Laws crisis"
 je_oiko_pb_gbr_grain_warning_reason:0 "corn_laws · Early game\n\nCut the grain import tariff or build rye farms in the Irish states.\n\nHow to do it:\n1. Open the Market panel and find Grain: its tooltip shows which buildings make it.\n2. The analyzer's Market tab names the building, the state to build in and any input that is dear too.\n\nHow it works: The Corn Laws journal activates when grain is more than 25% above base and the Landowners are powerful and in government, and its events include a bread-starvation event. Ship upkeep also consumes grain, so a big navy pushes the price up.\n\nSources (1.13.9): game files: common/journal_entries/00_corn_laws.txt, common/ship_types/00_ship_types.txt"
 je_oiko_pb_fra_census_before_1848:0 "Early game: Pass Census Voting before 1848"
 je_oiko_pb_fra_census_before_1848_reason:0 "reforms · Early game\n\nEnact Census Voting while the Intelligentsia are in government; the 200-franc amendment survives it.\n\nHow to do it:\n1. Open the Politics panel, Laws tab, and find Census Voting.\n2. Press Enact. Enactment takes months: keep the interest groups that support it in government, and watch the chance of success.\n3. Before it passes, check its effect on the budget: schools, health, police and welfare laws cost money every week.\n\nHow it works: Owning Egalitarianism draws France into the Springtime of the Peoples, which adds 25–35% to radicalism and to liberal and radical movement support. You get through it without a revolution if a liberal group governs and Census Voting or Universal Suffrage is in force.\n\nSources (1.13.9): game files: common/journal_entries/00_peoples_springtime_je.txt, common/amendments/00_amendments_historical_04.txt"
 je_oiko_pb_aus_metternich:0 "Early game: Bring the Landowners back into government within six months"
 je_oiko_pb_aus_metternich_reason:0 "metternich · Early game\n\nThe Age of Metternich fails after 6 months without them.\n\nHow to do it:\n1. Politics panel: press Reform Government.\n2. Press Add To Government on the Landowners and confirm, within six months.\n\nHow it works: je_metternich fails once the Landowners have been out of government for more than 6 consecutive months, and Metternich resigns and flees. Keep them in until Franz Joseph takes the throne for the orderly retirement instead.\n\nSources (1.13.9): game files: common/journal_entries/05_metternich.txt"
 je_oiko_pb_aus_before_1848:0 "Early game: Get solvent before the 1848 wave"
 je_oiko_pb_aus_before_1848_reason:0 "stability · Early game\n\nPay down debt and get the weekly balance positive.\n\nHow to do it:\n1. Budget panel: the tax level and the Military Wages and Government Wages levels are set there; change the one the detail names by one step.\n2. Army: open an army, its Buildings tab, a Barracks, and press Downsize once per battalion you do not need in peacetime.\n3. Construction panel: if the detail says to pause building, press Cancel Construction on the most expensive item in the queue.\n\nHow it works: The Springtime of the Peoples starts as soon as any European great power has a 25% revolution, and Austria's Egalitarianism pulls it in. A revolution takes states and their taxes away and forces [Concept('concept_mobilize_army','mobilisation')], so income falls as costs rise; entering it in deficit means bankruptcy. A 25% revolution also fails the Metternich journal.\n\nSources (1.13.9): game files: common/on_actions/00_code_on_actions.txt, common/journal_entries/00_peoples_springtime_je.txt"
 je_oiko_pb_aus_before_1848_status:0 "Now:\nWeekly balance: #bold [GetPlayer.MakeScope.ScriptValue('oiko_balance')|D]#! @money!"
 je_oiko_pb_gg_leave_isolationism:0 "Early game: Leave Isolationism: enact Free Trade"
 je_oiko_pb_gg_leave_isolationism_reason:0 "industry · Early game\n\nYou have International Trade and still run Isolationism: enact Free Trade (or Mercantilism if Free Trade cannot pass).\n\nHow to do it:\n1. Politics panel, Laws, Trade Policy group: find Free Trade and press Enact.\n2. If its chance of success is low, enact Mercantilism instead; it needs the same technology.\n\nHow it works: Isolationism forbids all trade, cuts technology spread by 15% and blocks Laissez-Faire. Its +50% Authority and +25% tax capacity do not make up for a market that cannot import what it lacks or sell what it overproduces.\n\nSources (1.13.9): Generalist Gaming: How to Start a Game: Evaluating Nations & Pre-Unpause Actions, game files: common/laws/00_trade_policy.txt:159-203 (law_isolationism: country_disallow_trade_bool, country_tech_spread_mult -0.15), 96-108 (law_free_trade: international_trade), common/laws/00_economic_system.txt:462 (law_laissez_faire disallowed by law_isolationism)"
 je_oiko_pb_pru_war_chest:0 "Mid game: Do not start a unification war with this much debt"
 je_oiko_pb_pru_war_chest_reason:0 "unification · Mid game\n\nDebt is over 30% of the [Concept('concept_credit','credit limit')]: first rebuild a buffer of about 20 weeks of military cost.\n\nHow to do it:\n1. Budget panel: the tax level and the Military Wages and Government Wages levels are set there; change the one the detail names by one step.\n2. Army: open an army, its Buildings tab, a Barracks, and press Downsize once per battalion you do not need in peacetime.\n3. Construction panel: if the detail says to pause building, press Cancel Construction on the most expensive item in the queue.\n\nHow it works: [Concept('concept_mobilize_army','Mobilisation')] multiplies weapon and ammunition upkeep by 1.5 and adds grain, occupied states pay no tax, and war exhaustion grows. Entering a long war with debt already high is the classic way to [Concept('concept_default','default')] mid-war, and default also costs -5% to -50% offense and defense.\n\nSources (1.13.9): https://vic3.paradoxwikis.com/Budget, game files: common/mobilization_options/00_mobilization_option.txt"
 je_oiko_pb_pru_war_chest_status:0 "Now:\nDebt / credit limit: #bold [GetPlayer.MakeScope.ScriptValue('oiko_debt_share')|0%]#! (rule: from 30%)"
 je_oiko_pb_usa_abolition_ready:0 "Mid game: You are ready: enact Slavery Banned"
 je_oiko_pb_usa_abolition_ready_reason:0 "slavery_debate · Mid game\n\nThe Planters are out of government and weak, and the budget is healthy. Start Slavery Banned and avoid any other war or big law change until the debate ends.\n\nHow to do it:\n1. Open the Politics panel, Laws tab, and find Slavery Banned.\n2. Press Enact. Enactment takes months: keep the interest groups that support it in government, and watch the chance of success.\n3. Before it passes, check its effect on the budget: schools, health, police and welfare laws cost money every week.\n\nHow it works: The Slavery Debate (je_acw_countdown) completes only after slavery has been banned for 10 years with no civil war. The war starts when the pro-slavery movement revolts, which is easier the stronger the Planters and the more unstable the country. A war fought in debt ends in [Concept('concept_default','default')] quickly, so start from a surplus.\n\nSources (1.13): game files: common/journal_entries/00_acw_entries.txt, https://vic3.paradoxwikis.com/Strategy:_America"
 je_oiko_pb_usa_abolition_ready_status:0 "Now:\nDebt / credit limit: #bold [GetPlayer.MakeScope.ScriptValue('oiko_debt_share')|0%]#! (rule: below 25%)\nWeekly balance: #bold [GetPlayer.MakeScope.ScriptValue('oiko_balance')|D]#! @money!"
 je_oiko_pb_usa_debt_during_debate:0 "Mid game: Get debt down while the slavery clock runs"
 je_oiko_pb_usa_debt_during_debate_reason:0 "slavery_debate · Mid game\n\nSlavery is banned and debt is over half the [Concept('concept_credit','credit limit')]: in the Construction panel press Cancel Construction on the most expensive government projects, and in the Budget panel set Government Wages one step lower (not Military Wages: Low costs -50% training rate), until the debt falls.\n\nHow to do it:\n1. Budget panel: the tax level and the Military Wages and Government Wages levels are set there; change the one the detail names by one step.\n2. Army: open an army, its Buildings tab, a Barracks, and press Downsize once per battalion you do not need in peacetime.\n3. Construction panel: if the detail says to pause building, press Cancel Construction on the most expensive item in the queue.\n\nHow it works: In the 10 years after abolition the pro-slavery revolt can still fire. High debt means a civil war would push you into [Concept('concept_default','default')] fast, and a stable surplus keeps [Concept('concept_sol','standard of living')] up, which lowers radicalism in the southern states.\n\nSources (1.13): https://vic3.paradoxwikis.com/Strategy:_America"
 je_oiko_pb_usa_debt_during_debate_status:0 "Now:\nDebt / credit limit: #bold [GetPlayer.MakeScope.ScriptValue('oiko_debt_share')|0%]#! (rule: from 50%)"
 je_oiko_pb_usa_planters_out:0 "Mid game: Remove the Southern Planters from government"
 je_oiko_pb_usa_planters_out_reason:0 "slavery_debate · Mid game\n\nThey are in government while slavery is banned.\n\nHow to do it:\n1. Politics panel: press Reform Government.\n2. Press Remove From Government on the Southern Planters and confirm.\n\nHow it works: An [Concept('concept_interest_group','interest group')] in government that hates a current law loses [Concept('concept_approval','approval')] and radicalises its supporters. Planters in government after abolition is a direct path to the pro-slavery revolution that fails the Slavery Debate.\n\nSources (1.13.9): game files: common/journal_entries/00_acw_entries.txt"
 je_oiko_pb_sar_war_chest:0 "Mid game: Build a reserve before any war with Austria"
 je_oiko_pb_sar_war_chest_reason:0 "unification · Mid game\n\nDebt is over 30% of the [Concept('concept_credit','credit limit')]: do not start the unification play or a war with Austria yet.\n\nHow to do it:\n1. Budget panel: the tax level and the Military Wages and Government Wages levels are set there; change the one the detail names by one step.\n2. Army: open an army, its Buildings tab, a Barracks, and press Downsize once per battalion you do not need in peacetime.\n3. Construction panel: if the detail says to pause building, press Cancel Construction on the most expensive item in the queue.\n\nHow it works: [Concept('concept_mobilize_army','Mobilisation')] raises military wages and goods sharply while war exhaustion and blockades cut income. A debt-funded war against Austria is the fastest route to bankruptcy.\n\nSources (1.13): https://vic3.paradoxwikis.com/Budget"
 je_oiko_pb_sar_war_chest_status:0 "Now:\nDebt / credit limit: #bold [GetPlayer.MakeScope.ScriptValue('oiko_debt_share')|0%]#! (rule: from 30%)"
 je_oiko_pb_fra_natural_borders:0 "Mid game: Not now: Natural Borders needs a sound budget"
 je_oiko_pb_fra_natural_borders_reason:0 "natural_borders · Mid game\n\nDo not start the push for the Rhine and Belgium while losing money or carrying heavy debt.\n\nHow to do it:\n1. Budget panel: the tax level and the Military Wages and Government Wages levels are set there; change the one the detail names by one step.\n2. Army: open an army, its Buildings tab, a Barracks, and press Downsize once per battalion you do not need in peacetime.\n3. Construction panel: if the detail says to pause building, press Cancel Construction on the most expensive item in the queue.\n\nHow it works: Natural Borders targets Belgium and Prussia's Rhineland: major wars and heavy infamy. [Concept('concept_mobilize_army','Mobilisation')] multiplies military spending, so starting it in deficit is a fast way to [Concept('concept_default','default')].\n\nSources (1.13.9): game files: common/journal_entries/01_natural_borders_of_france.txt, https://vic3.paradoxwikis.com/France"
 je_oiko_pb_fra_natural_borders_status:0 "Now:\nWeekly balance: #bold [GetPlayer.MakeScope.ScriptValue('oiko_balance')|D]#! @money!"
 je_oiko_pb_aus_dual_monarchy_blocks_germany:0 "Mid game: Do not establish the Dual Monarchy if you want Germany"
 je_oiko_pb_aus_dual_monarchy_blocks_germany_reason:0 "unification · Mid game\n\nThe button is now available; choose your track: Greater Germany or a Habsburg empire.\n\nHow to do it:\n1. If you want Germany: do not press the Dual Monarchy button in the journal.\n2. If you want a Habsburg empire instead: press it.\n\nHow it works: Germany cannot be formed by a dual or triple monarchy, and the button's own tooltip says so. Clicking it rules out Greater Germany for good; choose it only for the Habsburg track (Dual Monarchy, then the Federal Solution).\n\nSources (1.13.9): game files: common/scripted_buttons/05_austria_buttons.txt, common/country_formation/00_major_formables.txt"
 je_oiko_pb_aus_no_war_on_credit:0 "Mid game: No leadership war against Prussia on credit"
 je_oiko_pb_aus_no_war_on_credit_reason:0 "unification · Mid game\n\nClear debt before you start or accept the German leadership play.\n\nHow to do it:\n1. Budget panel: the tax level and the Military Wages and Government Wages levels are set there; change the one the detail names by one step.\n2. Army: open an army, its Buildings tab, a Barracks, and press Downsize once per battalion you do not need in peacetime.\n3. Construction panel: if the detail says to pause building, press Cancel Construction on the most expensive item in the queue.\n\nHow it works: Mobilising pulls workers out of factories, cutting taxes, while military goods spending jumps and interest compounds. Prussia's army is about the size of yours and Austria's infantry-heavy army does better defending, so expect a long war a deficit cannot carry.\n\nSources (1.13): https://vic3.paradoxwikis.com/Strategy:_Austria"
 je_oiko_pb_aus_no_war_on_credit_status:0 "Now:\nDebt / credit limit: #bold [GetPlayer.MakeScope.ScriptValue('oiko_debt_share')|0%]#! (rule: from 25%)"
 je_oiko_pb_ita_integrate:0 "Late game: Absorb Italy before expanding further"
 je_oiko_pb_ita_integrate_reason:0 "reforms · Late game\n\nStart no new Diplomatic Play. In each new state, Emilia first: build a Railway where [Concept('concept_infrastructure','infrastructure')] is short, a Government Administration if [Concept('concept_bureaucracy','bureaucracy')] is short (Budget panel), and set its buildings to the production methods your other states use.\n\nHow to do it:\n1. Budget panel: the tax level and the Military Wages and Government Wages levels are set there; change the one the detail names by one step.\n2. Army: open an army, its Buildings tab, a Barracks, and press Downsize once per battalion you do not need in peacetime.\n3. Construction panel: if the detail says to pause building, press Cancel Construction on the most expensive item in the queue.\n\nHow it works: Formation multiplies your size 4–6 times overnight. The new states bring unemployed pops, missing bureaucracy and old production methods, so the administrative and wage bill jumps before their taxes arrive.\n\nSources (1.12): https://vic3.paradoxwikis.com/Sardinia-Piedmont, https://vic3.paradoxwikis.com/Two_Sicilies"
 je_oiko_pb_ita_integrate_status:0 "Now:\nWeekly balance: #bold [GetPlayer.MakeScope.ScriptValue('oiko_balance')|D]#! @money!"
 je_oiko_pb_gen_near_default:0 "Any time: Default is close: act this week"
 je_oiko_pb_gen_near_default_reason:0 "budget · Any time\n\nRaise the tax level one step and lower Government Wages one step (not Military Wages). Do not cancel all construction: remove Construction Sector levels one at a time, Downsize government buildings you can spare (universities first) and demobilise.\n\nHow to do it:\n1. Budget panel: raise the tax level one step and set Government Wages one step lower. Leave Military Wages at Medium.\n2. Open a Construction Sector and press Downsize once; repeat a week later only if the balance is still falling.\n3. Open your University (and other government buildings you can spare) and press Downsize.\n4. Military panel: Demobilize all armies if you are mobilised in peace.\n\nHow it works: At the [Concept('concept_credit','credit limit')] the country defaults. Construction stops, and [Concept('concept_throughput','throughput')], offense and defense take -5% at once, worsening by -1% a week down to -50%. Lowering Military Wages to Low cuts the training rate by 50% (Very Low by 75%), so battalions empty out; Government Wages cost only a little [Concept('concept_approval','approval')] and prestige. Stopping all construction at once throws its workers out of work and deepens the slump.\n\nSources (1.13.9): https://vic3.paradoxwikis.com/Budget, game files: common/static_modifiers/00_code_static_modifiers.txt (military_wages_low, government_wages_low), Generalist Gaming: The Most Common MISTAKE Intermediate Players Make"
 je_oiko_pb_gen_near_default_status:0 "Now:\nDebt / credit limit: #bold [GetPlayer.MakeScope.ScriptValue('oiko_debt_share')|0%]#! (rule: from 85%)\nWeekly balance: #bold [GetPlayer.MakeScope.ScriptValue('oiko_balance')|D]#! @money!"
 je_oiko_pb_gen_tax_bridge:0 "Any time: Debt is nearing half the credit limit: raise taxes one level as a bridge"
 je_oiko_pb_gen_tax_bridge_reason:0 "budget · Any time\n\nRaise the tax level one step in the Budget panel now, and plan to lower it again once spending is cut or new industry pays taxes.\n\nHow to do it:\n1. Budget panel: the tax level and the Military Wages and Government Wages levels are set there; change the one the detail names by one step.\n2. Army: open an army, its Buildings tab, a Barracks, and press Downsize once per battalion you do not need in peacetime.\n3. Construction panel: if the detail says to pause building, press Cancel Construction on the most expensive item in the queue.\n\nHow it works: An empty [Concept('concept_treasury','treasury')] alone is no reason: the state then borrows cheaply. Once debt approaches half the [Concept('concept_credit','credit limit')], the game's unhealthy line, interest starts to bite and a tax bridge buys time. Great powers have more room (half the interest).\n\nSources (1.13.9): https://vic3.paradoxwikis.com/Budget, game files: common/laws/00_taxation.txt, common/defines (CREDIT_RATIO_HEALTH_THRESHOLD = 0.5)"
 je_oiko_pb_gen_tax_bridge_status:0 "Now:\nDebt / credit limit: #bold [GetPlayer.MakeScope.ScriptValue('oiko_debt_share')|0%]#! (rule: from 35%)\nWeekly balance: #bold [GetPlayer.MakeScope.ScriptValue('oiko_balance')|D]#! @money!"
 je_oiko_pb_gen_radicals_high:0 "Any time: Radicals are over 15% of the population"
 je_oiko_pb_gen_radicals_high_reason:0 "stability · Any time\n\nStop enacting a law the largest interest groups oppose, and build what makes the dearest of grain, clothes and furniture (the analyzer's Market tab names the building and the state).\n\nHow to do it:\n1. Politics panel, Interest Groups: hover each group to see how many [Concept('concept_radical','radicals')] it has.\n2. If you are enacting a law the groups with the most radicals oppose, stop enacting it (Politics panel, the law in progress).\n3. Analyzer, Market tab: build what it lists for the dearest of Grain, Clothes and Furniture.\n\nHow it works: Radicals lower [Concept('concept_legitimacy','legitimacy')] and fuel political movements that can revolt. A revolution splits off states and their buildings; prevention is cheaper than the civil war.\n\nSources (1.13.9): game files: radical_fraction trigger, common/journal_entries/00_fascism.txt"
 je_oiko_pb_gen_minor_no_deficit:0 "Any time: Not a major power: stop borrowing"
 je_oiko_pb_gen_minor_no_deficit_reason:0 "budget · Any time\n\nYou are losing money and already in debt. Below major-power rank your loans carry no rank discount: balance the budget instead of borrowing to build.\n\nHow to do it:\n1. Budget panel: set Government Wages one step lower.\n2. Budget panel: raise the tax level one step (to High at most while your poorest pops stay above their expected [Concept('concept_sol','standard of living')]).\n3. Construction panel: queue only buildings the analyzer ranks with a short payback until the balance is positive.\n\nHow it works: Great powers pay half the loan interest from their rank alone; smaller countries pay full interest, and their [Concept('concept_credit','credit limit')] is small, so a deficit compounds fast. The guides' rule: great and major powers may run deficits to build, minor and unrecognised countries should not.\n\nSources (1.13.9): game files: common/country_ranks/00_country_ranks.txt, Generalist Gaming: How to Make FREE MONEY in Victoria 3"
 je_oiko_pb_gen_minor_no_deficit_status:0 "Now:\nDebt / credit limit: #bold [GetPlayer.MakeScope.ScriptValue('oiko_debt_share')|0%]#!\nWeekly balance: #bold [GetPlayer.MakeScope.ScriptValue('oiko_balance')|D]#! @money!"
 je_oiko_pb_gg_leave_industry_banned:0 "Any time: Repeal Industry Banned"
 je_oiko_pb_gg_leave_industry_banned_reason:0 "industry · Any time\n\nIndustry Banned is active: enact Agrarianism (or Interventionism, or Laissez-Faire once you have International Trade) to replace it.\n\nHow to do it:\n1. Politics panel, Laws tab, Economic System group: find Agrarianism (or Interventionism, or Laissez-Faire if available) and press Enact.\n2. Hover the law to see which interest groups support it; if the chance of success is low, add one of them to the government with Reform Government.\n\nHow it works: Industry Banned cuts production research speed and production tech spread by 25%, lowers expected [Concept('concept_sol','standard of living')] by 10%, removes 10% of peasant education access, and on enactment demolishes every steel mill, motor industry, chemical plant, power plant and munition plant. Its one economic upside, +25% aristocrat contribution to the [Concept('concept_investment_pool','investment pool')], takes the money out of the owners' pockets instead of adding to it.\n\nSources (1.13.9): Generalist Gaming: BEST Economic Laws, Generalist Gaming: Private Ownership & the Investment Pool, game files: common/laws/00_economic_system.txt:241-346 (law_industry_banned: modifiers at 313-329, demolitions at 256-310)"
 je_oiko_pb_pru_opening_plan:0 "Opening: Prussia's first two years: stop the bleeding, then compound"
 je_oiko_pb_pru_opening_plan_reason:0 "industry · Opening\n\nIn order: cut the army bill, build paper mills (paper is most of the 16K government-goods bill), build arms industry in Brandenburg and logging camps for wood, then add construction sectors one at a time, funded by the [Concept('concept_treasury','treasury')], not by debt.\n\nHow to do it:\n1. Army: open an army, its Buildings tab, a Barracks, and press Downsize once per battalion you do not need in peacetime (cavalry first).\n2. Construction panel: queue Paper Mills first, then Arms Industries in Brandenburg, then Logging Camps.\n3. Queue Construction Sector levels one at a time, only while the treasury in the Budget panel is above zero.\n\nHow it works: The treasury lasts about 15 months at the starting deficit. That is enough to fund construction that pays back, but not a permanently oversized army. Factories that employ peasants turn poll-tax subsistence farmers into wage earners who pay income tax.\n\nSources (1.13.9): https://vic3.paradoxwikis.com/Prussia, https://vic3.paradoxwikis.com/Budget, game files: common/production_methods/07_government.txt"
 je_oiko_pb_gbr_no_new_navy:0 "Opening: No new ships or naval administration in the opening"
 je_oiko_pb_gbr_no_new_navy_reason:0 "military · Opening\n\nSpend construction on sectors and industry instead: nobody can contest the Royal Navy in the 1830s.\n\nHow to do it:\n1. Budget panel: the tax level and the Military Wages and Government Wages levels are set there; change the one the detail names by one step.\n2. Army: open an army, its Buildings tab, a Barracks, and press Downsize once per battalion you do not need in peacetime.\n3. Construction panel: if the detail says to pause building, press Cancel Construction on the most expensive item in the queue.\n\nHow it works: Each naval administration level puts 1,000 soldiers and officers on the military wage bill, and Britain's 136 levels already crew about 124,000 sailors for 196 ships. New hulls add grain, hardwood and wage upkeep with no strategic return.\n\nSources (1.13.9): game files: common/buildings/05_military.txt, common/ship_types/00_ship_types.txt, https://vic3.paradoxwikis.com/Patch_1.13"
 je_oiko_pb_gbr_no_new_navy_status:0 "Now:\nWeekly balance: #bold [GetPlayer.MakeScope.ScriptValue('oiko_balance')|D]#! @money!\nNaval Administration: #bold [GetPlayer.MakeScope.ScriptValue('oiko_lvl_building_naval_administration')|0]#! levels (rule: at least 100)"
 je_oiko_pb_gbr_construction:0 "Opening: Add construction sectors in Lancashire and Yorkshire"
 je_oiko_pb_gbr_construction_reason:0 "industry · Opening\n\nBritain starts with only 9 construction sector levels for the world's richest economy: add levels until the weekly surplus is close to zero.\n\nHow to do it:\n1. Open the Construction panel and choose Construction Sector.\n2. Pick the state the analyzer's Now list or Market tab names (resources, workers, payback) and queue a level.\n\nHow it works: Construction capacity is the bottleneck for every other plan. Lancashire and Yorkshire hold the coal (45 of 59 levels) and the tools, so sectors there keep their input chain short.\n\nSources (1.13.9): game files: common/history/buildings/00_west_europe.txt"
 je_oiko_pb_gbr_construction_status:0 "Now:\nWeekly balance: #bold [GetPlayer.MakeScope.ScriptValue('oiko_balance')|D]#! @money!\nConstruction Sector: #bold [GetPlayer.MakeScope.ScriptValue('oiko_lvl_building_construction_sector')|0]#! levels (rule: below 20)"
 je_oiko_pb_usa_construction_sectors:0 "Opening: Turn the surplus into construction sectors in New York and Pennsylvania"
 je_oiko_pb_usa_construction_sectors_reason:0 "industry · Opening\n\nThe USA starts with only 6 construction sector levels for a huge territory: add sectors in NY or PA (iron and coal nearby) until the weekly surplus is close to zero.\n\nHow to do it:\n1. Open the Construction panel and choose Construction Sector.\n2. Pick the state the analyzer's Now list or Market tab names (resources, workers, payback) and queue a level.\n\nHow it works: Every plan is limited by build speed. Construction sectors are paid from the budget through the goods they consume, so a surplus converts directly into build speed; stop when the surplus is gone, not when the queue is empty. The sectors start on Iron Frame, so watch iron and tools prices.\n\nSources (1.13): https://vic3.paradoxwikis.com/Strategy:_America, https://vic3.paradoxwikis.com/United_States, game files: common/history/buildings/05_north_america.txt"
 je_oiko_pb_usa_construction_sectors_status:0 "Now:\nWeekly balance: #bold [GetPlayer.MakeScope.ScriptValue('oiko_balance')|D]#! @money!\nConstruction Sector: #bold [GetPlayer.MakeScope.ScriptValue('oiko_lvl_building_construction_sector')|0]#! levels (rule: below 10)"
 je_oiko_pb_usa_luxury_taxes:0 "Opening: Tax luxuries before raising the general tax level"
 je_oiko_pb_usa_luxury_taxes_reason:0 "budget · Opening\n\nPut consumption taxes on Services and Transportation in the Budget panel: the wealthy buy most of them, and in 1.13.9 tobacco, liquor, wine and luxury goods cannot be taxed at all.\n\nHow to do it:\n1. Budget panel: the tax level and the Military Wages and Government Wages levels are set there; change the one the detail names by one step.\n2. Army: open an army, its Buildings tab, a Barracks, and press Downsize once per battalion you do not need in peacetime.\n3. Construction panel: if the detail says to pause building, press Cancel Construction on the most expensive item in the queue.\n\nHow it works: The USA starts at a Low tax level with very wealthy pops, so luxury consumption taxes mostly hit middle and upper strata who can afford them. Per-capita tax hits every pop equally, so raising the general level pushes poor workers into lower [Concept('concept_sol','standard of living')] and radicalism. Consumption taxes cost authority, not money.\n\nSources (1.13.9): https://vic3.paradoxwikis.com/Strategy:_America, game files: common/goods/00_goods.txt (consumption_tax_cost only on 15 goods), common/goods/goods.md"
 je_oiko_pb_usa_luxury_taxes_status:0 "Now:\nWeekly balance: #bold [GetPlayer.MakeScope.ScriptValue('oiko_balance')|D]#! @money!"
 je_oiko_pb_usa_texas:0 "Opening: Annex Texas peacefully"
 je_oiko_pb_usa_texas_reason:0 "manifest_destiny · Opening\n\nRaise relations with Texas to cordial and keep it out of other subject deals.\n\nHow to do it:\n1. Diplomacy panel: select Texas, Actions, Improve Relations, until relations read Cordial.\n2. Then use the annexation action the journal or the Diplomacy panel offers.\n\nHow it works: Texan Statehood (je_texas_usa) completes when Texas is independent, not at war and at least cordial with the USA, which leads to peaceful annexation. If Mexico crushes Texas first, Texas becomes a war goal instead.\n\nSources (1.13): game files: common/journal_entries/00_texas.txt, https://vic3.paradoxwikis.com/Strategy:_America"
 je_oiko_pb_sar_coal:0 "Opening: Open coal mines in Piedmont"
 je_oiko_pb_sar_coal_reason:0 "industry · Opening\n\nYou start with no coal mines; Piedmont can hold 28 levels.\n\nHow to do it:\n1. Open the Construction panel and choose Coal Mine.\n2. Pick the state the analyzer's Now list or Market tab names (resources, workers, payback) and queue a level.\n\nHow it works: Atmospheric Engine is already researched: its steam production methods burn coal, and so do railways. Importing all of it keeps the price high and pushes up input costs across the economy.\n\nSources (1.12): https://vic3.paradoxwikis.com/Sardinia-Piedmont, game files: map_data/state_regions/01_south_europe.txt"
 je_oiko_pb_sar_coal_status:0 "Now:\nCoal Mine: #bold [GetPlayer.MakeScope.ScriptValue('oiko_lvl_building_coal_mine')|0]#! levels (rule: below 1)"
 je_oiko_pb_sar_railways_research:0 "Opening: Research railways now"
 je_oiko_pb_sar_railways_research_reason:0 "industry · Opening\n\nBoth prerequisites are owned at the start, so railways is one step away.\n\nHow to do it:\n1. Open the Technology panel and put Railways first in its queue.\n\nHow it works: Railways raise [Concept('concept_infrastructure','infrastructure')] and [Concept('concept_market_access','market access')]; without them Piedmont's goods cannot reach the rest of your market and new buildings run below capacity. The wiki calls early railways a priority for Sardinia-Piedmont.\n\nSources (1.12): game files: common/technology/technologies/10_production.txt, https://vic3.paradoxwikis.com/Sardinia-Piedmont"
 je_oiko_pb_sar_subventions:0 "Opening: Drop the import subventions on small arms and artillery"
 je_oiko_pb_sar_subventions_reason:0 "budget · Opening\n\nIn the trade panel, remove the high import subventions on small arms and artillery unless you are at war.\n\nHow to do it:\n1. Budget panel: the tax level and the Military Wages and Government Wages levels are set there; change the one the detail names by one step.\n2. Army: open an army, its Buildings tab, a Barracks, and press Downsize once per battalion you do not need in peacetime.\n3. Construction panel: if the detail says to pause building, press Cancel Construction on the most expensive item in the queue.\n\nHow it works: The 1836 setup subsidises imported small arms and artillery: the state pays part of the import price, so every musket the army buys costs the [Concept('concept_treasury','treasury')] twice. In peacetime that is money spent for nothing.\n\nSources (1.13.9): game files: common/history/countries/sar - sardinia.txt"
 je_oiko_pb_sar_subventions_status:0 "Now:\nWeekly balance: #bold [GetPlayer.MakeScope.ScriptValue('oiko_balance')|D]#! @money!"
 je_oiko_pb_fra_iron:0 "Opening: Dig iron in Alsace-Lorraine, Lorraine and Burgundy"
 je_oiko_pb_fra_iron_reason:0 "industry · Opening\n\nFrance has only 6 iron mine levels but tooling, steel and construction all use iron: build mines until iron is back at [Concept('concept_base_price','base price')].\n\nHow to do it:\n1. Open the Construction panel and choose Iron Mine.\n2. Pick the state the analyzer's Now list or Market tab names (resources, workers, payback) and queue a level.\n\nHow it works: When an input is short, every building that uses it pays more, so construction and factories both get dearer. Domestic mines turn that import bill into wages you can tax. Found Mines d'Anzin at once: the coal is already there.\n\nSources (1.13.9): game files: common/history/buildings/00_west_europe.txt, https://vic3.paradoxwikis.com/France"
 je_oiko_pb_fra_iron_status:0 "Now:\nIron Mine: #bold [GetPlayer.MakeScope.ScriptValue('oiko_lvl_building_iron_mine')|0]#! levels (rule: below 15)"
 je_oiko_pb_fra_engines:0 "Opening: Make your own engines, then drop the engine import subsidy"
 je_oiko_pb_fra_engines_reason:0 "industry · Opening\n\nBuild a motor industry; the state pays part of the price of every imported engine.\n\nHow to do it:\n1. Open the Construction panel and choose Motor Industry.\n2. Pick the state the analyzer's Now list or Market tab names (resources, workers, payback) and queue a level.\n\nHow it works: France starts with import subventions on engines. Railways and mechanised production need engines, Britain supplies almost all of them and can rival or embargo you. A home motor industry ends both the subsidy and the dependence.\n\nSources (1.13.9): game files: common/history/countries/fra - france.txt, https://vic3.paradoxwikis.com/France"
 je_oiko_pb_fra_engines_status:0 "Now:\nMotor Industry: #bold [GetPlayer.MakeScope.ScriptValue('oiko_lvl_building_motor_industry')|0]#! levels (rule: below 1)"
 je_oiko_pb_fra_haiti_margin:0 "Opening: Your surplus is smaller than it looks"
 je_oiko_pb_fra_haiti_margin_reason:0 "budget · Opening\n\nKeep a margin before adding permanent costs: part of your tax income is the Haitian indemnity.\n\nHow to do it:\n1. Budget panel, Income: note the Haitian indemnity line.\n2. Before you enact a law that costs money, check that the weekly balance would stay positive without that line.\n\nHow it works: The Haitian independence payments modifier adds tax income that shrinks in steps as Haiti pays and vanishes if Haiti cancels the debt. A barely positive budget can flip negative overnight while army wages and construction costs stay where they are.\n\nSources (1.13.9): game files: common/static_modifiers/agitators_2_modifiers.txt, common/scripted_buttons/00_hispaniola_buttons.txt"
 je_oiko_pb_fra_haiti_margin_status:0 "Now:\nWeekly balance: #bold [GetPlayer.MakeScope.ScriptValue('oiko_balance')|D]#! @money!"
 je_oiko_pb_aus_construction:0 "Opening: Add construction sectors in Austria and Bohemia, one at a time"
 je_oiko_pb_aus_construction_reason:0 "industry · Opening\n\nSeven levels are slow for an empire of 20 million; grow only while the balance stays positive.\n\nHow to do it:\n1. Open the Construction panel and choose Construction Sector.\n2. Pick the state the analyzer's Now list or Market tab names (resources, workers, payback) and queue a level.\n\nHow it works: Construction sectors are state buildings: their wages and their wood, iron and tools are government expenses, so grow them only as far as current income covers. Bohemia combines iron 45, coal 48 and the largest workforce for the inputs.\n\nSources (1.13): https://vic3.paradoxwikis.com/Strategy:_Austria"
 je_oiko_pb_aus_construction_status:0 "Now:\nDebt / credit limit: #bold [GetPlayer.MakeScope.ScriptValue('oiko_debt_share')|0%]#!\nWeekly balance: #bold [GetPlayer.MakeScope.ScriptValue('oiko_balance')|D]#! @money!\nConstruction Sector: #bold [GetPlayer.MakeScope.ScriptValue('oiko_lvl_building_construction_sector')|0]#! levels (rule: below 12)"
 je_oiko_pb_gg_leave_serfdom:0 "Opening: Abolish Serfdom: enact Tenant Farmers"
 je_oiko_pb_gg_leave_serfdom_reason:0 "reforms · Opening\n\nSerfdom is active: enact Tenant Farmers before any other land reform.\n\nHow to do it:\n1. Politics panel, Laws tab, Land Reform group: find Tenant Farmers and press Enact.\n2. The Landowners usually oppose it: add the Industrialists or the Rural Folk (both dislike Serfdom) to the government with Reform Government before enacting.\n\nHow it works: Serfdom blocks Interventionism, Laissez-Faire and Command Economy, so it locks you into Traditionalism or Agrarianism. It also forbids peasants to move inside the country or emigrate, reserves 75% of arable land for subsistence farms and gives subsistence farms 3 output instead of the 4 they get under Tenant Farmers, so peasants are poorer, less literate and cannot leave for your new factories.\n\nSources (1.13.9): Generalist Gaming: BEST Economic Laws, Generalist Gaming: How to INDUSTRIALIZE in the EARLY Game, game files: common/laws/00_land_reform.txt:1-56 (law_serfdom: disallowing_laws 24-28, modifiers 51-56), :140-158 (law_tenant_farmers), game files: common/production_methods/12_subsistence.txt:48-60 (pm_serfdom_no: output 4), :132-143 (pm_serfdom: output 3)"
 je_oiko_pb_gg_decree_manufacturing:0 "Opening: Spend spare Authority on Encourage Manufacturing Industry in your factory state"
 je_oiko_pb_gg_decree_manufacturing_reason:0 "industry · Opening\n\nIssue the Encourage Manufacturing Industry decree in the state with the most factories (usually the capital). With Shaft Mining, put Encourage Resource Industry on your best iron or coal state.\n\nHow to do it:\n1. Open the map's Decrees tab (or right-click the state, Issue Decree) on the state with the most factories.\n2. Pick Encourage Manufacturing Industry and confirm.\n3. If Authority is left and you have Shaft Mining, do the same with Encourage Resource Industry on the state with the most mines.\n\nHow it works: Encourage Manufacturing Industry gives +20% [Concept('concept_throughput','throughput')] to manufacturing and service buildings in the state; Encourage Resource Industry gives +20% to mines, logging camps and fishing. Throughput raises output and inputs but not wages, so a profitable building earns more for the same workers. Each costs 100 Authority (scaled by rank), and a state can hold only one of the three Encourage decrees.\n\nSources (1.13.9): Generalist Gaming: How to Start a Game: Evaluating Nations & Pre-Unpause Actions, game files: common/decrees/00_decree.txt:576-591 (decree_encourage_manufacturing_industry: manufacturies), 726-745 (decree_encourage_resource_industry: shaft_mining)"
 je_oiko_pb_gx_balance_with_pool:0 "Opening · Expert tip: Read the weekly balance together with the investment pool"
 je_oiko_pb_gx_balance_with_pool_reason:0 "Expert tip (Generalist Gaming, an opinion the game files cannot confirm)\n\nbudget · Opening\n\nA deficit while the [Concept('concept_investment_pool','investment pool')] keeps growing means private construction is idle: queue buildings for it instead of cutting state spending.\n\nHow to do it:\n1. Budget panel: hover the Investment Pool and check its weekly change.\n2. If it grows, Construction panel: queue private buildings the analyzer ranks with a short payback; the pool pays for them.\n\nHow it works: The investment pool pays for private construction. If it fills up while the state loses money, the economy has money that is not being turned into buildings; spending it is growth, not waste.\n\nSources (1.13.9): Generalist Gaming: Private Ownership & the Investment Pool"
 je_oiko_pb_gx_balance_with_pool_status:0 "Now:\nWeekly balance: #bold [GetPlayer.MakeScope.ScriptValue('oiko_balance')|D]#! @money!"
 je_oiko_pb_gen_proportional_tax:0 "Early game: Enact Proportional Taxation"
 je_oiko_pb_gen_proportional_tax_reason:0 "reforms · Early game\n\nPer-capita and land taxes fall hardest on the poor. Enact Proportional Taxation; if it cannot pass from Per-Capita (often only the Trade Unions support that step), go through Land-Based Taxation only as a short stop on the way.\n\nHow to do it:\n1. Politics panel, Laws, Taxation group: find Proportional Taxation and press Enact.\n2. If its chance of success is low, enact Land-Based Taxation first, then Proportional Taxation.\n3. While it is enacted, the tax level may need one step up to keep the balance: check the Budget panel.\n\nHow it works: Per-capita taxation takes the same from every pop, so it pushes the poorest below their expected [Concept('concept_sol','standard of living')] and breeds [Concept('concept_radical','radicals')], while income tax under Proportional grows with the wages your new industry pays. Generalist Gaming's guides call Per-Capita the tax law to leave first; Graduated Taxation (socialism) is the later step once peasants run out.\n\nSources (1.13.9): game files: common/laws/00_taxation.txt (law_proportional_taxation: egalitarianism), Generalist Gaming: BEST Economic Laws, Generalist Gaming: Why Taxing the Rich is So Strong"
 je_oiko_pb_gen_ammunition:0 "Early game: Ammunition is dear: build munition plants"
 je_oiko_pb_gen_ammunition_reason:0 "military · Early game\n\nAmmunition costs over 10% above [Concept('concept_base_price','base price')]; every skirmish battalion uses one a week and trench infantry later uses two.\n\nHow to do it:\n1. Open the Market panel and find Ammunition: its tooltip shows which buildings make it.\n2. The analyzer's Market tab names the building, the state to build in and any input that is dear too.\n\nHow it works: Ammunition shortages put input-shortage penalties on supply, and since 1.13.5 formations also take production-shortage penalties. Cheap ammunition also prepares the move to better infantry.\n\nSources (1.13.9): game files: building_munition_plant (unlocked by percussion_cap), https://vic3.paradoxwikis.com/Patch_1.13.X"
 je_oiko_pb_gen_construction_inputs:0 "Early game: Construction materials are dear: build logging camps, iron mines or tooling workshops"
 je_oiko_pb_gen_construction_inputs_reason:0 "industry · Early game\n\nWood, fabric, iron or tools are over 15% above [Concept('concept_base_price','base price')]: build logging camps, iron mines or tooling workshops for whichever is dear.\n\nHow to do it:\n1. Open the Market panel and find Fabric: its tooltip shows which buildings make it.\n2. The analyzer's Market tab names the building, the state to build in and any input that is dear too.\n\nHow it works: Construction sectors burn wood and fabric (Wooden Buildings) or wood, fabric, iron and tools (Iron Frame) for every construction point, at market price. Cheaper inputs mean more buildings for the same money.\n\nSources (1.13.9): game files: common/production_methods/13_construction.txt, https://steamcommunity.com/app/529340/discussions/0/3717188807309600790 (older)"
 je_oiko_pb_gen_construction_inputs_status:0 "Now:\nConstruction Sector: #bold [GetPlayer.MakeScope.ScriptValue('oiko_lvl_building_construction_sector')|0]#! levels (rule: at least 1)"
 je_oiko_pb_gen_iron_frame:0 "Early game: Switch construction sectors to Iron Frame Buildings"
 je_oiko_pb_gen_iron_frame_reason:0 "industry · Early game\n\nIron and tools are cheap now: Iron Frame Buildings give more construction per sector.\n\nHow to do it:\n1. Open a state with a Construction Sector and click the Construction Sector building.\n2. In its production methods pick 'Iron Frame Buildings'; repeat in every state that has a Construction Sector.\n\nHow it works: Iron Frame needs iron and tools on top of wood and fabric. Switching while those goods are expensive raises the construction bill more than the extra speed is worth; with them at [Concept('concept_base_price','base price')] it is a clear gain.\n\nSources (1.13.9): game files: pm_iron_frame_buildings (unlocked by urban_planning)"
 je_oiko_pb_gen_laissez_faire:0 "Early game: Enact Laissez-Faire as early as possible"
 je_oiko_pb_gen_laissez_faire_reason:0 "industry · Early game\n\nMove from Interventionism (or Traditionalism) straight to Laissez-Faire as soon as you have International Trade; never Command Economy.\n\nHow to do it:\n1. Open the Politics panel, Laws tab, and find Laissez Faire.\n2. Press Enact. Enactment takes months: keep the interest groups that support it in government, and watch the chance of success.\n3. Before it passes, check its effect on the budget: schools, health, police and welfare laws cost money every week.\n\nHow it works: Laissez-Faire gives -25% loan interest and +25% investment-pool efficiency for shopkeepers and capitalists: money the [Concept('concept_investment_pool','investment pool')] gets on top of what owners pay in, so private construction grows for free. Generalist Gaming's guides call it the best economic law without conditions; Interventionism is a trap.\n\nSources (1.13.9): game files: common/laws/00_economic_system.txt (law_laissez_faire: international_trade), Generalist Gaming: Interventionism is a TRAP, Laissez Faire is Just BETTER, Generalist Gaming: BEST Economic Laws"
 je_oiko_pb_gen_industrialists_in:0 "Early game: Bring the Industrialists into government"
 je_oiko_pb_gen_industrialists_in_reason:0 "reforms · Early game\n\nThe Industrialists have clout but no seat: add them to the government.\n\nHow to do it:\n1. Politics panel: press Reform Government.\n2. Press Add To Government on the Industrialists and confirm.\n\nHow it works: A law's base chance to pass is the clout of the government interest groups that endorse it, plus movements and the ruler. Landowners and the Armed Forces back few economic reforms; the Industrialists back the market reforms your industry needs.\n\nSources (1.13): https://vic3.paradoxwikis.com/Laws"
 je_oiko_pb_gen_early_schools:0 "Early game: Start schooling: enact Religious or Private Schools"
 je_oiko_pb_gen_early_schools_reason:0 "reforms · Early game\n\nLiteracy is under 30% and there is no school system: enact Religious Schools (with rationalism) or Private Schools (with academia).\n\nHow to do it:\n1. Open the Politics panel, Laws tab, and find the law group of No Schools.\n2. Enact the replacement the detail names; the old law ends when it passes.\n\nHow it works: [Concept('concept_literacy','Literacy')] gates research speed, the [Concept('concept_pop_qualifications','qualifications')] pops need for skilled jobs (clerks, engineers, machinists) and the political awareness of the middle class. A school law started early pays for decades; Public Schools (empiricism) is the stronger but costlier step later.\n\nSources (1.13.9): game files: common/laws/00_education_system.txt (law_religious_schools: rationalism, law_private_schools: academia, law_public_schools: empiricism)"
 je_oiko_pb_gen_early_tools:0 "Early game: Make tools at home: build tooling workshops"
 je_oiko_pb_gen_early_tools_reason:0 "industry · Early game\n\nTools are over 20% above [Concept('concept_base_price','base price')]: build tooling workshops next to iron and wood.\n\nHow to do it:\n1. Open the Market panel and find Tools: its tooltip shows which buildings make it.\n2. The analyzer's Market tab names the building, the state to build in and any input that is dear too.\n\nHow it works: Tools are the input of almost every early upgrade: mines, logging camps, farms and Iron Frame construction all run on them. Dear tools make every later production-method switch unprofitable, so the tool chain comes before consumer factories.\n\nSources (1.13.9): game files: building_tooling_workshop (unlocked by manufacturies)"
 je_oiko_pb_gen_early_coal:0 "Early game: Open coal mines before railways and steel"
 je_oiko_pb_gen_early_coal_reason:0 "industry · Early game\n\nCoal is over 20% above [Concept('concept_base_price','base price')]: open coal mines in your coal states.\n\nHow to do it:\n1. Open the Market panel and find Coal: its tooltip shows which buildings make it.\n2. The analyzer's Market tab names the building, the state to build in and any input that is dear too.\n\nHow it works: Coal powers railways, steam engines in mines and later steel. Building the mines before the demand arrives keeps the first railways and steel mills profitable instead of fighting over imports.\n\nSources (1.13.9): game files: building_coal_mine"
 je_oiko_pb_gen_early_railways_research:0 "Early game: Research railways"
 je_oiko_pb_gen_early_railways_research_reason:0 "industry · Early game\n\nIt is past 1840 and railways is not researched: put it at the front of the production queue.\n\nHow to do it:\n1. Open the Technology panel and put Railways first in its queue.\n\nHow it works: Railways unlock the railway building, the main source of [Concept('concept_infrastructure','infrastructure')] and [Concept('concept_market_access','market access')]. Without it, every state you industrialise hits its infrastructure cap and loses output to the market-access penalty.\n\nSources (1.13.9): game files: building_railway (unlocked by railways)"
 je_oiko_pb_gen_agrarianism_first:0 "Early game: Enact Agrarianism before Laissez-Faire"
 je_oiko_pb_gen_agrarianism_first_reason:0 "industry · Early game\n\nYour private investment comes mostly from landowners, not capitalists: Agrarianism pays off first; move to Laissez-Faire once capitalists supply a quarter of the [Concept('concept_investment_pool','investment pool')].\n\nHow to do it:\n1. Open the Politics panel, Laws tab, and find Agrarianism.\n2. Press Enact. Enactment takes months: keep the interest groups that support it in government, and watch the chance of success.\n3. Before it passes, check its effect on the budget: schools, health, police and welfare laws cost money every week.\n\nHow it works: Laissez-Faire's bonus goes to shopkeepers' and capitalists' investment. Where aristocrats own most buildings (Qing, Japan, the East India Company in 1836), Agrarianism boosts the owners you actually have.\n\nSources (1.13.9): game files: common/laws/00_economic_system.txt (law_agrarianism: romanticism), Generalist Gaming: BEST Economic Laws"
 je_oiko_pb_pru_industry_chain:0 "Early game: Build the Ruhr–Silesia heavy-industry chain"
 je_oiko_pb_pru_industry_chain_reason:0 "industry · Early game\n\nCoal and iron mines (Rhineland/Ruhr, Silesia), then tooling workshops, then steel mills once steelworking is researched, then railways in the industrial states.\n\nHow to do it:\n1. Open the Construction panel and choose Steel Mill.\n2. Pick the state the analyzer's Now list or Market tab names (resources, workers, payback) and queue a level.\n\nHow it works: Prussia's coal and iron lie in the Rhineland and Silesia. Each link feeds the next inside your own market, so input prices stay low and the wages stay taxable at home; tools and steel later make construction itself cheaper (Iron Frame, then steel methods).\n\nSources (1.13): https://vic3.paradoxwikis.com/Prussia"
 je_oiko_pb_pru_industry_chain_status:0 "Now:\nSteel Mill: #bold [GetPlayer.MakeScope.ScriptValue('oiko_lvl_building_steel_mill')|0]#! levels (rule: below 5)"
 je_oiko_pb_pru_public_schools:0 "Early game: Keep Public Schools and avoid Multiculturalism until Germany is formed"
 je_oiko_pb_pru_public_schools_reason:0 "unification · Early game\n\nGerman unification starts from cultural fervor: north German fervor must reach 40 and south German 30.\n\nHow to do it:\n1. Open the Politics panel, Laws tab, and find Public Schools.\n2. Press Enact. Enactment takes months: keep the interest groups that support it in government, and watch the chance of success.\n3. Before it passes, check its effect on the budget: schools, health, police and welfare laws cost money every week.\n\nHow it works: je_german_unification_idea needs north_german fervor ≥ 40 and south_german ≥ 30. Fervor rises with [Concept('concept_literacy','literacy')], Public Schools, academics, nationalism techs and war casualties, and it falls under Multiculturalism.\n\nSources (1.13.9): game files: common/journal_entries/00_german_unification.txt"
 je_oiko_pb_pru_nationalism:0 "Early game: Research nationalism early"
 je_oiko_pb_pru_nationalism_reason:0 "unification · Early game\n\nPut nationalism high in the research queue.\n\nHow to do it:\n1. Open the Technology panel and put Nationalism first in its queue.\n\nHow it works: nationalism is required by je_north_german_unification and by dp_leadership_germany, the leadership war against Austria. It also raises fervor among your German pops (+5 at full coverage).\n\nSources (1.13.9): game files: common/journal_entries/00_german_unification.txt, common/diplomatic_plays/00_diplomatic_plays.txt"
 je_oiko_pb_pru_schleswig_holstein:0 "Early game: Plan how the Schleswig-Holstein question gets solved"
 je_oiko_pb_pru_schleswig_holstein_reason:0 "unification · Early game\n\nBy war with Denmark or by backing Holstein's independence: both German unification journal entries require it.\n\nHow to do it:\n1. Journal: open the German unification entry, which lists the Schleswig-Holstein question.\n2. Either start a Diplomatic Play against Denmark over Holstein (Diplomacy panel), or support Holstein's independence when the journal or an event offers it.\n\nHow it works: Both the North and the South German unification JEs need the global flag schleswig_holstein_question_solved, set when the Schleswig-Holstein state region is held by German-culture owners that are not Danish subjects. Without it the North German Federation cannot form, however strong you are.\n\nSources (1.13.9): game files: common/journal_entries/00_german_unification.txt (je_schleswig_holstein_question)"
 je_oiko_pb_gbr_corn_laws:0 "Early game: Repeal the Corn Laws: enact Free Trade while the Landowners are out"
 je_oiko_pb_gbr_corn_laws_reason:0 "corn_laws · Early game\n\nFree Trade needs no research for Britain; pass it while the Landowners sit in opposition.\n\nHow to do it:\n1. Open the Politics panel, Laws tab, and find Free Trade.\n2. Press Enact. Enactment takes months: keep the interest groups that support it in government, and watch the chance of success.\n3. Before it passes, check its effect on the budget: schools, health, police and welfare laws cost money every week.\n\nHow it works: Free Trade removes tariffs but gives +25% trade advantage, which suits the world's top exporter. Passing it completes the Corn Laws journal and gives labourer loyalists; the Landowners' [Concept('concept_approval','approval')] penalty only applies if they are in government, so passing it while they are in opposition avoids it.\n\nSources (1.13.9): game files: common/journal_entries/00_corn_laws.txt, common/laws/00_trade_policy.txt"
 je_oiko_pb_gbr_fabric_glut:0 "Early game: Stop expanding textiles"
 je_oiko_pb_gbr_fabric_glut_reason:0 "industry · Early game\n\nFabric sells below 80% of [Concept('concept_base_price','base price')]: build goods that are above base price instead.\n\nHow to do it:\n1. Construction panel: queue no more Textile Mills or Livestock Ranches.\n2. Build what the analyzer's Market tab lists as dear instead.\n\nHow it works: A building's profit falls with its output price. With fabric far below base, new mills spread wages and dividends thinner across the whole sector and lower tax income. The exception is ship construction, which needs 390 fabric per ship of the line.\n\nSources (1.13.9): game files: common/history/buildings/00_west_europe.txt"
 je_oiko_pb_gbr_fabric_glut_status:0 "Now:\nTextile Mill: #bold [GetPlayer.MakeScope.ScriptValue('oiko_lvl_building_textile_mill')|0]#! levels (rule: at least 40)"
 je_oiko_pb_gbr_chartism:0 "Early game: Answer the Chartists: enact Census Voting"
 je_oiko_pb_gbr_chartism_reason:0 "reforms · Early game\n\nWiden the franchise one step before radicalism grows.\n\nHow to do it:\n1. Open the Politics panel, Laws tab, and find Census Voting.\n2. Press Enact. Enactment takes months: keep the interest groups that support it in government, and watch the chance of success.\n3. Before it passes, check its effect on the budget: schools, health, police and welfare laws cost money every week.\n\nHow it works: Britain's radical party is the Chartist Party for as long as universal suffrage is missing. Widening the vote cuts [Concept('concept_radical','radicals')] among the newly enfranchised middle classes, and Census Voting is a smaller jump than universal suffrage, so the Landowners resist it less.\n\nSources (1.13.9): game files: common/parties/radical_party.txt"
 je_oiko_pb_gbr_brazil_slave_trade:0 "Early game: Pressure Brazil to drop the slave trade"
 je_oiko_pb_gbr_brazil_slave_trade_reason:0 "prestige · Early game\n\nIdeally while Brazil is in a civil war.\n\nHow to do it:\n1. Journal: open the entry about the slave trade and use its button against Brazil.\n2. Do it while Brazil is in a civil war (select Brazil in the Diplomacy panel to see its wars).\n\nHow it works: Britain carries −100 prestige and −10% influence until Brazil drops the slave trade; fixing it frees influence for managing the many subjects. The journal fails if Britain itself legalises slavery.\n\nSources (1.13): game files: common/journal_entries/02_brazilian_slavery.txt, https://vic3.paradoxwikis.com/Great_Britain"
 je_oiko_pb_gbr_brazil_slave_trade_status:0 "Now:\nWeekly balance: #bold [GetPlayer.MakeScope.ScriptValue('oiko_balance')|D]#! @money!"
 je_oiko_pb_usa_build_north:0 "Early game: Build new factories in the North while slavery stands"
 je_oiko_pb_usa_build_north_reason:0 "slavery_debate · Early game\n\nPut new industry in New York, Pennsylvania, New England, Ohio and the Great Lakes states, not in the slave states.\n\nHow to do it:\n1. Construction panel: place every new factory in New York, Pennsylvania, New England, Ohio or the Great Lakes states.\n2. Queue no new factories in the slave states.\n\nHow it works: If the Civil War fires, the slave states leave with their buildings and become the war zone, so southern factories turn into enemy assets. Northern industry keeps producing during the war and pays for it. After the Slavery Debate completes, southern investment is safe again.\n\nSources (1.13): https://vic3.paradoxwikis.com/Strategy:_America, game files: common/journal_entries/00_acw_entries.txt (je_acw_countdown)"
 je_oiko_pb_usa_dedicated_police:0 "Early game: Replace Local Police with Dedicated Police"
 je_oiko_pb_usa_dedicated_police_reason:0 "slavery_debate · Early game\n\nLocal Police feeds the Southern Planters' political strength.\n\nHow to do it:\n1. Open the Politics panel, Laws tab, and find Dedicated Police.\n2. Press Enact. Enactment takes months: keep the interest groups that support it in government, and watch the chance of success.\n3. Before it passes, check its effect on the budget: schools, health, police and welfare laws cost money every week.\n\nHow it works: Local Police gives the Southern Planters (ig_landowners) +5% political strength per police institution level, and the USA starts at level 2. Removing it lowers Planter clout before abolition and lowers the radicalisation the slavery change causes.\n\nSources (1.13.9): game files: common/laws/00_policing.txt, https://vic3.paradoxwikis.com/Strategy:_America"
 je_oiko_pb_usa_not_yet_abolition:0 "Early game: Do not rush abolition yet: time works for you"
 je_oiko_pb_usa_not_yet_abolition_reason:0 "slavery_debate · Early game\n\nSpend these years on construction and northern industry; enact Slavery Banned later.\n\nHow to do it:\n1. Nothing to enact now: do not press Enact on Slavery Banned yet.\n2. Fill the [Concept('concept_construction_queue','construction queue')] with factories in the northern states (Construction panel).\n\nHow it works: The Missouri Compromise modifier gives the Planters +25% political strength and big voting power, but it decays over 50 years. Jacksonian Democrat characters back the pro-slavery movement, and changing the slavery law while Jackson lives can push the Yeoman Farmers to the secessionists.\n\nSources (1.13): game files: common/static_modifiers/content_1_modifiers.txt, common/political_movements/00_ideological_movements.txt, https://vic3.paradoxwikis.com/United_States"
 je_oiko_pb_usa_manifest_destiny:0 "Early game: Take the Manifest Destiny decision, then let infamy decay"
 je_oiko_pb_usa_manifest_destiny_reason:0 "manifest_destiny · Early game\n\nTake the decision now; declare on Mexico only after infamy has fallen, with a mobilised conscript army you demobilise right after the war.\n\nHow to do it:\n1. Decisions panel: take Manifest Destiny.\n2. Wait until your infamy (Diplomacy panel) has fallen, then start a Diplomatic Play against Mexico.\n3. Mobilise only the formations the play needs and press Demobilize right after the peace.\n\nHow it works: The decision gives claims on Mexican regions and starts the Mexican Cession and Frontier Wars journals, whose completion adds American homelands. It costs about 24 infamy, so attacking at once invites great-power intervention and a costlier war.\n\nSources (1.13): game files: common/decisions/manifest_destiny.txt, https://vic3.paradoxwikis.com/United_States"
 je_oiko_pb_usa_quinine:0 "Early game: Research pharmaceuticals, then quinine"
 je_oiko_pb_usa_quinine_reason:0 "manifest_destiny · Early game\n\nThey speed up frontier colonisation and unlock the western mapping expeditions needed for Oregon.\n\nHow to do it:\n1. Open the Technology panel and put Quinine first in its queue.\n\nHow it works: Colonies are land without people; finishing them sooner gives room for farms and migrants, and the expeditions are a prerequisite for the Oregon journal.\n\nSources (1.10): https://vic3.paradoxwikis.com/Strategy:_America"
 je_oiko_pb_sar_sulfur:0 "Early game: Open a sulfur mine in Sardinia"
 je_oiko_pb_sar_sulfur_reason:0 "industry · Early game\n\nSulfur is over 10% above [Concept('concept_base_price','base price')]; Sardinia can hold 20 sulfur mine levels.\n\nHow to do it:\n1. Open the Construction panel and choose Sulfur Mine.\n2. Pick the state the analyzer's Now list or Market tab names (resources, workers, payback) and queue a level.\n\nHow it works: Sardinian sulfur is the main reason to invest outside Piedmont. Sulfur later feeds explosives and fertilizer, and keeping it cheap stops Two Sicilies' sulfur companies from gaining the prestige good.\n\nSources (1.12): https://vic3.paradoxwikis.com/Sardinia-Piedmont, https://steamcommunity.com/app/529340/discussions/0/604168947372498524/"
 je_oiko_pb_sar_sulfur_status:0 "Now:\nSulfur Mine: #bold [GetPlayer.MakeScope.ScriptValue('oiko_lvl_building_sulfur_mine')|0]#! levels (rule: below 1)"
 je_oiko_pb_sar_no_early_wars:0 "Early game: No wars under the Austrian umbrella before 1850: stop growing the army"
 je_oiko_pb_sar_no_early_wars_reason:0 "military · Early game\n\nPut the money into construction instead.\n\nHow to do it:\n1. Budget panel: the tax level and the Military Wages and Government Wages levels are set there; change the one the detail names by one step.\n2. Army: open an army, its Buildings tab, a Barracks, and press Downsize once per battalion you do not need in peacetime.\n3. Construction panel: if the detail says to pause building, press Cancel Construction on the most expensive item in the queue.\n\nHow it works: Austria guarantees Two Sicilies and Tuscany by treaty until about 1850, and Modena, Tuscany, Parma and Two Sicilies sit in its power bloc. An early war against a neighbour means war with Austria, while soldiers' wages and goods are a fixed weekly cost that earns nothing.\n\nSources (1.13.9): game files: common/history/treaties, common/history/power_blocs, https://vic3.paradoxwikis.com/Sardinia-Piedmont"
 je_oiko_pb_sar_no_early_wars_status:0 "Now:\nMilitary share of spending: #bold [GetPlayer.MakeScope.ScriptValue('oiko_military_share')|0%]#! (rule: from 30%)"
 je_oiko_pb_sar_nationalism:0 "Early game: Research nationalism after railways"
 je_oiko_pb_sar_nationalism_reason:0 "unification · Early game\n\nNationalism gates the Risorgimento journal, Italian candidacy, both unification plays and the Treaty of Turin.\n\nHow to do it:\n1. Open the Technology panel and put Nationalism first in its queue.\n\nHow it works: Candidacy also requires every Italian country to know nationalism; researching it early lets tech spread carry it to the minors sooner.\n\nSources (1.13): game files: common/journal_entries/00_italian_unification.txt, common/country_formation/00_major_formables.txt, https://vic3.paradoxwikis.com/Formable_nations"
 je_oiko_pb_sar_risorgimento:0 "Early game: Back the Risorgimento and bring a liberal or patriotic group into government"
 je_oiko_pb_sar_risorgimento_reason:0 "unification · Early game\n\nChoose 'Italy must be restored' in Whispers of Risorgimento; only conservative groups govern now.\n\nHow to do it:\n1. When the event 'Whispers of Risorgimento' appears, choose 'Italy must be restored'.\n2. Politics panel: Reform Government, then Add To Government a liberal group such as the Intelligentsia or the Industrialists.\n\nHow it works: The pro option sets the stance that peaceful absorption of the minors requires and gives liberal and patriotic groups +25% political strength. With only conservatives ruling, the Italian national movement turns radical, and while the journal is active a revolution can hand your country to a higher-ranked Italian state.\n\nSources (1.13.9): game files: events/italian_unification.txt"
 je_oiko_pb_fra_orleanists:0 "Early game: Keep the Orléanists in front: bring the Industrialists back into government"
 je_oiko_pb_fra_orleanists_reason:0 "divided_monarchists · Early game\n\nThen open each loss-making factory (the analyzer's Economy tab lists them) and press Downsize or switch it to a cheaper [Concept('concept_production_method','production method')]: unprofitable industry weakens the Industrialists.\n\nHow to do it:\n1. Politics panel: Reform Government, then Add To Government the Industrialists.\n2. Analyzer, Economy tab: for each loss-making factory listed, open the building and press Downsize, or switch it to a cheaper production method.\n\nHow it works: The Orléanist bar grows with profitable manufacturing levels, Orléanist characters' popularity and the clout of Orléanist-led groups (doubled in government), plus [Concept('concept_legitimacy','legitimacy')] because Louis-Philippe is Orléanist. Reaching 480 first lets you cement the dynasty, which removes the Legacy of the French Revolution malus (revolution clock +12.5%, [Concept('concept_radical','radicals')] from low legitimacy ×2).\n\nSources (1.13.9): game files: common/scripted_effects/00_victoria_scripted_effects.txt, common/journal_entries/01_french_monarchism.txt"
 je_oiko_pb_fra_algeria:0 "Early game: Conquer Algeria one principality at a time"
 je_oiko_pb_fra_algeria_reason:0 "algeria · Early game\n\nTake Mascara, Constantine and Ait Abbas, then Touggourt, with single-target plays, mobilising only the formations you need.\n\nHow to do it:\n1. Diplomacy panel: start a Diplomatic Play against one principality at a time - Mascara, Constantine, Ait Abbas, then Touggourt.\n2. Mobilise only the formations the play needs and press Demobilize after the peace.\n\nHow it works: The Conquest of Algeria has no deadline and fails only if you lose all three footholds. Completing it gives Saharan and Tunisian claims, double incorporation speed and follow-up journals. Mobilising the whole army against small unrecognised principalities raises military spending for weeks for nothing.\n\nSources (1.13.9): game files: common/journal_entries/01_algeria.txt, https://vic3.paradoxwikis.com/France"
 je_oiko_pb_fra_algeria_status:0 "Now:\nWeekly balance: #bold [GetPlayer.MakeScope.ScriptValue('oiko_balance')|D]#! @money!"
 je_oiko_pb_fra_schneider:0 "Early game: Build steel in Burgundy and found Schneider-Creusot"
 je_oiko_pb_fra_schneider_reason:0 "industry · Early game\n\nFive steel mill levels in Burgundy unlock the company, once iron and coal are not short.\n\nHow to do it:\n1. Open the Construction panel and choose Steel Mill.\n2. Pick the state the analyzer's Now list or Market tab names (resources, workers, payback) and queue a level.\n\nHow it works: In 1.13.9 Schneider-Creusot needs 5 steel mill levels in Burgundy. Its buildings are steel, artillery and motor industry, exactly the chain France lacks, and companies add productivity to their buildings. Build the mills only when iron and coal are cheap, or they run at a loss.\n\nSources (1.13.9): game files: common/company_types/00_companies_france.txt"
 je_oiko_pb_fra_schneider_status:0 "Now:\nSteel Mill: #bold [GetPlayer.MakeScope.ScriptValue('oiko_lvl_building_steel_mill')|0]#! levels (rule: below 5)"
 je_oiko_pb_fra_vineyards:0 "Early game: Stop expanding vineyards"
 je_oiko_pb_fra_vineyards_reason:0 "industry · Early game\n\nWine sells below 85% of base: put construction into industry or food processing instead.\n\nHow to do it:\n1. Construction panel: queue no more Vineyards.\n2. Build what the analyzer's Market tab lists as dear (factories or Food Industries) instead.\n\nHow it works: France starts with 78 vineyard levels and taxes wine consumption. Extra supply pushes the price down, which cuts the profits and wages of every vineyard.\n\nSources (1.13.9): game files: common/history/buildings/00_west_europe.txt"
 je_oiko_pb_fra_vineyards_status:0 "Now:\nVineyard: #bold [GetPlayer.MakeScope.ScriptValue('oiko_lvl_building_vineyard')|0]#! levels (rule: at least 60)"
 je_oiko_pb_fra_egypt_treaty:0 "Early game: Drop the Egypt treaty's arms shipments"
 je_oiko_pb_fra_egypt_treaty_reason:0 "military · Early game\n\nIts 20-year binding period has ended: renegotiate or let lapse the free arms shipments and the military assistance.\n\nHow to do it:\n1. Open the Market panel and find Artillery: its tooltip shows which buildings make it.\n2. The analyzer's Market tab names the building, the state to build in and any input that is dear too.\n\nHow it works: The treaty ships 10 small arms and 5 artillery to Egypt on top of your own army's needs and obliges France to fight in Egypt's wars. After about November 1844 both are optional costs.\n\nSources (1.13.9): game files: common/history/treaties/00_historical_treaties.txt, https://vic3.paradoxwikis.com/France"
 je_oiko_pb_fra_abolition:0 "Early game: Abolish colonial slavery while the liberals govern"
 je_oiko_pb_fra_abolition_reason:0 "reforms · Early game\n\nEnact Slavery Banned after taxation and census voting.\n\nHow to do it:\n1. Open the Politics panel, Laws tab, and find Slavery Banned.\n2. Press Enact. Enactment takes months: keep the interest groups that support it in government, and watch the chance of success.\n3. Before it passes, check its effect on the budget: schools, health, police and welfare laws cost money every week.\n\nHow it works: France abolished colonial slavery in 1848. Liberal groups favour it, and enslaved pops earn no wages and buy little, so they add little to the market. It is far easier to pass during a liberal government.\n\nSources (1.13.9): game files: common/laws"
 je_oiko_pb_aus_engines_first:0 "Early game: Steel and engines before railways"
 je_oiko_pb_aus_engines_first_reason:0 "industry · Early game\n\nBuild steel mills and a motor industry in Bohemia before laying more railways.\n\nHow to do it:\n1. Open the Construction panel and choose Motor Industry.\n2. Pick the state the analyzer's Now list or Market tab names (resources, workers, payback) and queue a level.\n\nHow it works: Austria starts with the railways tech but no steel or engine production. Early trains consume engines and coal, and railways running on imported, overpriced engines lose money, a loss their owners or the state carry.\n\nSources (1.13.9): game files: common/production_methods/11_private_infrastructure.txt, common/history/countries/aus - austria.txt"
 je_oiko_pb_aus_engines_first_status:0 "Now:\nMotor Industry: #bold [GetPlayer.MakeScope.ScriptValue('oiko_lvl_building_motor_industry')|0]#! levels (rule: below 1)"
 je_oiko_pb_aus_coal:0 "Early game: Open coal mines in West Galicia and Moravia"
 je_oiko_pb_aus_coal_reason:0 "industry · Early game\n\nCoal is over 15% above base and you have only 4 coal mines.\n\nHow to do it:\n1. Open the Market panel and find Coal: its tooltip shows which buildings make it.\n2. The analyzer's Market tab names the building, the state to build in and any input that is dear too.\n\nHow it works: Steel, engines, railways and steam methods all eat coal. West Galicia (cap 140) and Moravia (56) are the deep deposits, and Galicia's spare peasant labour turns into taxable wages.\n\nSources (1.13.9): game files: map_data/state_regions"
 je_oiko_pb_aus_arms_out_of_lombardy:0 "Early game: Build new arms capacity in Bohemia or Austria, not Lombardy"
 je_oiko_pb_aus_arms_out_of_lombardy_reason:0 "military · Early game\n\nSmall arms or artillery are over 15% above [Concept('concept_base_price','base price')].\n\nHow to do it:\n1. Open the Market panel and find Artillery: its tooltip shows which buildings make it.\n2. The analyzer's Market tab names the building, the state to build in and any input that is dear too.\n\nHow it works: Five of 7 arms levels and both artillery foundries sit in Lombardy, an Italian homeland the Risorgimento targets first. If you lose it, army supply suddenly becomes imports bought at market price by the logistics centers.\n\nSources (1.13.9): game files: common/history/buildings, common/journal_entries/00_italian_unification.txt"
 je_oiko_pb_aus_no_army_growth:0 "Early game: Don't grow the army before 1850"
 je_oiko_pb_aus_no_army_growth_reason:0 "military · Early game\n\nPut the money into construction instead.\n\nHow to do it:\n1. Budget panel: the tax level and the Military Wages and Government Wages levels are set there; change the one the detail names by one step.\n2. Army: open an army, its Buildings tab, a Barracks, and press Downsize once per battalion you do not need in peacetime.\n3. Construction panel: if the detail says to pause building, press Cancel Construction on the most expensive item in the queue.\n\nHow it works: Austria's 129 battalions already match Prussia's, and the Holy Alliance pacts with Russia and Prussia plus your Italian guarantees run until about 1850. A standing army is paid every week whether or not there is a war, and does not compound the way industry does.\n\nSources (1.13.9): game files: common/history/military_formations, common/history/treaties/00_historical_treaties.txt"
 je_oiko_pb_aus_no_army_growth_status:0 "Now:\nMilitary share of spending: #bold [GetPlayer.MakeScope.ScriptValue('oiko_military_share')|0%]#! (rule: from 35%)"
 je_oiko_pb_aus_appointed_bureaucrats:0 "Early game: Replace Crownland Diets with Appointed Bureaucrats"
 je_oiko_pb_aus_appointed_bureaucrats_reason:0 "budget · Early game\n\nHave the new administrations in place first: [Concept('concept_bureaucracy','bureaucracy')] use will rise.\n\nHow to do it:\n1. Open the Politics panel, Laws tab, and find Appointed Bureaucrats.\n2. Press Enact. Enactment takes months: keep the interest groups that support it in government, and watch the chance of success.\n3. Before it passes, check its effect on the budget: schools, health, police and welfare laws cost money every week.\n\nHow it works: Crownland Diets make bureaucracy 25% cheaper and strengthen aristocrats but add no tax capacity. Appointed Bureaucrats add +25% tax capacity in every state and are required to abolish crown-land autonomy later.\n\nSources (1.13.9): game files: common/laws/00_bureaucracy.txt, common/scripted_buttons/05_austria_buttons.txt"
 je_oiko_pb_aus_appointed_bureaucrats_status:0 "Now:\nWeekly balance: #bold [GetPlayer.MakeScope.ScriptValue('oiko_balance')|D]#! @money!"
 je_oiko_pb_aus_hungary_later:0 "Early game: Leave Hungary, Transylvania and Croatia as crown lands until after 1848"
 je_oiko_pb_aus_hungary_later_reason:0 "hungary · Early game\n\nIntegrate them after the Springtime, once every crown land is at liberty desire 25 or below.\n\nHow to do it:\n1. Nothing to press until 1849: leave Hungary, Transylvania and Croatia as crown lands.\n2. Then integrate each crown land whose liberty desire is 25 or below, with its button in the journal.\n\nHow it works: Integration adds Hungarian, Polish and Croat [Concept('concept_radical','radicals')] and −10% authority just when the Springtime is most likely. As crown lands they already fight your wars without needing your tax capacity.\n\nSources (1.13): game files: common/decisions/austria_decisions.txt, https://vic3.paradoxwikis.com/Strategy:_Austria"
 je_oiko_pb_aus_venetia_sulfur:0 "Early game: Build sulfur mines in Venetia and hold it"
 je_oiko_pb_aus_venetia_sulfur_reason:0 "industry · Early game\n\nSulfur is over 15% above base; Venetia is your only deposit.\n\nHow to do it:\n1. Open the Market panel and find Sulfur: its tooltip shows which buildings make it.\n2. The analyzer's Market tab names the building, the state to build in and any input that is dear too.\n\nHow it works: Venetia (cap 36) is Austria's only sulfur. Sulfur feeds explosives and later fertiliser, so losing Venetia to Italian unification makes those industries import-dependent; concede Lombardy before Venetia.\n\nSources (1.13): game files: map_data/state_regions, https://vic3.paradoxwikis.com/Strategy:_Austria"
 je_oiko_pb_gg_leave_hereditary_bureaucrats:0 "Early game: Replace Hereditary Bureaucrats with Appointed or Elected Bureaucrats"
 je_oiko_pb_gg_leave_hereditary_bureaucrats_reason:0 "reforms · Early game\n\nEnact Appointed Bureaucrats (more tax capacity); once you run several institutions, Elected Bureaucrats (cheaper institutions) is the better step.\n\nHow to do it:\n1. Politics panel, Laws tab, [Concept('concept_bureaucracy','Bureaucracy')] group: find Appointed Bureaucrats and press Enact.\n2. If you already run three or more institutions above level 1, pick Elected Bureaucrats instead.\n\nHow it works: Hereditary Bureaucrats gives the aristocrats +25% clout for a -25% population bureaucracy cost. Appointed Bureaucrats gives +25% tax capacity in every state; Elected Bureaucrats cuts the bureaucracy cost of institution levels by 15%. Both take clout away from the Landowners, who block most economic reforms.\n\nSources (1.13.9): Generalist Gaming: LAWS & Interest Groups Overview, game files: common/laws/00_bureaucracy.txt (law_hereditary_bureaucrats: country_aristocrats_pol_str_mult = 0.25; law_appointed_bureaucrats: state_tax_capacity_mult = 0.25; law_elected_bureaucrats: country_bureaucracy_investment_cost_factor_mult = -0.15)"
 je_oiko_pb_gg_iron_research_pump:0 "Early game: Research Atmospheric Engine before you dig more iron"
 je_oiko_pb_gg_iron_research_pump_reason:0 "industry · Early game\n\nIron is over 15% above [Concept('concept_base_price','base price')] and you lack Atmospheric Engine: put it first in the Technology panel (it needs Shaft Mining). Iron mines built before it run Picks and Shovels and make half the iron per level.\n\nHow to do it:\n1. Open the Technology panel, Production tab, and put Atmospheric Engine first in the queue (research Shaft Mining first if it is locked).\n2. Until it finishes, queue no new Iron Mine levels; buy the iron you need from the market.\n3. When it finishes, follow the rule that switches Iron Mines to Atmospheric Engine Pump.\n\nHow it works: In 1.13.9 an Iron Mine on Picks and Shovels turns 5 tools into 20 iron per level (net 600 at base prices); on Atmospheric Engine Pump it turns 10 tools and 10 coal into 40 iron (net 900) with the same 5,000 jobs. Every 400-point mine level built before the technology gives half the iron, so research first and build after.\n\nSources (1.13.9): Generalist Gaming: Construction & Buildings (beginner), game files: common/production_methods/03_mines.txt:217-266 (pm_picks_and_shovels_building_iron_mine, pm_atmospheric_engine_pump_building_iron_mine), game files: common/technology/technologies/10_production.txt:249-258 (atmospheric_engine needs shaft_mining), game files: common/goods/00_goods.txt (iron 40, tools 40, coal 30)"
 je_oiko_pb_gg_spa_duro_y_compania:0 "Early game: Build Asturias coal to level 5 and found Duro y Compañía"
 je_oiko_pb_gg_spa_duro_y_compania_reason:0 "industry · Early game\n\nYou have Steelworking: raise the Coal Mine in Asturias to level 5, then establish Duro y Compañía in the Companies panel.\n\nHow to do it:\n1. Construction panel: choose Coal Mine and queue levels in Asturias until it has 5.\n2. Open the Companies panel and establish Duro y Compañía.\n3. Put its new coal, iron and steel levels in Asturias and the nearby states.\n\nHow it works: Duro y Compañía covers coal mines, iron mines and steel mills, the construction-goods chain, and in 1.13.9 it needs Steelworking and a level-5 Coal Mine in an incorporated Asturias (older guides say level 3). A company's buildings get extra [Concept('concept_throughput','throughput')], so iron and steel get cheaper and your construction costs fall.\n\nSources (1.13.9): Generalist Gaming: How to Build TALL (beginner), game files: common/company_types/00_companies_europe.txt:1293-1344 (company_duro_y_compania possible: steelworking, Asturias incorporated, coal mine level >= 5)"
 je_oiko_pb_gg_spa_duro_y_compania_status:0 "Now:\nCoal Mine: #bold [GetPlayer.MakeScope.ScriptValue('oiko_lvl_building_coal_mine')|0]#! levels (rule: below 5)"
 je_oiko_pb_gg_stock_exchange:0 "Early game: Research Stock Exchange next"
 je_oiko_pb_gg_stock_exchange_reason:0 "industry · Early game\n\nInternational Trade is done and Stock Exchange is not: put Stock Exchange at the front of the Society research queue.\n\nHow to do it:\n1. Open the Technology panel, Society tab, and click Stock Exchange to put it first in the queue.\n\nHow it works: Stock Exchange adds +0.1 [Concept('concept_market_access','market access')] price impact in every state, on a base of 0.75. Market access price impact is how much of the national market price a state's buildings see instead of the local one, so it raises the earnings of every building that sells into a state with a local glut and cuts the cost where inputs are locally scarce. It is an era 1 technology, so it is cheap now.\n\nSources (1.13.9): Generalist Gaming: How to INDUSTRIALIZE in the EARLY Game, game files: common/technology/technologies/30_society.txt:297-308 (stock_exchange: state_market_access_price_impact = 0.1, requires international_trade), game files: common/static_modifiers/00_code_static_modifiers.txt:49 (state_market_access_price_impact = 0.75)"
 je_oiko_pb_gg_iron_mine_pumps:0 "Early game: Iron is dear: switch iron mines to Atmospheric Engine Pump"
 je_oiko_pb_gg_iron_mine_pumps_reason:0 "industry · Early game\n\nIron is over 10% above [Concept('concept_base_price','base price')], coal is not dear and you have Atmospheric Engine: switch every Iron Mine from Picks and Shovels to Atmospheric Engine Pump.\n\nHow to do it:\n1. Open a state with Iron Mines and click the Iron Mines building.\n2. In its Production Methods, Mining Equipment group, pick Atmospheric Engine Pump; repeat in every state with Iron Mines.\n\nHow it works: Picks and Shovels makes 20 iron from 5 tools per 5,000 workers; Atmospheric Engine Pump makes 40 iron from 10 tools and 10 coal with the same 5,000 workers. At base prices that is 900 value added a week per level instead of 600, and twice the iron for construction and tools. It needs 500 machinists and 250 engineers per level, and coal, so open coal mines too if coal turns dear.\n\nSources (1.13.9): Generalist Gaming: How to INDUSTRIALIZE in the EARLY Game, game files: common/production_methods/03_mines.txt:217-234 (pm_picks_and_shovels_building_iron_mine), :236-266 (pm_atmospheric_engine_pump_building_iron_mine), game files: common/goods/00_goods.txt (iron 40, tools 40, coal 30)"
 je_oiko_pb_gg_iron_mine_pumps_status:0 "Now:\nIron Mine: #bold [GetPlayer.MakeScope.ScriptValue('oiko_lvl_building_iron_mine')|0]#! levels (rule: at least 1)"
 je_oiko_pb_gg_saw_mills:0 "Early game: Switch Logging Camps to Saw Mills while tools are cheap"
 je_oiko_pb_gg_saw_mills_reason:0 "industry · Early game\n\nYou have Steelworking and tools are at most 10% above [Concept('concept_base_price','base price')]: set every Logging Camps building to the Saw Mills [Concept('concept_production_method','production method')].\n\nHow to do it:\n1. Open a state with Logging Camps and click the Logging Camps building.\n2. Production Methods: in the base group (Simple Forestry) pick Saw Mills.\n3. Repeat in every state with Logging Camps; if tools then rise over 25% above base, build a Tooling Workshop before switching more.\n\nHow it works: Saw Mills doubles a Logging Camp level's wood from 30 to 60 for only 5 tools and moves 500 laborers into machinist jobs. At base prices that is 600 more wood value for 200 of tools. While tools are dear the gain shrinks, and every new buyer drives tools up further, so switch while they are cheap.\n\nSources (1.13.9): Generalist Gaming: BEGINNER ECONOMICS Guide: Mastering Buildings, game files: common/production_methods/09_misc_resource.txt:17-39 (pm_saw_mills: steelworking, 5 tools, 60 wood; pm_simple_forestry 30 wood), common/goods/00_goods.txt (wood 20, tools 40)"
 je_oiko_pb_gg_saw_mills_status:0 "Now:\nLogging Camp: #bold [GetPlayer.MakeScope.ScriptValue('oiko_lvl_building_logging_camp')|0]#! levels (rule: at least 1)"
 je_oiko_pb_gg_land_to_per_capita:0 "Early game: Move from Land-Based to Per-Capita Taxation"
 je_oiko_pb_gg_land_to_per_capita_reason:0 "budget · Early game\n\nEnact Per-Capita Taxation: it halves the land tax peasants and farmers pay and starts taxing town workers instead.\n\nHow to do it:\n1. Politics panel, Laws, Taxation group: find Per-Capita Taxation and press Enact.\n2. If you already have Egalitarianism and peasants are under a third of your workforce, enact Proportional Taxation instead and skip this step.\n\nHow it works: Land tax falls on peasants and farmers in farms; at Medium it is 0.70 under Land-Based but 0.35 under Per-Capita. Per-Capita adds a poll tax on every pop except peasants (and those who already pay land tax) plus a 10% income tax, so revenue grows with each factory job rather than with the peasant count. Traditionalism blocks it.\n\nSources (1.13.9): Generalist Gaming: How to TAX Pops (In Depth Guide), game files: common/laws/00_taxation.txt:52-82 (land based), 99-147 (per capita: currency_standards), localization/english/concepts_l_english.yml:1882, 1890 (land and per-capita tax payers)"
 je_oiko_pb_gg_leave_traditionalism:0 "Early game: Leave Traditionalism: enact Interventionism now"
 je_oiko_pb_gg_leave_traditionalism_reason:0 "industry · Early game\n\nYou have Manufacturies but not International Trade: enact Interventionism. Once International Trade is researched, go on to Laissez-Faire. If International Trade is only months away, research it first and enact Laissez-Faire directly.\n\nHow to do it:\n1. Politics panel, Laws, Economic System group: find Interventionism and press Enact.\n2. Technology panel: queue International Trade next, for Laissez-Faire.\n\nHow it works: Traditionalism halves the investment-pool efficiency of every owner class, cuts tax capacity by 25% and forbids Per-Capita, Proportional and Graduated Taxation. Interventionism has none of these maluses and unblocks the tax laws. The guide's advice is to skip Interventionism when Laissez-Faire is reachable, so this rule only fires while it is not.\n\nSources (1.13.9): Generalist Gaming: How to Start a Game: Evaluating Nations & Pre-Unpause Actions, Generalist Gaming: Interventionism is a TRAP, Laissez Faire is Just BETTER, game files: common/laws/00_economic_system.txt:5-40 (law_traditionalism), 57-85 (law_interventionism: manufacturies; disallowed by law_serfdom)"
 je_oiko_pb_gx_manufacturing_capital:0 "Early game · Expert tip: Put new factories in your capital and company states"
 je_oiko_pb_gx_manufacturing_capital_reason:0 "Expert tip (Generalist Gaming, an opinion the game files cannot confirm)\n\nindustry · Early game\n\nBuild Textile Mills, Furniture Manufacturies, Tooling Workshops and other factories in your capital or in states where your companies work, rather than spreading them.\n\nHow to do it:\n1. Construction panel: choose the factory, then click your capital (or a state named in your company's panel) instead of the first state offered.\n\nHow it works: Large buildings in one state gain economies of scale (+1% [Concept('concept_throughput','throughput')] per level above the first), capitals carry extra bonuses and companies boost their own building types; spread-out levels miss all three.\n\nSources (1.13.9): Generalist Gaming: Midgame INDUSTRIALIZATION through AUTOMATION, game files: common/defines (economies of scale)"
 je_oiko_pb_gx_clothes_before_furniture:0 "Early game · Expert tip: Clothes before furniture"
 je_oiko_pb_gx_clothes_before_furniture_reason:0 "Expert tip (Generalist Gaming, an opinion the game files cannot confirm)\n\nindustry · Early game\n\nClothes and furniture are both dear: build Textile Mills first, Furniture Manufacturies after.\n\nHow to do it:\n1. Construction panel: queue Textile Mills in a state with fabric (Livestock Ranches or Cotton Plantations) before any Furniture Manufactory.\n\nHow it works: Pops spend more on clothes than on furniture, and Textile Mills employ more and pay back sooner, so cheap clothes lift [Concept('concept_sol','standard of living')] and the market faster.\n\nSources (1.13.9): Generalist Gaming: Victoria 3: Consumer Goods Strategy"
 je_oiko_pb_gx_citizenship_supremacy:0 "Early game · Expert tip: Open citizenship: from National Supremacy to Racial Segregation or Cultural Exclusion"
 je_oiko_pb_gx_citizenship_supremacy_reason:0 "Expert tip (Generalist Gaming, an opinion the game files cannot confirm)\n\nreforms · Early game\n\nEnact Racial Segregation or Cultural Exclusion now, and Multiculturalism once you have Human Rights.\n\nHow to do it:\n1. Open the Politics panel, Laws tab, and find the law group of National Supremacy.\n2. Enact the replacement the detail names; the old law ends when it passes.\n\nHow it works: The guides want citizenship as accepting as you can pass: accepted cultures fill skilled jobs, migrate to you and do not radicalise over discrimination.\n\nSources (1.13.9): Generalist Gaming: BEST Human Rights Laws, game files: common/laws (law_racial_segregation, law_cultural_exclusion)"
 je_oiko_pb_gen_steel:0 "Mid game: Build steel mills next to your coal and iron"
 je_oiko_pb_gen_steel_reason:0 "industry · Mid game\n\nSteel is over 10% above [Concept('concept_base_price','base price')]: build steel mills in the states that already have coal and iron mines.\n\nHow to do it:\n1. Open the Market panel and find Steel: its tooltip shows which buildings make it.\n2. The analyzer's Market tab names the building, the state to build in and any input that is dear too.\n\nHow it works: Steel feeds railways, tools and later construction methods. Producing it next to its inputs inside your market keeps input prices low and the wages taxed at home.\n\nSources (1.13.9): game files: building_steel_mill (unlocked by steelworking)"
 je_oiko_pb_gen_steel_status:0 "Now:\nCoal Mine: #bold [GetPlayer.MakeScope.ScriptValue('oiko_lvl_building_coal_mine')|0]#! levels (rule: at least 1)\nIron Mine: #bold [GetPlayer.MakeScope.ScriptValue('oiko_lvl_building_iron_mine')|0]#! levels (rule: at least 1)"
 je_oiko_pb_gen_free_the_peasants:0 "Mid game: Move land reform from Tenant Farmers to Commercialized Agriculture"
 je_oiko_pb_gen_free_the_peasants_reason:0 "reforms · Mid game\n\nTenant Farmers keeps peasants on the land and your taxes on the poorest pops.\n\nHow to do it:\n1. Open the Politics panel, Laws tab, and find Commercialized Agriculture.\n2. Press Enact. Enactment takes months: keep the interest groups that support it in government, and watch the chance of success.\n3. Before it passes, check its effect on the budget: schools, health, police and welfare laws cost money every week.\n\nHow it works: Tenant Farmers forbids peasants from migrating inside the country and reserves 25% of arable land for subsistence, so factories cannot draw on the rural labour pool. Landowners will oppose the change, so pass it with the Industrialists or Petty Bourgeoisie in government.\n\nSources (1.13.9): game files: common/laws/00_land_reform.txt"
 je_oiko_pb_gen_voting:0 "Mid game: Plan the move off Autocracy to a limited franchise"
 je_oiko_pb_gen_voting_reason:0 "reforms · Mid game\n\nDemocracy is researched: move to Census or Wealth Voting once Industrialists or Petty Bourgeoisie can carry it.\n\nHow to do it:\n1. Politics panel, Laws, Distribution of Power group: find Census Voting (or Wealth Voting).\n2. Press Enact only while the Industrialists or the Petty Bourgeoisie are in government (Reform Government, Add To Government): they support it.\n\nHow it works: Census and Wealth Voting let the middle classes count in elections and are a stable halfway house before universal suffrage. Since 1.13 coups need a reason and enacting a law is one, so do not start it while the Armed Forces are angry.\n\nSources (1.13): https://vic3.paradoxwikis.com/Patch_1.13, game files: law unlocks"
 je_oiko_pb_gen_assembly:0 "Mid game: Liberalise speech to Right of Assembly"
 je_oiko_pb_gen_assembly_reason:0 "reforms · Mid game\n\nCensorship is in force and the Intelligentsia have clout: move to Right of Assembly.\n\nHow to do it:\n1. Open the Politics panel, Laws tab, and find Right Of Assembly.\n2. Press Enact. Enactment takes months: keep the interest groups that support it in government, and watch the chance of success.\n3. Before it passes, check its effect on the budget: schools, health, police and welfare laws cost money every week.\n\nHow it works: Liberal interest groups and movements push for it. Passing it removes a source of radicalism and opens the way to the labour and welfare laws that raise [Concept('concept_sol','standard of living')].\n\nSources (1.13.9): game files: law_right_of_assembly (unlocked by human_rights)"
 je_oiko_pb_gen_mid_engines:0 "Mid game: Make engines: build motor industry"
 je_oiko_pb_gen_mid_engines_reason:0 "industry · Mid game\n\nEngines are over 20% above [Concept('concept_base_price','base price')]: build motor industry next to your steel or iron.\n\nHow to do it:\n1. Open the Market panel and find Engines: its tooltip shows which buildings make it.\n2. The analyzer's Market tab names the building, the state to build in and any input that is dear too.\n\nHow it works: Railways, steam-powered mines and later factories all consume engines. Importing them at high prices drains the money the railways were meant to make.\n\nSources (1.13.9): game files: building_motor_industry (unlocked by atmospheric_engine)"
 je_oiko_pb_gen_mid_universities:0 "Mid game: Build a university"
 je_oiko_pb_gen_mid_universities_reason:0 "industry · Mid game\n\nYou have academia and no university: build one in your capital and expand it there, rather than spreading small ones.\n\nHow to do it:\n1. Open the Construction panel and choose University.\n2. Pick the state the analyzer's Now list or Market tab names (resources, workers, payback) and queue a level.\n\nHow it works: Universities add innovation (research speed) and are the first building that turns the budget into faster technology. Later technologies are what make each worker more productive.\n\nSources (1.13.9): game files: building_university (unlocked by academia)"
 je_oiko_pb_gen_mid_universities_status:0 "Now:\nWeekly balance: #bold [GetPlayer.MakeScope.ScriptValue('oiko_balance')|D]#! @money!\nUniversity: #bold [GetPlayer.MakeScope.ScriptValue('oiko_lvl_building_university')|0]#! levels (rule: below 1)"
 je_oiko_pb_gen_mid_professional_army:0 "Mid game: Move from Peasant Levies to a Professional Army"
 je_oiko_pb_gen_mid_professional_army_reason:0 "military · Mid game\n\nYou have military drill and still raise peasant levies: enact Professional Army.\n\nHow to do it:\n1. Open the Politics panel, Laws tab, and find Professional Army.\n2. Press Enact. Enactment takes months: keep the interest groups that support it in government, and watch the chance of success.\n3. Before it passes, check its effect on the budget: schools, health, police and welfare laws cost money every week.\n\nHow it works: Levies pull workers out of farms and factories when mobilised and fight poorly. A smaller professional army costs wages but keeps the economy running in war, which is the war you can afford.\n\nSources (1.13.9): game files: common/laws/00_army_model.txt (law_professional_army: military_drill)"
 je_oiko_pb_gen_mid_public_schools:0 "Mid game: Upgrade to Public Schools while the budget allows"
 je_oiko_pb_gen_mid_public_schools_reason:0 "reforms · Mid game\n\nLiteracy is under 50% and you run Religious or Private Schools with a surplus: enact Public Schools.\n\nHow to do it:\n1. Open the Politics panel, Laws tab, and find Public Schools.\n2. Press Enact. Enactment takes months: keep the interest groups that support it in government, and watch the chance of success.\n3. Before it passes, check its effect on the budget: schools, health, police and welfare laws cost money every week.\n\nHow it works: Public Schools raise [Concept('concept_literacy','literacy')] fastest and feed the [Concept('concept_pop_qualifications','qualifications')] late industry needs. It is a budget expense, so it belongs to a surplus, not a deficit.\n\nSources (1.13.9): game files: common/laws/00_education_system.txt (law_public_schools: empiricism)"
 je_oiko_pb_gen_mid_public_schools_status:0 "Now:\nDebt / credit limit: #bold [GetPlayer.MakeScope.ScriptValue('oiko_debt_share')|0%]#! (rule: below 30%)\nWeekly balance: #bold [GetPlayer.MakeScope.ScriptValue('oiko_balance')|D]#! @money!"
 je_oiko_pb_pru_leadership_war:0 "Mid game: Prepare the leadership war against Austria"
 je_oiko_pb_pru_leadership_war_reason:0 "unification · Mid game\n\nBuild arms industry and a cash buffer of about 20 weeks of military cost, find a Great Power ally, and keep the north German minors in your Zollverein bloc.\n\nHow to do it:\n1. Construction panel: queue Arms Industries and Munition Plants in Brandenburg or Silesia.\n2. Before the war, keep the [Concept('concept_treasury','treasury')] at about 20 weeks of military spending (the Budget Guard shows the weeks).\n3. Diplomacy panel: select a Great Power, Actions, Improve Relations, then propose an alliance or a defensive pact.\n\nHow it works: je_north_german_unification completes only when Prussia is the sole German unification candidate, normally by winning dp_leadership_germany against Austria. When it completes, every AI north German country in your customs union or backing your candidacy is annexed at once, the cheapest territorial jump in the game. War raises the goods bill by about 1.5× and cuts income, so enter it with money in hand.\n\nSources (1.13.9): game files: common/country_formation/00_major_formables.txt, events/german_unification.txt, https://steamcommunity.com/app/529340/discussions/0/4356744224515950098 (older)"
 je_oiko_pb_pru_leadership_war_status:0 "Now:\nDebt / credit limit: #bold [GetPlayer.MakeScope.ScriptValue('oiko_debt_share')|0%]#! (rule: below 30%)\nWeekly balance: #bold [GetPlayer.MakeScope.ScriptValue('oiko_balance')|D]#! @money!"
 je_oiko_pb_ngf_pan_nationalism:0 "Mid game: Research pan-nationalism for the final unification"
 je_oiko_pb_ngf_pan_nationalism_reason:0 "unification · Mid game\n\npan-nationalism unlocks the play that forms Germany.\n\nHow to do it:\n1. Open the Technology panel and put Pan-nationalism first in its queue.\n\nHow it works: je_german_unification and dp_unify_germany both need pan-nationalism, Major Power rank and independence. Forming GER needs 73% of the states of greater Germany.\n\nSources (1.13.9): game files: common/journal_entries/00_german_unification.txt, common/country_formation/00_major_formables.txt"
 je_oiko_pb_gbr_labour_laws:0 "Mid game: Move from Anti-Strike Laws to Right to Associate"
 je_oiko_pb_gbr_labour_laws_reason:0 "reforms · Mid game\n\nThen Regulatory Bodies: the Trade Unions are growing in the most industrial country on earth.\n\nHow to do it:\n1. Politics panel, Laws, the trade-union law group: find Right to Associate and press Enact.\n2. Once it passes, find Regulatory Bodies and press Enact.\n\nHow it works: Britain alone starts with Labor Movement and its Trade Unions can start non-marginal. A strong union group opposed to anti-strike laws produces [Concept('concept_radical','radicals')] and movements; giving them legal room keeps the workforce loyal.\n\nSources (1.13): game files: common/laws/00_labor_rights.txt, https://vic3.paradoxwikis.com/Great_Britain"
 je_oiko_pb_gbr_raj:0 "Mid game: Raise colonial affairs to 5 and proclaim the British Raj"
 je_oiko_pb_gbr_raj_reason:0 "empire · Mid game\n\nTake 'Proclaim the British Raj' while at peace.\n\nHow to do it:\n1. Politics panel, Institutions: raise Colonial Affairs one level at a time to level 5.\n2. Decisions panel: take 'Proclaim the British Raj' while you are at peace.\n\nHow it works: The decision ends East India Company rule (21 states) and moves India under the crown. It needs Civilizing Mission, colonial affairs at level 5, peace, and the Company as a non-player subject.\n\nSources (1.13.9): game files: common/decisions/british_raj_decisions.txt"
 je_oiko_pb_gbr_raj_status:0 "Now:\nWeekly balance: #bold [GetPlayer.MakeScope.ScriptValue('oiko_balance')|D]#! @money!"
 je_oiko_pb_gbr_ironclads:0 "Mid game: Build shipyards before researching ironclads"
 je_oiko_pb_gbr_ironclads_reason:0 "military · Mid game\n\nExpand shipyards and hardwood and steel supply first.\n\nHow to do it:\n1. Open the Construction panel and choose Shipyard.\n2. Pick the state the analyzer's Now list or Market tab names (resources, workers, payback) and queue a level.\n3. Open the Technology panel and put Ironclad Tech first in its queue.\n\nHow it works: Ships of the line and frigates turn obsolete the moment you have Ironclad tech, which weakens the whole 196-ship fleet at once. Replacements are limited by shipyard construction points, so build the capacity first and replace ships gradually.\n\nSources (1.13.9): game files: common/ship_types/00_ship_types.txt, https://vic3.paradoxwikis.com/Patch_1.13"
 je_oiko_pb_gbr_ironclads_status:0 "Now:\nShipyard: #bold [GetPlayer.MakeScope.ScriptValue('oiko_lvl_building_shipyard')|0]#! levels (rule: below 25)"
 je_oiko_pb_gbr_dominions:0 "Mid game: Unite Canada and Australia"
 je_oiko_pb_gbr_dominions_reason:0 "empire · Mid game\n\nUse the Canada and Australia journal buttons to merge the colonies.\n\nHow to do it:\n1. Journal: open the Canada entry and press its button to unite the colonies.\n2. Do the same in the Australia entry.\n\nHow it works: Britain starts with 4 Canadian and 4 Australian colonies, each costing influence as a separate subject. Merging them cuts the subject count and the number of independent liberty-desire risks.\n\nSources (1.13): game files: common/journal_entries/00_canada_australia.txt, https://vic3.paradoxwikis.com/Great_Britain"
 je_oiko_pb_usa_war_industry:0 "Mid game: Build war industry in the North before abolition"
 je_oiko_pb_usa_war_industry_reason:0 "military · Mid game\n\nAdd arms industry, munition plants and artillery foundries in northern states.\n\nHow to do it:\n1. Open the Construction panel and choose Arms Industry.\n2. Pick the state the analyzer's Now list or Market tab names (resources, workers, payback) and queue a level.\n\nHow it works: The USA starts with 4 arms, 1 munitions and 1 artillery level. In a civil war mobilised battalions consume far more goods than at peace, so shortages cut combat strength and imports drain the [Concept('concept_treasury','treasury')]. Owning the factories turns war spending into domestic wages and profit.\n\nSources (1.13): https://vic3.paradoxwikis.com/Strategy:_America, game files: common/history/buildings/05_north_america.txt"
 je_oiko_pb_usa_war_industry_status:0 "Now:\nArms Industry: #bold [GetPlayer.MakeScope.ScriptValue('oiko_lvl_building_arms_industry')|0]#! levels (rule: below 8)"
 je_oiko_pb_usa_commercialized_agriculture:0 "Mid game: Enact Commercialized Agriculture now that slavery is gone"
 je_oiko_pb_usa_commercialized_agriculture_reason:0 "industry · Mid game\n\nHomesteading reserves 35% of arable land for subsistence farming.\n\nHow to do it:\n1. Open the Politics panel, Laws tab, and find Commercialized Agriculture.\n2. Press Enact. Enactment takes months: keep the interest groups that support it in government, and watch the chance of success.\n3. Before it passes, check its effect on the budget: schools, health, police and welfare laws cost money every week.\n\nHow it works: That reserve caps the farms and plantations you can build. Commercialized Agriculture frees the land and pushes peasants into wage work. Before abolition the Planters and Yeoman Farmers block it; after, it also weakens the Planters further.\n\nSources (1.13.9): game files: common/laws/00_land_reform.txt, https://vic3.paradoxwikis.com/Strategy:_America"
 je_oiko_pb_usa_multicultural:0 "Mid game: Enact Multiculturalism to draw migrants"
 je_oiko_pb_usa_multicultural_reason:0 "reforms · Mid game\n\nThe USA is short of people, not land; a Humanitarian interest-group leader makes the law easier.\n\nHow to do it:\n1. Open the Politics panel, Laws tab, and find Multicultural.\n2. Press Enact. Enactment takes months: keep the interest groups that support it in government, and watch the chance of success.\n3. Before it passes, check its effect on the budget: schools, health, police and welfare laws cost money every week.\n\nHow it works: Migrants prefer countries that accept their culture, and Multiculturalism accepts all. It is also the main step of the Reconstruction journal (je_acw_equality) if the Civil War happened.\n\nSources (1.10): https://vic3.paradoxwikis.com/Strategy:_America, game files: law_multicultural (unlocked by human_rights)"
 je_oiko_pb_sar_two_sicilies:0 "Mid game: Two Sicilies, not Austria, decides a peaceful Italy"
 je_oiko_pb_sar_two_sicilies_reason:0 "unification · Mid game\n\nKeep relations with every Italian minor at Friendly (treaties help) and stay the highest-ranked Italian state.\n\nHow to do it:\n1. Diplomacy panel: select each Italian minor, Actions, Improve Relations, until relations read Friendly; sign the treaties they accept.\n2. Stay the highest-ranked Italian state: keep building industry (Construction panel) and do not lose wars.\n\nHow it works: Italy needs 12 of the 17 Italian states, and the independent Italian states own exactly 12, so a war-free Italy needs every minor including Two Sicilies (5 states). Peaceful absorption fires about 10% a month when you are the sole candidate and a Friendly neighbouring minor also backs unification.\n\nSources (1.13.9): game files: common/country_formation/00_major_formables.txt, events/italian_unification.txt, https://steamcommunity.com/app/529340/discussions/0/604168947372498524/"
 je_oiko_pb_sar_turin:0 "Mid game: Consider the Treaty of Turin before attacking Austria"
 je_oiko_pb_sar_turin_reason:0 "unification · Mid game\n\nCeding Savoy and Nice to France buys a French obligation.\n\nHow to do it:\n1. Before any Diplomatic Play against Austria: take the Treaty of Turin (cede Savoy and Nice to France) in the Decisions panel or the journal.\n\nHow it works: Savoy is not one of the 17 Italian formation states, so ceding it costs no progress, and France owing you makes French support against Austria likelier. The decision needs peace, cordial relations with France and France owning all of Rhône.\n\nSources (1.12): game files: common/decisions/france_savoy.txt, https://vic3.paradoxwikis.com/Sardinia-Piedmont"
 je_oiko_pb_aus_pan_nationalism:0 "Mid game: Research pan-nationalism to contest the German leadership"
 je_oiko_pb_aus_pan_nationalism_reason:0 "unification · Mid game\n\nThen court Bavaria and Saxony, keep Britain and Russia neutral, and raise relations with Prussia.\n\nHow to do it:\n1. Open the Technology panel and put Pan-nationalism first in its queue.\n\nHow it works: Germany can only be formed with pan-nationalism by a major power, and je_german_unification needs it too. Until then you cannot contest Prussia's leadership play. Release or puppet non-German lands before forming to avoid 70–84 infamy.\n\nSources (1.13): game files: common/country_formation/00_major_formables.txt, https://vic3.paradoxwikis.com/Strategy:_Austria"
 je_oiko_pb_gg_university_scale_cap:0 "Mid game: Grow your University in one state up to the economies-of-scale cap"
 je_oiko_pb_gg_university_scale_cap_reason:0 "industry · Mid game\n\nYou have a University and money to spare: add levels to the University you already have, in the same state, until it reaches 20 levels (30 after Mechanized Workshops, 50 after Shift Work), instead of building small ones elsewhere.\n\nHow to do it:\n1. Open the state that has your University, click the University building and press Expand (or queue it from the Construction panel in that state).\n2. Keep one level queued at a time until it reaches 20 levels; after Mechanized Workshops the cap is 30, after Shift Work 50.\n3. Build a second University only in another state once the first is at the cap.\n\nHow it works: Universities are government buildings with economies of scale: +1% [Concept('concept_throughput','throughput')] for each level above the first, capped at 20 levels by [Concept('concept_default','default')], +10 with Mechanized Workshops and +20 with Shift Work. A level costs 400 construction and mostly wages (500 clerks and laborers) plus 5-15 paper, so the bonus lowers the cost of each point of innovation. Universities are also the first government building to Downsize if default comes close.\n\nSources (1.13.9): Generalist Gaming: Liberalizing and Increasing [Concept('concept_sol','Standard of Living')], Generalist Gaming: EMPIRE Building as a Major Power, game files: common/static_modifiers/00_code_static_modifiers.txt (base_values: building_economy_of_scale_level_cap_add = 20; economy_of_scale: building_throughput_add = 0.01), game files: common/technology/technologies/10_production.txt (mechanized_workshops +10, shift_work +20), game files: common/building_groups/00_building_groups.txt (bg_government: economy_of_scale = yes), game files: common/production_methods/07_government.txt (pm_scholastic_education)"
 je_oiko_pb_gg_university_scale_cap_status:0 "Now:\nDebt / credit limit: #bold [GetPlayer.MakeScope.ScriptValue('oiko_debt_share')|0%]#! (rule: below 50%)\nWeekly balance: #bold [GetPlayer.MakeScope.ScriptValue('oiko_balance')|D]#! @money!\nUniversity: #bold [GetPlayer.MakeScope.ScriptValue('oiko_lvl_building_university')|0]#! levels (rule: below 20)\nUniversity: #bold [GetPlayer.MakeScope.ScriptValue('oiko_lvl_building_university')|0]#! levels (rule: at least 1)"
 je_oiko_pb_gg_dedicated_police:0 "Mid game: Replace Local Police Force with Dedicated Police Force"
 je_oiko_pb_gg_dedicated_police_reason:0 "reforms · Mid game\n\nYou have Law Enforcement and still run the Local Police Force: enact Dedicated Police Force.\n\nHow to do it:\n1. Politics panel, Laws tab, Policing group: find Dedicated Police Force and press Enact.\n\nHow it works: Local Police Force gives the Landowners +5% clout per police level; Dedicated Police Force drops that, lowers [Concept('concept_radical','radicals')] from political movements by 5% per level and raises the police institution's maximum by 2. Weaker Landowners make land reform and the other economic reforms easier to pass.\n\nSources (1.13.9): Generalist Gaming: LAWS & Interest Groups Overview, game files: common/laws/00_policing.txt (law_local_police: interest_group_ig_landowners_pol_str_mult = 0.05; law_dedicated_police: law_enforcement, state_radicals_from_political_movements_mult = -0.05)"
 je_oiko_pb_gg_restricted_child_labor:0 "Mid game: Move from Child Labor Allowed to Restricted Child Labor"
 je_oiko_pb_gg_restricted_child_labor_reason:0 "reforms · Mid game\n\nYou have Labor Movement and a school system: enact Restricted Child Labor.\n\nHow to do it:\n1. Politics panel, Laws tab, Children's Rights group: find Restricted Child Labor and press Enact.\n\nHow it works: Child Labor Allowed adds +5% mortality to laborers, machinists, farmers and peasants; Restricted Child Labor cuts that to +2% and raises the schools institution's maximum by one level, so [Concept('concept_literacy','literacy')] can climb further. It also halves the dependents' wage bonus (+30% to +15%): the trade is a little household income for more pops and more literate workers.\n\nSources (1.13.9): Generalist Gaming: LAWS & Interest Groups Overview, game files: common/laws/00_childrens_rights.txt (law_child_labor_allowed: mortality +0.05, dependent wage +0.30; law_restricted_child_labor: labor_movement, mortality +0.02, dependent wage +0.15, schools max investment +1)"
 je_oiko_pb_gg_ironclads:0 "Mid game: Research Ironclad before your next naval war"
 je_oiko_pb_gg_ironclads_reason:0 "military · Mid game\n\nYou keep a navy and have Screw Frigate: put Ironclad first in the military research queue, and avoid fleet battles against ironclads until you have it.\n\nHow to do it:\n1. Technology panel, Military tab: put Ironclad first in the queue.\n2. Until it is researched, keep fleets out of battles with ironclad navies (use them for convoys and troop transport).\n\nHow it works: Ironclad unlocks the Early Ironclad and Monitor. An Early Ironclad has 35 armor, a Ship of the Line 12, so older fleets barely damage it. The ships need iron (2,500) and engines (800) each, so plan iron mines and a Motor Industry before you queue them.\n\nSources (1.13.9): Generalist Gaming: The GREAT Wave 1.13 Meta Update, game files: common/ship_types/00_ship_types.txt (ship_type_ship_of_the_line: ship_armor_add = 12; ship_type_early_ironclad: ship_armor_add = 35, unlocking_technologies = { ironclad_tech }), game files: common/technology/technologies/20_military.txt (ironclad_tech, requires screw_frigate)"
 je_oiko_pb_gg_ironclads_status:0 "Now:\nNaval Administration: #bold [GetPlayer.MakeScope.ScriptValue('oiko_lvl_building_naval_administration')|0]#! levels (rule: at least 3)"
 je_oiko_pb_gg_public_trams:0 "Mid game: Transportation is dear: switch Urban Centers to Public Trams"
 je_oiko_pb_gg_public_trams_reason:0 "stability · Mid game\n\nYou have Railways and transportation is over 15% above [Concept('concept_base_price','base price')]: set the Public Transport [Concept('concept_production_method','production method')] of your Urban Centers to Public Trams.\n\nHow to do it:\n1. Open your capital's state panel and click the Urban Center.\n2. In Production Methods, Public Transport group, pick Public Trams; repeat in your other large cities.\n\nHow it works: Personal Transportation Only makes 2 transportation per level; Public Trams make 4 for 0.5 engines, so each level adds 60 worth of transportation (base 30) for 30 of engines (base 60) and needs 200 fewer workers. Transportation is a pop need, so cheaper transportation raises [Concept('concept_sol','standard of living')]. It adds 10 pollution per level, so skip states that are already heavily polluted.\n\nSources (1.13.9): Generalist Gaming: How to Build TALL (beginner) (calls it Public Trains), game files: common/production_methods/06_urban_center.txt:144-179 (pm_no_public_transport, pm_public_trams: railways), game files: common/goods/00_goods.txt (transportation 30, engines 60)"
 je_oiko_pb_gg_women_in_workplace:0 "Mid game: Let women work: enact Women in the Workplace or Women's Suffrage"
 je_oiko_pb_gg_women_in_workplace_reason:0 "industry · Mid game\n\nYou have Feminism and still keep Legal Guardianship or Propertied Women: enact Women in the Workplace, or Women's Suffrage if you already have a voting law.\n\nHow to do it:\n1. Politics panel, Laws, Rights of Women group: find Women in the Workplace and press Enact.\n2. If you have Census, Landed, Wealth or Universal Voting, enact Women's Suffrage instead.\n\nHow it works: The base working-adult ratio is 25%. Women in the Workplace adds 10 points (35%, about 40% more workers from the same population) and Women's Suffrage adds 15 (40%, about 60% more). That outweighs the +5% birth rate of Legal Guardianship and their -5% birth rate. More workers means more wages and taxes from the same pops.\n\nSources (1.13.9): Generalist Gaming: Population Growth Tutorial, game files: common/defines/00_defines.txt:1454 (WORKING_ADULT_RATIO_BASE = 0.25), game files: common/laws/00_rights_of_women.txt:5-23 (law_no_womens_rights +5% birth), :127-143 (law_women_in_the_workplace: feminism, +0.1), :169-195 (law_womens_suffrage: feminism, needs a voting law, +0.15)"
 je_oiko_pb_gx_newest_methods:0 "Mid game · Expert tip: Run the newest production methods unless their input is very dear"
 je_oiko_pb_gx_newest_methods_reason:0 "Expert tip (Generalist Gaming, an opinion the game files cannot confirm)\n\nindustry · Mid game\n\nSwitch each building's main [Concept('concept_production_method','production method')] to the newest one you have researched, unless its new input sells 75% or more above [Concept('concept_base_price','base price')].\n\nHow to do it:\n1. Open a building, its production methods: pick the newest in the first group.\n2. Before switching, check the new input's price in the analyzer's Market tab; at +75% or more, leave it.\n\nHow it works: Newer methods make more per worker, which raises wages and profits; the exception is an input so scarce that buying it costs more than the extra output earns.\n\nSources (1.13.9): Generalist Gaming: Midgame INDUSTRIALIZATION through AUTOMATION, Generalist Gaming: Patch 1.5 Production Method CHANGES"
 je_oiko_pb_gx_sol_for_growth:0 "Mid game · Expert tip: Lift standard of living toward 20 for growth, not beyond"
 je_oiko_pb_gx_sol_for_growth_reason:0 "Expert tip (Generalist Gaming, an opinion the game files cannot confirm)\n\nstability · Mid game\n\nAverage [Concept('concept_sol','standard of living')] is under 20: population growth peaks around 20, so raising it pays; past about 20-22 stop chasing it.\n\nHow to do it:\n1. Construction panel: build what makes the dearest of Grain, Clothes and Furniture (the analyzer's Market tab names building and state).\n2. With a surplus, enact Poor Laws (Politics panel, Laws, Welfare).\n\nHow it works: Birth rates rise with standard of living up to about 20, and from about 22 [Concept('concept_pop_qualifications','qualifications')] stop being the bottleneck; beyond that, money spent on standard of living buys little.\n\nSources (1.13.9): Generalist Gaming: Victoria 3 Population Growth Tutorial, Generalist Gaming: Victoria 3 Standard of Living Tutorial"
 je_oiko_pb_gx_regulatory_bodies:0 "Mid game · Expert tip: Move from Right to Associate to Regulatory Bodies"
 je_oiko_pb_gx_regulatory_bodies_reason:0 "Expert tip (Generalist Gaming, an opinion the game files cannot confirm)\n\nreforms · Mid game\n\nYou have Labor Movement and Right to Associate: enact Regulatory Bodies.\n\nHow to do it:\n1. Open the Politics panel, Laws tab, and find Regulatory Bodies.\n2. Press Enact. Enactment takes months: keep the interest groups that support it in government, and watch the chance of success.\n3. Before it passes, check its effect on the budget: schools, health, police and welfare laws cost money every week.\n\nHow it works: The guides rate Regulatory Bodies the best labour law for a growing industrial economy: it keeps the Trade Unions content without the costs of the worker-protection laws.\n\nSources (1.13.9): Generalist Gaming: BEST Human Rights Laws, game files: common/laws (law_regulatory_bodies: labor_movement)"
 je_oiko_pb_gen_welfare_when_solvent:0 "Late game: Enact Poor Laws now that the budget can carry them"
 je_oiko_pb_gen_welfare_when_solvent_reason:0 "reforms · Late game\n\nYou have a solid surplus and little debt: Poor Laws raise [Concept('concept_sol','standard of living')] and lower radicalism.\n\nHow to do it:\n1. Open the Politics panel, Laws tab, and find Poor Laws.\n2. Press Enact. Enactment takes months: keep the interest groups that support it in government, and watch the chance of success.\n3. Before it passes, check its effect on the budget: schools, health, police and welfare laws cost money every week.\n\nHow it works: Welfare pays pops below a standard-of-living threshold directly from the budget, an open-ended expense that grows in recessions. Enacted in deficit it is a common route to bankruptcy; enacted with a surplus it buys stability.\n\nSources (1.13): https://vic3.paradoxwikis.com/Budget, game files: law_poor_laws (unlocked by democracy)"
 je_oiko_pb_gen_welfare_when_solvent_status:0 "Now:\nDebt / credit limit: #bold [GetPlayer.MakeScope.ScriptValue('oiko_debt_share')|0%]#! (rule: below 20%)\nWeekly balance: #bold [GetPlayer.MakeScope.ScriptValue('oiko_balance')|D]#! @money!"
 je_oiko_pb_gen_late_electricity:0 "Late game: Build power plants"
 je_oiko_pb_gen_late_electricity_reason:0 "industry · Late game\n\nYou have electrical generation and no power plants: build them next to coal (later oil).\n\nHow to do it:\n1. Open the Construction panel and choose Power Plant.\n2. Pick the state the analyzer's Now list or Market tab names (resources, workers, payback) and queue a level.\n\nHow it works: Electricity is the input of the late production methods that multiply factory output. A late-game economy without power plants pays more per unit than its rivals in every factory.\n\nSources (1.13.9): game files: building_power_plant (unlocked by electrical_generation)"
 je_oiko_pb_gen_late_electricity_status:0 "Now:\nPower Plant: #bold [GetPlayer.MakeScope.ScriptValue('oiko_lvl_building_power_plant')|0]#! levels (rule: below 1)"
 je_oiko_pb_gen_late_oil:0 "Late game: Drill oil"
 je_oiko_pb_gen_late_oil_reason:0 "industry · Late game\n\nOil is over 20% above [Concept('concept_base_price','base price')]: build Oil Rigs in your states with oil (the state panel lists its resources); with none, oil has to be imported or a state with oil won.\n\nHow to do it:\n1. Open the Market panel and find Oil: its tooltip shows which buildings make it.\n2. The analyzer's Market tab names the building, the state to build in and any input that is dear too.\n\nHow it works: Oil feeds power plants, motor vehicles, synthetics and late warships. Late wars and late factories are decided by who owns the oil; buying it on a tight market costs more each year.\n\nSources (1.13.9): game files: building_oil_rig (unlocked by pumpjacks)"
 je_oiko_pb_gen_late_rubber:0 "Late game: Rubber is dear: build rubber plantations"
 je_oiko_pb_gen_late_rubber_reason:0 "industry · Late game\n\nRubber is over 30% above [Concept('concept_base_price','base price')]: build Rubber Plantations in your tropical states (the state panel lists its resources); with none, rubber has to be imported or a tropical colony gained.\n\nHow to do it:\n1. Open the Market panel and find Rubber: its tooltip shows which buildings make it.\n2. The analyzer's Market tab names the building, the state to build in and any input that is dear too.\n\nHow it works: Rubber grows only in a few tropical states and is needed by automobiles, electrics and late military goods. It is usually the reason for late colonial or trade deals, so plan it before demand peaks.\n\nSources (1.13.9): game files: building_rubber_plantation (unlocked by rubber_mastication)"
 je_oiko_pb_gen_late_fertilizer:0 "Late game: Make fertilizer: build chemical plants"
 je_oiko_pb_gen_late_fertilizer_reason:0 "industry · Late game\n\nFertilizer is over 20% above [Concept('concept_base_price','base price')]: build chemical plants.\n\nHow to do it:\n1. Open the Market panel and find Fertilizer: its tooltip shows which buildings make it.\n2. The analyzer's Market tab names the building, the state to build in and any input that is dear too.\n\nHow it works: Fertilizer production methods raise farm output a lot, freeing peasants for factories. Dear fertilizer keeps farms on old methods and food expensive.\n\nSources (1.13.9): game files: building_chemical_plant (unlocked by intensive_agriculture)"
 je_oiko_pb_gen_late_artillery:0 "Late game: Make artillery at home before a great war"
 je_oiko_pb_gen_late_artillery_reason:0 "military · Late game\n\nArtillery is over 20% above [Concept('concept_base_price','base price')] after 1880: build artillery foundries.\n\nHow to do it:\n1. Open the Market panel and find Artillery: its tooltip shows which buildings make it.\n2. The analyzer's Market tab names the building, the state to build in and any input that is dear too.\n\nHow it works: Late armies consume artillery every week, and [Concept('concept_mobilize_army','mobilisation')] multiplies that. An army supplied from imports turns a war into a budget crisis in months.\n\nSources (1.13.9): game files: building_artillery_foundry (unlocked by gunsmithing)"
 je_oiko_pb_gen_late_wage_subsidies:0 "Late game: Move from Poor Laws to Wage Subsidies when solvent"
 je_oiko_pb_gen_late_wage_subsidies_reason:0 "reforms · Late game\n\nYou have labor movement, Poor Laws, a solid surplus and little debt: enact Wage Subsidies.\n\nHow to do it:\n1. Open the Politics panel, Laws tab, and find Wage Subsidies.\n2. Press Enact. Enactment takes months: keep the interest groups that support it in government, and watch the chance of success.\n3. Before it passes, check its effect on the budget: schools, health, police and welfare laws cost money every week.\n\nHow it works: Wage subsidies lift the poorest workers' [Concept('concept_sol','standard of living')] and cut [Concept('concept_radical','radicals')], but they are a budget expense that grows in recessions, so only with a surplus.\n\nSources (1.13.9): game files: common/laws/00_welfare.txt (law_wage_subsidies: labor_movement)"
 je_oiko_pb_gen_late_wage_subsidies_status:0 "Now:\nDebt / credit limit: #bold [GetPlayer.MakeScope.ScriptValue('oiko_debt_share')|0%]#! (rule: below 20%)\nWeekly balance: #bold [GetPlayer.MakeScope.ScriptValue('oiko_balance')|D]#! @money!"
 je_oiko_pb_gen_late_universal_suffrage:0 "Late game: Answer the radicals: enact Universal Suffrage"
 je_oiko_pb_gen_late_universal_suffrage_reason:0 "reforms · Late game\n\nAfter 1885, with Wealth Voting, egalitarianism and over 10% [Concept('concept_radical','radicals')]: enact Universal Suffrage.\n\nHow to do it:\n1. Open the Politics panel, Laws tab, and find Universal Suffrage.\n2. Press Enact. Enactment takes months: keep the interest groups that support it in government, and watch the chance of success.\n3. Before it passes, check its effect on the budget: schools, health, police and welfare laws cost money every week.\n4. Politics panel, Interest Groups: hover each group to see how many radicals it has.\n5. If you are enacting a law the groups with the most radicals oppose, stop enacting it (Politics panel, the law in progress).\n6. Analyzer, Market tab: build what it lists for the dearest of Grain, Clothes and Furniture.\n\nHow it works: A narrow franchise leaves lower-strata movements no road but radicalism. A wider franchise turns them into parties, which costs the old ruling groups clout but lowers turmoil and revolution risk.\n\nSources (1.13.9): game files: common/laws/00_distribution_of_power.txt (law_universal_suffrage: egalitarianism)"
 je_oiko_pb_gg_public_health_insurance:0 "Late game: Enact Public Health Insurance while the budget allows"
 je_oiko_pb_gg_public_health_insurance_reason:0 "reforms · Late game\n\nYou have Pharmaceuticals, a surplus and little debt: enact Public Health Insurance, not Private Health Insurance or Charity Hospitals.\n\nHow to do it:\n1. Politics panel, Laws tab, Health System group: find Public Health Insurance and press Enact.\n2. Once it passes, raise the Health System institution one level at a time while the weekly balance stays positive.\n\nHow it works: Each health-institution level under Public Health Insurance gives every pop +0.5 [Concept('concept_sol','standard of living')] and -5% mortality. Private Health Insurance is 40% cheaper but gives the +0.5 only to the upper strata. More standard of living means fewer [Concept('concept_radical','radicals')] and more loyalists; the institution cost scales with population, so enact it from a surplus.\n\nSources (1.13.9): Generalist Gaming: LAWS & Interest Groups Overview, game files: common/laws/00_health_system.txt (law_public_health_insurance: state_standard_of_living_add = 0.5, state_mortality_mult = -0.05; law_private_health_insurance: upper strata only, cost -0.4)"
 je_oiko_pb_gg_public_health_insurance_status:0 "Now:\nDebt / credit limit: #bold [GetPlayer.MakeScope.ScriptValue('oiko_debt_share')|0%]#! (rule: below 30%)\nWeekly balance: #bold [GetPlayer.MakeScope.ScriptValue('oiko_balance')|D]#! @money!"
 je_oiko_pb_gg_no_chainsaws:0 "Late game: Keep Logging Camps on Steam Donkey, not Chainsaws"
 je_oiko_pb_gg_no_chainsaws_reason:0 "industry · Late game\n\nYou have Combustion Engine: leave the Special Equipment group of your Logging Camps on Steam Donkey. Use Chainsaws only where the state has no laborers left to hire.\n\nHow to do it:\n1. Open each state with Logging Camps and click the Logging Camps building.\n2. Production Methods, Special Equipment group: if it shows Chainsaws, pick Steam Donkey instead.\n\nHow it works: Against Steam Donkey, Chainsaws burn 4 oil instead of 4 coal (oil 40, coal 30 at base) and replace 500 more laborers (wage weight 1) with 250 engineers (wage weight 3). The wage bill goes up, the goods bill goes up, and the camp makes the same wood: it only saves 250 workers per level.\n\nSources (1.13.9): Generalist Gaming: BEGINNER ECONOMICS Guide: Mastering Buildings, game files: common/production_methods/09_misc_resource.txt:105-150 (pm_steam_donkey_building_logging_camp, pm_chainsaws), common/pop_types/laborers.txt, engineers.txt (wage_weight 1 and 3)"
 je_oiko_pb_gg_no_chainsaws_status:0 "Now:\nLogging Camp: #bold [GetPlayer.MakeScope.ScriptValue('oiko_lvl_building_logging_camp')|0]#! levels (rule: at least 1)"
 je_oiko_pb_gg_graduated_tax:0 "Late game: Shift tax from wages to dividends: enact Graduated Taxation"
 je_oiko_pb_gg_graduated_tax_reason:0 "budget · Late game\n\nYou have Socialism, run Proportional Taxation and average [Concept('concept_sol','standard of living')] is under 15: enact Graduated Taxation and keep the tax level where it is.\n\nHow to do it:\n1. Politics panel, Laws, Taxation group: find Graduated Taxation and press Enact.\n2. After it passes, check the weekly balance in the Budget panel; if revenue fell, raise the tax level one step rather than going back.\n\nHow it works: At the same tax level Graduated Taxation takes less from wages and more from dividends: at High, income tax 17.5% instead of 25% and dividends tax 25% instead of 15%. Wages feed the many low-wealth pops whose standard of living moves with every penny; dividends go to the few rich pops whose standard of living barely changes. The guide judges tax laws by who pays, not by the revenue line.\n\nSources (1.13.9): Generalist Gaming: How to TAX Pops (In Depth Guide), game files: common/laws/00_taxation.txt:187-230 (law_proportional_taxation), 256-290 (law_graduated_taxation: socialism)"
 je_oiko_pb_gen_debt_unhealthy:0 "Any time: Debt is over half the credit limit: freeze new state spending"
 je_oiko_pb_gen_debt_unhealthy_reason:0 "budget · Any time\n\nStart no new government construction or military units until debt is back under half the [Concept('concept_credit','credit limit')].\n\nHow to do it:\n1. Budget panel: the tax level and the Military Wages and Government Wages levels are set there; change the one the detail names by one step.\n2. Army: open an army, its Buildings tab, a Barracks, and press Downsize once per battalion you do not need in peacetime.\n3. Construction panel: if the detail says to pause building, press Cancel Construction on the most expensive item in the queue.\n\nHow it works: The game treats debt at or above 50% of the credit limit as an unhealthy economy. The credit limit is about 100K plus building cash reserves plus half of GDP, so a recession shrinks it at the same moment interest grows. That is how a slow deficit turns into a [Concept('concept_default','default')]. Great powers pay half the loan interest and can go further (see the great-power rule).\n\nSources (1.13.9): https://vic3.paradoxwikis.com/Budget, game files: common/defines (CREDIT_RATIO_HEALTH_THRESHOLD = 0.5)"
 je_oiko_pb_gen_debt_unhealthy_status:0 "Now:\nDebt / credit limit: #bold [GetPlayer.MakeScope.ScriptValue('oiko_debt_share')|0%]#! (rule: from 50%)"
 je_oiko_pb_gen_surplus_to_construction:0 "Any time: Turn the surplus into construction, not a lower tax level"
 je_oiko_pb_gen_surplus_to_construction_reason:0 "industry · Any time\n\nYou have no debt and a large surplus: add a Construction Sector level and keep the queue full. Lower the tax level only when peasants run out, [Concept('concept_legitimacy','legitimacy')] sits just under a threshold, or your poorest pops fall below their expected [Concept('concept_sol','standard of living')].\n\nHow to do it:\n1. Construction panel: queue one more Construction Sector level in a state with iron, wood and free workers.\n2. Queue the expansions the analyzer ranks with the shortest payback until the weekly balance is close to zero.\n\nHow it works: Money kept in the [Concept('concept_treasury','treasury')] is taken out of the economy: pops buy less, prices fall, buildings earn less. In Victoria 3 taxes are for moving money from consumption into construction, which builds the factories that pay wages and taxes later. A small deficit while building is normal.\n\nSources (1.13.9): Generalist Gaming: Understanding Victoria 3's Economics & Budget, Generalist Gaming: How to TAX Pops (In Depth Guide)"
 je_oiko_pb_gen_surplus_to_construction_status:0 "Now:\nDebt / credit limit: #bold [GetPlayer.MakeScope.ScriptValue('oiko_debt_share')|0%]#!\nWeekly balance: #bold [GetPlayer.MakeScope.ScriptValue('oiko_balance')|D]#! @money!"
 je_oiko_pb_gen_army_share:0 "Any time: The standing army eats the budget"
 je_oiko_pb_gen_army_share_reason:0 "military · Any time\n\nBring the army's running cost under about 40% of income in peacetime: Downsize the Barracks of battalions you do not need (cavalry and artillery first) and rely on conscription centers as the wartime reserve.\n\nHow to do it:\n1. Budget panel: the tax level and the Military Wages and Government Wages levels are set there; change the one the detail names by one step.\n2. Army: open an army, its Buildings tab, a Barracks, and press Downsize once per battalion you do not need in peacetime.\n3. Construction panel: if the detail says to pause building, press Cancel Construction on the most expensive item in the queue.\n\nHow it works: In 1.13 every battalion pays wages through its barracks and buys upkeep goods (small arms, ammunition, artillery, grain, iron) through the Army Logistics Center in its HQ state, all the time, even in peace. Conscription centers cost almost nothing until conscripts are raised, so they are the cheap reserve; regular battalions are the expensive standing force.\n\nSources (1.13.9): game files: common/combat_unit_types/00_land_combat_unit_types.txt, common/buildings/05_military.txt"
 je_oiko_pb_gen_army_share_status:0 "Now:\nWeekly balance: #bold [GetPlayer.MakeScope.ScriptValue('oiko_balance')|D]#! @money!\nMilitary share of spending: #bold [GetPlayer.MakeScope.ScriptValue('oiko_military_share')|0%]#! (rule: from 45%)"
 je_oiko_pb_gen_small_arms:0 "Any time: Small arms are dear: build arms industries"
 je_oiko_pb_gen_small_arms_reason:0 "military · Any time\n\nSmall arms cost over 10% above [Concept('concept_base_price','base price')]; add arms industry levels in your main market until they are at or below base.\n\nHow to do it:\n1. Open the Market panel and find Small Arms: its tooltip shows which buildings make it.\n2. The analyzer's Market tab names the building, the state to build in and any input that is dear too.\n\nHow it works: The Army Logistics Center buys small arms at market price, so a 25% markup costs 25% more every week. Domestic arms production lowers the price, employs workers who pay income tax, and pays dividends on state-owned levels.\n\nSources (1.13.9): game files: building_arms_industry (unlocked by gunsmithing)"
 je_oiko_pb_gen_grain:0 "Any time: Grain is expensive: build wheat or rye farms"
 je_oiko_pb_gen_grain_reason:0 "military · Any time\n\nGrain costs over 15% above [Concept('concept_base_price','base price')]. It feeds cavalry, mobilised units and your pops.\n\nHow to do it:\n1. Open the Market panel and find Grain: its tooltip shows which buildings make it.\n2. The analyzer's Market tab names the building, the state to build in and any input that is dear too.\n\nHow it works: Every cavalry type eats grain and each mobilised unit adds 0.75 grain. Grain is also the staple pop food, so an expensive grain price raises military cost and lowers [Concept('concept_sol','standard of living')] at the same time.\n\nSources (1.13.9): game files: combat unit upkeep, common/mobilization_options/00_mobilization_option.txt"
 je_oiko_pb_gen_sector_pacing:0 "Any time: Add construction sectors one at a time"
 je_oiko_pb_gen_sector_pacing_reason:0 "industry · Any time\n\nYou have a surplus and little debt: add one construction sector, then check the balance again a few weeks later.\n\nHow to do it:\n1. Construction panel: queue one level of Construction Sector in your most populous state.\n2. Four weeks later check the weekly balance in the Budget panel; queue the next level only if it is still positive.\n\nHow it works: Each sector adds wages and goods (wood and fabric, later iron and tools) every week, costs 25 construction itself and needs 1,000 workers since 1.12. Adding many at once is how players overshoot into debt before the new factories pay back.\n\nSources (1.13): https://vic3.paradoxwikis.com/Patch_1.12, https://vic3.paradoxwikis.com/Construction"
 je_oiko_pb_gen_sector_pacing_status:0 "Now:\nDebt / credit limit: #bold [GetPlayer.MakeScope.ScriptValue('oiko_debt_share')|0%]#! (rule: below 25%)\nWeekly balance: #bold [GetPlayer.MakeScope.ScriptValue('oiko_balance')|D]#! @money!"
 je_oiko_pb_gen_sol_low:0 "Any time: Standard of living is low: build farms, textile mills or furniture manufactories"
 je_oiko_pb_gen_sol_low_reason:0 "stability · Any time\n\nAverage [Concept('concept_sol','standard of living')] is under 10 after 1840 and grain, clothes or furniture is dear: build farms, textile mills or furniture manufacturies for the dearest one.\n\nHow to do it:\n1. Open the Market panel and find Clothes: its tooltip shows which buildings make it.\n2. The analyzer's Market tab names the building, the state to build in and any input that is dear too.\n\nHow it works: Low standard of living turns pops radical and slows the growth of the middle class that pays most taxes. Cheaper basic goods raise it without a budget cost.\n\nSources (1.13.9): game files: average_sol trigger"
 je_oiko_pb_gen_debt_great_power:0 "Any time: Great power: debt is past 80% of the credit limit, stop it growing"
 je_oiko_pb_gen_debt_great_power_reason:0 "budget · Any time\n\nAs a great power you can borrow to build up to about 80% of the [Concept('concept_credit','credit limit')] while GDP grows with it; past that, start no new government construction and no new units until debt falls.\n\nHow to do it:\n1. Construction panel: queue no new government buildings until debt falls under 80% of the credit limit (the Budget panel shows debt and credit).\n2. Keep the construction already queued: remove Construction Sector levels one at a time (open the building, Downsize) only if debt keeps rising.\n\nHow it works: Great powers get -50% loan interest from their rank (Laissez-Faire adds -25%), so debt that pays for construction costs them little; Generalist Gaming's guides run great powers at 80-90% of the credit limit. Past that, a dip in GDP shrinks the limit (about half of GDP plus building cash reserves) and pushes you into [Concept('concept_default','default')].\n\nSources (1.13.9): game files: common/country_ranks/00_country_ranks.txt (great_power: country_loan_interest_rate_mult = -0.5), Generalist Gaming: How to Make FREE MONEY in Victoria 3, Generalist Gaming: The Most Common MISTAKE Intermediate Players Make"
 je_oiko_pb_gen_debt_great_power_status:0 "Now:\nDebt / credit limit: #bold [GetPlayer.MakeScope.ScriptValue('oiko_debt_share')|0%]#! (rule: from 80%)"
 je_oiko_pb_gen_tax_level_too_high:0 "Any time: Very High taxes are breeding radicals"
 je_oiko_pb_gen_tax_level_too_high_reason:0 "stability · Any time\n\nThe tax level is Very High and over 10% of the population is radical: set it to High.\n\nHow to do it:\n1. Budget panel: set the tax level to High.\n\nHow it works: Very High taxes push the poorest below their expected [Concept('concept_sol','standard of living')], which is the main source of [Concept('concept_radical','radicals')]; it also lowers [Concept('concept_legitimacy','legitimacy')], and below 50 laws pass more slowly.\n\nSources (1.13.9): Generalist Gaming: Understanding Victoria 3's Economics & Budget"
 je_oiko_pb_aus_citizenship:0 "Any time: Drop National Supremacy: return to Subjecthood or go Multicultural"
 je_oiko_pb_aus_citizenship_reason:0 "reforms · Any time\n\nAbout three quarters of your pops are not south German.\n\nHow to do it:\n1. Open the Politics panel, Laws tab, and find the law group of National Supremacy.\n2. Enact the replacement the detail names; the old law ends when it passes.\n\nHow it works: Discriminated pops earn less, radicalise faster and feed secession movements. The Federal Solution rejects National Supremacy and Ethnostate, and Austria-Hungary needs Subjecthood or Multiculturalism.\n\nSources (1.13.9): game files: common/journal_entries/05_danubian_federation.txt, common/country_formation/00_formable_countries.txt"
 je_oiko_pb_gg_no_migration_controls:0 "Any time: Drop Migration Controls: enact No Migration Controls"
 je_oiko_pb_gg_no_migration_controls_reason:0 "industry · Any time\n\nMigration Controls keeps out every migrant whose culture has less than 60 acceptance with you: enact No Migration Controls.\n\nHow to do it:\n1. Politics panel, Laws tab, Migration group: find No Migration Controls and press Enact.\n\nHow it works: Migration Controls adds 60 migration restrictiveness, so only well-accepted cultures can move in. Immigrants arrive as working adults who fill the jobs your construction creates, without the 15-20 years a newborn needs.\n\nSources (1.13.9): Generalist Gaming: LAWS & Interest Groups Overview, game files: common/laws/00_migration.txt (law_migration_controls: country_migration_restrictiveness_add = 60)"
 je_oiko_pb_gg_naval_administration:0 "Any time: Ships need sailors: build a Naval Administration"
 je_oiko_pb_gg_naval_administration_reason:0 "military · Any time\n\nYou have Shipyards but no Naval Administration: if you own warships or plan to build them, build one Naval Administration level in a coastal state.\n\nHow to do it:\n1. Construction panel: choose Naval Administration and queue one level in a coastal state with free workers.\n2. Add more levels only as the fleet panel shows ships short of sailors.\n\nHow it works: In 1.13 sailors come only from Naval Administration buildings (recruits_sailors). Warships without sailors stay in port and add nothing to fleets, naval presence or diplomatic interest. A level costs only 100 construction.\n\nSources (1.13.9): Generalist Gaming: The GREAT Wave 1.13 Meta Update, game files: common/buildings/05_military.txt (building_naval_administration: recruits_sailors = yes, admiralty, construction_cost_very_low)"
 je_oiko_pb_gg_naval_administration_status:0 "Now:\nNaval Administration: #bold [GetPlayer.MakeScope.ScriptValue('oiko_lvl_building_naval_administration')|0]#! levels (rule: below 1)\nShipyard: #bold [GetPlayer.MakeScope.ScriptValue('oiko_lvl_building_shipyard')|0]#! levels (rule: at least 1)"
 je_oiko_pb_gg_privatize:0 "Any time: Losing money: put government-owned buildings up for privatization"
 je_oiko_pb_gg_privatize_reason:0 "budget · Any time\n\nYou are not on Laissez-Faire and run a deficit: press Enable Privatization on the factories, mines and farms the state owns, so the [Concept('concept_investment_pool','investment pool')] buys them.\n\nHow to do it:\n1. Open a state with a state-owned factory, mine or farm and click the building; its ownership section shows the levels your government owns.\n2. Press Enable Privatization on it. Repeat for the other state-owned buildings, largest first.\n3. Leave Government Administrations, Universities and Construction Sectors alone: they cannot be sold.\n\nHow it works: Investors buy the levels from the state at a price per level, which goes into the [Concept('concept_treasury','treasury')], and then the investment pool, not the budget, carries them. Under Laissez-Faire this is forced; under Command Economy it is banned. Administrations, universities and Construction Sectors cannot be privatized.\n\nSources (1.13.9): Generalist Gaming: Construction & Buildings (beginner), Generalist Gaming: How to Build TALL (beginner), game files: localization/english/concepts_l_english.yml:238 (concept_privatize_desc), interfaces_l_english.yml:133-137 (Enable Privatization), game files: common/laws/00_economic_system.txt:484 (law_laissez_faire: country_force_privatization_bool), :662 (law_command_economy: country_disable_non_company_privatization_bool)"
 je_oiko_pb_gg_privatize_status:0 "Now:\nWeekly balance: #bold [GetPlayer.MakeScope.ScriptValue('oiko_balance')|D]#! @money!"
 je_oiko_pb_gg_leave_command_economy:0 "Any time: Leave Command Economy: enact Laissez-Faire"
 je_oiko_pb_gg_leave_command_economy_reason:0 "industry · Any time\n\nYou run Command Economy and know International Trade: enact Laissez-Faire (Interventionism if Laissez-Faire cannot pass).\n\nHow to do it:\n1. Politics panel, Laws, Economic System group: find Laissez-Faire and press Enact.\n2. If its chance of success is low, enact Interventionism instead and try Laissez-Faire later.\n3. Before you press Enact, check the Budget panel: you will have to fund construction from the budget until the [Concept('concept_investment_pool','investment pool')] fills again.\n\nHow it works: Command Economy turns off the investment pool (and seizes it on enactment), so the budget has to pay for every new building, and part of every government dividend is still lost (its +40% dividend efficiency does not reach 100%). Laissez-Faire reinvests 100% of government dividends, gives +25% investment-pool efficiency to capitalists and shopkeepers and -25% loan interest. In the guide's models Command Economy lost to Laissez-Faire in every case.\n\nSources (1.13.9): Generalist Gaming: Low Prices and Command Economy are TERRIBLE, game files: common/laws/00_economic_system.txt:641-662 (law_command_economy: seize_investment_pool, country_disable_investment_pool_bool, country_government_dividends_efficiency_add = 0.4), game files: common/laws/00_economic_system.txt:469-484 (law_laissez_faire: international_trade)"
 je_oiko_pb_gg_hardwood_when_dear:0 "Any time: Hardwood is dear: switch some logging camps to Hardwood Production"
 je_oiko_pb_gg_hardwood_when_dear_reason:0 "industry · Any time\n\nHardwood is over 30% above [Concept('concept_base_price','base price')] while wood is at or below base: switch the Logging Camps in states with furniture, shipyards or arms nearby from Prioritize Softwood Production to Hardwood Production.\n\nHow to do it:\n1. Open a state with Logging Camps and click the Logging Camps building.\n2. In its Production Methods, Hardwood Production group, pick Hardwood Production; switch back to Prioritize Softwood Production when hardwood falls back to base price.\n\nHow it works: Hardwood Production trades 25 wood for 10 hardwood per 5,000 workers. At base prices (wood 20, hardwood 40) that loses 100 a week, so Prioritize Softwood Production is the right [Concept('concept_default','default')]; once hardwood is 30% above base and wood is not, the trade turns into a gain and it feeds the factories that need hardwood.\n\nSources (1.13.9): Generalist Gaming: How to INDUSTRIALIZE in the EARLY Game, game files: common/production_methods/09_misc_resource.txt:69-82 (pm_no_hardwood, pm_hardwood: wood -25, hardwood +10), game files: common/goods/00_goods.txt:128 (wood 20), :316 (hardwood 40)"
 je_oiko_pb_gg_hardwood_when_dear_status:0 "Now:\nLogging Camp: #bold [GetPlayer.MakeScope.ScriptValue('oiko_lvl_building_logging_camp')|0]#! levels (rule: at least 1)"
 je_oiko_pb_gg_hardwood_glut:0 "Any time: Hardwood is cheap: set Logging Camps to Prioritize Softwood Production"
 je_oiko_pb_gg_hardwood_glut_reason:0 "industry · Any time\n\nHardwood is at least 25% below base while wood is not: in the Hardwood Production group of your Logging Camps pick Prioritize Softwood Production.\n\nHow to do it:\n1. Open each state with Logging Camps and click the Logging Camps building.\n2. Production Methods, Hardwood Production group: pick Prioritize Softwood Production.\n3. Switch back once hardwood is at or above [Concept('concept_base_price','base price')] (the Market panel shows it).\n\nHow it works: Hardwood Production trades 25 wood for 10 hardwood; it pays only while hardwood costs over 2.5 times wood (base ratio is 2, 40 against 20). Focused Hardwood Production (-40 wood, +20 hardwood) breaks even at 2. With hardwood under 75% of base and wood over 75%, the ratio is under 2, so both lose money on every level.\n\nSources (1.13.9): Generalist Gaming: BEGINNER ECONOMICS Guide: Mastering Buildings, game files: common/production_methods/09_misc_resource.txt:69-99 (pm_no_hardwood, pm_hardwood, pm_increased_hardwood), common/goods/00_goods.txt (wood 20, hardwood 40)"
 je_oiko_pb_gg_hardwood_glut_status:0 "Now:\nLogging Camp: #bold [GetPlayer.MakeScope.ScriptValue('oiko_lvl_building_logging_camp')|0]#! levels (rule: at least 1)"
 je_oiko_pb_gg_wood_glut:0 "Any time: Wood is near its price floor: stop building Logging Camps"
 je_oiko_pb_gg_wood_glut_reason:0 "industry · Any time\n\nWood is 60% or more below [Concept('concept_base_price','base price')]: queue no new Logging Camps. Build what burns wood instead: a Construction Sector level, Furniture Manufactories or Paper Mills.\n\nHow to do it:\n1. [Concept('concept_construction_queue','Construction Queue')]: press Cancel Construction on any Logging Camps level not yet started.\n2. Construction panel: queue one Construction Sector level, or a Furniture Manufactory or Paper Mill in a state with Logging Camps.\n\nHow it works: A good's price cannot fall below 25% of base, reached when sell orders are twice the buy orders. Near that floor each extra camp adds wood nobody pays for, so it earns almost nothing. Construction Sectors, Furniture Manufactories (30 wood per level) and Paper Mills (30 wood) turn the cheap wood into goods worth more.\n\nSources (1.13.9): Generalist Gaming: How to Create VALUE (FREE Money & a Common Price MISTAKE), game files: common/defines/00_defines.txt:416-417 (PRICE_RANGE = 0.75, BUY_SELL_DIFF_AT_MAX_FACTOR = 2), common/production_methods/01_industry.txt:488-498 (pm_handcrafted_furniture), 1099-1108 (pm_pulp_pressing)"
 je_oiko_pb_gg_wood_glut_status:0 "Now:\nLogging Camp: #bold [GetPlayer.MakeScope.ScriptValue('oiko_lvl_building_logging_camp')|0]#! levels (rule: at least 1)"
 je_oiko_pb_gx_institution_buffer:0 "Any time · Expert tip: Default may come: lower one institution a level now"
 je_oiko_pb_gx_institution_buffer_reason:0 "Expert tip (Generalist Gaming, an opinion the game files cannot confirm)\n\nbudget · Any time\n\nDebt is over 70% of the [Concept('concept_credit','credit limit')] and still growing: lower the investment level of your least useful institution by one, so a [Concept('concept_default','default')] does not leave you short of [Concept('concept_bureaucracy','bureaucracy')].\n\nHow to do it:\n1. Politics panel, Institutions: pick the institution you need least right now (often Home Affairs or Colonial Affairs in peace) and lower its level by one.\n2. Raise it again once debt is back under half the credit limit.\n\nHow it works: A default and the cuts around it squeeze bureaucracy; institutions keep consuming it, and a bureaucracy deficit wastes taxes exactly when you need them. Lowering one institution in advance keeps a buffer.\n\nSources (1.13.9): Generalist Gaming: How to Make FREE MONEY in Victoria 3"
 je_oiko_pb_gx_institution_buffer_status:0 "Now:\nDebt / credit limit: #bold [GetPlayer.MakeScope.ScriptValue('oiko_debt_share')|0%]#! (rule: from 70%)\nWeekly balance: #bold [GetPlayer.MakeScope.ScriptValue('oiko_balance')|D]#! @money!"
 je_oiko_pb_gx_stack_administration:0 "Any time · Expert tip: Grow Government Administrations in one state"
 je_oiko_pb_gx_stack_administration_reason:0 "Expert tip (Generalist Gaming, an opinion the game files cannot confirm)\n\nbudget · Any time\n\nYou run Government Administrations in several places: add new levels to the largest one instead of starting new ones.\n\nHow to do it:\n1. Right-click your largest Government Administration and pick Expand, rather than building one in a new state.\n\nHow it works: [Concept('concept_throughput','Throughput')] from economies of scale raises the [Concept('concept_bureaucracy','bureaucracy')] each level makes without raising its wages, so one large administration gives more bureaucracy per pound than several small ones.\n\nSources (1.13.9): Generalist Gaming: How to Build TALL in Victoria 3"
 je_oiko_pb_gx_stack_administration_status:0 "Now:\nGovernment Administration: #bold [GetPlayer.MakeScope.ScriptValue('oiko_lvl_building_government_administration')|0]#! levels (rule: at least 2)"
 je_oiko_pb_gx_one_art_academy:0 "Any time · Expert tip: Keep Art Academies to one, in the capital"
 je_oiko_pb_gx_one_art_academy_reason:0 "Expert tip (Generalist Gaming, an opinion the game files cannot confirm)\n\nindustry · Any time\n\nYou run more than one Art Academy level: they rarely pay back. Keep one in the capital and Downsize the rest.\n\nHow to do it:\n1. Open each Art Academy outside the capital and press Downsize.\n\nHow it works: Fine art sells to a handful of very rich pops; an academy is worth it mainly for the Intelligentsia's and academics' clout, which one in the capital gives.\n\nSources (1.13.9): Generalist Gaming: How to Make FREE MONEY in Victoria 3, Generalist Gaming: How to AUTOMATE Your Economy"
 je_oiko_pb_gx_one_art_academy_status:0 "Now:\nArt Academy: #bold [GetPlayer.MakeScope.ScriptValue('oiko_lvl_building_art_academy')|0]#! levels (rule: at least 2)"
 je_oiko_pb_gx_citizenship_ethnostate:0 "Any time · Expert tip: Open citizenship: leave Ethnostate"
 je_oiko_pb_gx_citizenship_ethnostate_reason:0 "Expert tip (Generalist Gaming, an opinion the game files cannot confirm)\n\nreforms · Any time\n\nEnact National Supremacy, then Racial Segregation or Cultural Exclusion, toward Multiculturalism.\n\nHow to do it:\n1. Open the Politics panel, Laws tab, and find the law group of Ethnostate.\n2. Enact the replacement the detail names; the old law ends when it passes.\n\nHow it works: The guides want citizenship as accepting as you can pass: more accepted cultures means more pops who can work every job, vote and live without discrimination [Concept('concept_radical','radicals')], and more migrants.\n\nSources (1.13.9): Generalist Gaming: BEST Human Rights Laws, game files: common/laws (law_ethnostate, law_multicultural: human_rights)"
