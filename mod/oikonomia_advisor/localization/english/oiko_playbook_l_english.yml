l_english:
 je_oiko_pb_gen_debt_unhealthy:0 "Playbook: Debt is over half the credit limit: freeze new state spending"
 je_oiko_pb_gen_debt_unhealthy_reason:0 "budget · any\n\nStart no new government construction or military units until debt is back under half the credit limit.\n\nHow it works: The game treats debt at or above 50% of the credit limit as an unhealthy economy. The credit limit is about 100K plus building cash reserves plus half of GDP, so a recession shrinks it at the same moment interest grows. That is how a slow deficit turns into a sudden default.\n\nSources (1.13): https://vic3.paradoxwikis.com/Budget, game files: common/defines (CREDIT_RATIO_HEALTH_THRESHOLD = 0.5)"
 je_oiko_pb_gen_near_default:0 "Playbook: Default is close: act this week"
 je_oiko_pb_gen_near_default_reason:0 "budget · any\n\nRaise the tax level one step, lower government and military wages one step, and pause the most expensive construction.\n\nHow it works: At the credit limit the country defaults. Construction stops, and throughput, offense and defense take -5% at once, worsening by -1% a week down to -50%. Declaring bankruptcy wipes the debt, but it resets institutions, empties building cash, radicalises 10% of pops, and adds -75% prestige and +50% interest that decay over 10 years. Avoiding default is always cheaper than recovering from it.\n\nSources (1.13): https://vic3.paradoxwikis.com/Budget, game files: common/defines (DECLARE_BANKRUPTCY_*)"
 je_oiko_pb_gen_tax_bridge:0 "Playbook: Treasury lasts under half a year: raise taxes one level as a bridge"
 je_oiko_pb_gen_tax_bridge_reason:0 "budget · any\n\nRaise the tax level one step in the Budget panel now, and plan to lower it again once spending is cut or new industry pays taxes.\n\nHow it works: Under per-capita taxation, going from Medium to High raises the per-capita rate from 0.70 to 0.85 and the land rate from 0.35 to 0.425, about +20% on poll taxes. It costs -10% legitimacy, +50% radicals from movements and squeezes the poorest pops, so it is a bridge, not a policy.\n\nSources (1.13): https://vic3.paradoxwikis.com/Budget, game files: common/laws/00_taxation.txt"
 je_oiko_pb_gen_lower_taxes_when_rich:0 "Playbook: Lower the tax level instead of hoarding gold"
 je_oiko_pb_gen_lower_taxes_when_rich_reason:0 "reforms · any\n\nYou have no debt and a large surplus: lower the tax level one step.\n\nHow it works: A lower tax level leaves money with pops, which raises their standard of living, gives +5% legitimacy at Low (+10% at Very Low) and -10%/-20% radicals from movements. A treasury above about 20% of annual GDP has diminishing returns anyway; if you still have unused money, build instead.\n\nSources (1.13): https://vic3.paradoxwikis.com/Budget, game files: common/defines (GOLD_RESERVE_LIMIT_FACTOR = 0.2)"
 je_oiko_pb_gen_army_share:0 "Playbook: The standing army eats the budget"
 je_oiko_pb_gen_army_share_reason:0 "military · any\n\nBring the army's running cost under about 40% of income in peacetime: fewer regular battalions, cheaper unit types, conscripts as the reserve.\n\nHow it works: In 1.13 every battalion pays wages through its barracks and buys upkeep goods (small arms, ammunition, artillery, grain, iron) through the Army Logistics Center in its HQ state, all the time, even in peace. Conscription centers cost almost nothing until conscripts are raised, so they are the cheap reserve; regular battalions are the expensive standing force.\n\nSources (1.13.9): game files: common/combat_unit_types/00_land_combat_unit_types.txt, common/buildings/05_military.txt"
 je_oiko_pb_gen_small_arms:0 "Playbook: Make small arms cheap: build arms industry"
 je_oiko_pb_gen_small_arms_reason:0 "military · any\n\nSmall arms cost over 10% above base price; add arms industry levels in your main market until they are at or below base.\n\nHow it works: The Army Logistics Center buys small arms at market price, so a 25% markup costs 25% more every week. Domestic arms production lowers the price, employs workers who pay income tax, and pays dividends on state-owned levels.\n\nSources (1.13.9): game files: building_arms_industry (unlocked by gunsmithing)"
 je_oiko_pb_gen_ammunition:0 "Playbook: Make ammunition cheap: build munition plants"
 je_oiko_pb_gen_ammunition_reason:0 "military · early\n\nAmmunition costs over 10% above base price; every skirmish battalion uses one a week and trench infantry later uses two.\n\nHow it works: Ammunition shortages put input-shortage penalties on supply, and since 1.13.5 formations also take production-shortage penalties. Cheap ammunition also prepares the move to better infantry.\n\nSources (1.13.9): game files: building_munition_plant (unlocked by percussion_cap), https://vic3.paradoxwikis.com/Patch_1.13.X"
 je_oiko_pb_gen_grain:0 "Playbook: Grain is expensive: build wheat or rye farms"
 je_oiko_pb_gen_grain_reason:0 "military · any\n\nGrain costs over 15% above base price. It feeds cavalry, mobilised units and your pops.\n\nHow it works: Every cavalry type eats grain and each mobilised unit adds 0.75 grain. Grain is also the staple pop food, so an expensive grain price raises military cost and lowers standard of living at the same time.\n\nSources (1.13.9): game files: combat unit upkeep, common/mobilization_options/00_mobilization_option.txt"
 je_oiko_pb_gen_construction_inputs:0 "Playbook: Make construction inputs cheap"
 je_oiko_pb_gen_construction_inputs_reason:0 "industry · early\n\nWood, fabric, iron or tools are over 15% above base price: build logging camps, iron mines or tooling workshops for whichever is dear.\n\nHow it works: Construction sectors burn wood and fabric (Wooden Buildings) or wood, fabric, iron and tools (Iron Frame) for every construction point, at market price. Cheaper inputs mean more buildings for the same money.\n\nSources (1.13.9): game files: common/production_methods/13_construction.txt, https://steamcommunity.com/app/529340/discussions/0/3717188807309600790 (older)"
 je_oiko_pb_gen_iron_frame:0 "Playbook: Switch construction sectors to Iron Frame Buildings"
 je_oiko_pb_gen_iron_frame_reason:0 "industry · early\n\nIron and tools are cheap now: Iron Frame Buildings give more construction per sector.\n\nHow it works: Iron Frame needs iron and tools on top of wood and fabric. Switching while those goods are expensive raises the construction bill more than the extra speed is worth; with them at base price it is a clear gain.\n\nSources (1.13.9): game files: pm_iron_frame_buildings (unlocked by urban_planning)"
 je_oiko_pb_gen_steel:0 "Playbook: Build steel mills next to your coal and iron"
 je_oiko_pb_gen_steel_reason:0 "industry · mid\n\nSteel is over 10% above base price: build steel mills in the states that already have coal and iron mines.\n\nHow it works: Steel feeds railways, tools and later construction methods. Producing it next to its inputs inside your market keeps input prices low and the wages taxed at home.\n\nSources (1.13.9): game files: building_steel_mill (unlocked by steelworking)"
 je_oiko_pb_gen_sector_pacing:0 "Playbook: Add construction sectors one at a time"
 je_oiko_pb_gen_sector_pacing_reason:0 "industry · any\n\nYou have a surplus and little debt: add one construction sector, then check the balance again a few weeks later.\n\nHow it works: Each sector adds wages and goods (wood and fabric, later iron and tools) every week, costs 25 construction itself and needs 1,000 workers since 1.12. Adding many at once is how players overshoot into debt before the new factories pay back.\n\nSources (1.13): https://vic3.paradoxwikis.com/Patch_1.12, https://vic3.paradoxwikis.com/Construction"
 je_oiko_pb_gen_laissez_faire:0 "Playbook: Consider Laissez-Faire once private investment can carry construction"
 je_oiko_pb_gen_laissez_faire_reason:0 "industry · mid\n\nThe Industrialists are strong enough to back it: Laissez-Faire moves building costs off the state budget.\n\nHow it works: Laissez-Faire gives -25% loan interest, a larger private construction share and +25% investment efficiency for shopkeepers and capitalists. The price is less direct control over what gets built.\n\nSources (1.13.9): game files: common/laws/00_economic_system.txt (unlocked by international_trade)"
 je_oiko_pb_gen_industrialists_in:0 "Playbook: Bring the Industrialists into government"
 je_oiko_pb_gen_industrialists_in_reason:0 "reforms · early\n\nThe Industrialists have clout but no seat: add them to the government.\n\nHow it works: A law's base chance to pass is the clout of the government interest groups that endorse it, plus movements and the ruler. Landowners and the Armed Forces back few economic reforms; the Industrialists back the market reforms your industry needs.\n\nSources (1.13): https://vic3.paradoxwikis.com/Laws"
 je_oiko_pb_gen_free_the_peasants:0 "Playbook: Move land reform from Tenant Farmers to Commercialized Agriculture"
 je_oiko_pb_gen_free_the_peasants_reason:0 "reforms · mid\n\nTenant Farmers keeps peasants on the land and your taxes on the poorest pops.\n\nHow it works: Tenant Farmers forbids peasants from migrating inside the country and reserves 25% of arable land for subsistence, so factories cannot draw on the rural labour pool. Landowners will oppose the change, so pass it with the Industrialists or Petty Bourgeoisie in government.\n\nSources (1.13.9): game files: common/laws/00_land_reform.txt"
 je_oiko_pb_gen_voting:0 "Playbook: Plan the move off Autocracy to a limited franchise"
 je_oiko_pb_gen_voting_reason:0 "reforms · mid\n\nDemocracy is researched: move to Census or Wealth Voting once Industrialists or Petty Bourgeoisie can carry it.\n\nHow it works: Census and Wealth Voting let the middle classes count in elections and are a stable halfway house before universal suffrage. Since 1.13 coups need a reason and enacting a law is one, so do not start it while the Armed Forces are angry.\n\nSources (1.13): https://vic3.paradoxwikis.com/Patch_1.13, game files: law unlocks"
 je_oiko_pb_gen_assembly:0 "Playbook: Liberalise speech to Right of Assembly"
 je_oiko_pb_gen_assembly_reason:0 "reforms · mid\n\nCensorship is in force and the Intelligentsia have clout: move to Right of Assembly.\n\nHow it works: Liberal interest groups and movements push for it. Passing it removes a source of radicalism and opens the way to the labour and welfare laws that raise standard of living.\n\nSources (1.13.9): game files: law_right_of_assembly (unlocked by human_rights)"
 je_oiko_pb_gen_welfare_when_solvent:0 "Playbook: Enact Poor Laws now that the budget can carry them"
 je_oiko_pb_gen_welfare_when_solvent_reason:0 "reforms · late\n\nYou have a solid surplus and little debt: Poor Laws raise standard of living and lower radicalism.\n\nHow it works: Welfare pays pops below a standard-of-living threshold directly from the budget, an open-ended expense that grows in recessions. Enacted in deficit it is a common route to bankruptcy; enacted with a surplus it buys stability.\n\nSources (1.13): https://vic3.paradoxwikis.com/Budget, game files: law_poor_laws (unlocked by democracy)"
 je_oiko_pb_pru_opening_army:0 "Playbook: Prussia's opening: the army is the deficit"
 je_oiko_pb_pru_opening_army_reason:0 "military · opening\n\nThe 1836 army is 81 skirmish infantry plus heavy cavalry and mobile artillery, about 70% of income. Cut lancers, cuirassiers and dragoons, move rear skirmish battalions to line infantry (or disband part), and keep the conscription centers as the wartime reserve.\n\nHow it works: At base prices the skirmish infantry alone cost about 13.8K a week in small arms and ammunition; as line infantry the same 81 battalions would cost about 4.9K, roughly the whole starting deficit. Conscripts cost almost nothing until raised. Treat the cut as temporary: rebuild a modern army on cheap domestic arms before the leadership war with Austria in the 1850s–60s.\n\nSources (1.13.9): game files: common/history/military_formations/00_military_formations_europe.txt, common/combat_unit_types/00_land_combat_unit_types.txt, https://vic3.paradoxwikis.com/Prussia"
 je_oiko_pb_pru_opening_plan:0 "Playbook: Prussia's first two years: stop the bleeding, then compound"
 je_oiko_pb_pru_opening_plan_reason:0 "industry · opening\n\nIn order: cut the army bill, build paper mills (paper is most of the 16K government-goods bill), build arms industry in Brandenburg and logging camps for wood, then add construction sectors one at a time, funded by the treasury, not by debt.\n\nHow it works: The treasury lasts about 15 months at the starting deficit. That is enough to fund construction that pays back, but not a permanently oversized army. Factories that employ peasants turn poll-tax subsistence farmers into wage earners who pay income tax.\n\nSources (1.13.9): https://vic3.paradoxwikis.com/Prussia, https://vic3.paradoxwikis.com/Budget, game files: common/production_methods/07_government.txt"
 je_oiko_pb_pru_industry_chain:0 "Playbook: Build the Ruhr–Silesia heavy-industry chain"
 je_oiko_pb_pru_industry_chain_reason:0 "industry · early\n\nCoal and iron mines (Rhineland/Ruhr, Silesia), then tooling workshops, then steel mills once steelworking is researched, then railways in the industrial states.\n\nHow it works: Prussia's coal and iron lie in the Rhineland and Silesia. Each link feeds the next inside your own market, so input prices stay low and the wages stay taxable at home; tools and steel later make construction itself cheaper (Iron Frame, then steel methods).\n\nSources (1.13): https://vic3.paradoxwikis.com/Prussia"
 je_oiko_pb_pru_public_schools:0 "Playbook: Keep Public Schools and avoid Multiculturalism until Germany is formed"
 je_oiko_pb_pru_public_schools_reason:0 "unification · early\n\nGerman unification starts from cultural fervor: north German fervor must reach 40 and south German 30.\n\nHow it works: je_german_unification_idea needs north_german fervor ≥ 40 and south_german ≥ 30. Fervor rises with literacy, Public Schools, academics, nationalism techs and war casualties, and it falls under Multiculturalism.\n\nSources (1.13.9): game files: common/journal_entries/00_german_unification.txt"
 je_oiko_pb_pru_nationalism:0 "Playbook: Research nationalism early"
 je_oiko_pb_pru_nationalism_reason:0 "unification · early\n\nPut nationalism high in the research queue.\n\nHow it works: nationalism is required by je_north_german_unification and by dp_leadership_germany, the leadership war against Austria. It also raises fervor among your German pops (+5 at full coverage).\n\nSources (1.13.9): game files: common/journal_entries/00_german_unification.txt, common/diplomatic_plays/00_diplomatic_plays.txt"
 je_oiko_pb_pru_schleswig_holstein:0 "Playbook: Plan how the Schleswig-Holstein question gets solved"
 je_oiko_pb_pru_schleswig_holstein_reason:0 "unification · early\n\nBy war with Denmark or by backing Holstein's independence: both German unification journal entries require it.\n\nHow it works: Both the North and the South German unification JEs need the global flag schleswig_holstein_question_solved, set when the Schleswig-Holstein state region is held by German-culture owners that are not Danish subjects. Without it the North German Federation cannot form, however strong you are.\n\nSources (1.13.9): game files: common/journal_entries/00_german_unification.txt (je_schleswig_holstein_question)"
 je_oiko_pb_pru_leadership_war:0 "Playbook: Prepare the leadership war against Austria"
 je_oiko_pb_pru_leadership_war_reason:0 "unification · mid\n\nBuild arms industry and a cash buffer of about 20 weeks of military cost, find a Great Power ally, and keep the north German minors in your Zollverein bloc.\n\nHow it works: je_north_german_unification completes only when Prussia is the sole German unification candidate, normally by winning dp_leadership_germany against Austria. When it completes, every AI north German country in your customs union or backing your candidacy is annexed at once, the cheapest territorial jump in the game. War raises the goods bill by about 1.5× and cuts income, so enter it with money in hand.\n\nSources (1.13.9): game files: common/country_formation/00_major_formables.txt, events/german_unification.txt, https://steamcommunity.com/app/529340/discussions/0/4356744224515950098 (older)"
 je_oiko_pb_pru_war_chest:0 "Playbook: Do not start a unification war with this much debt"
 je_oiko_pb_pru_war_chest_reason:0 "unification · mid\n\nDebt is over 30% of the credit limit: first rebuild a buffer of about 20 weeks of military cost.\n\nHow it works: Mobilisation multiplies weapon and ammunition upkeep by 1.5 and adds grain, occupied states pay no tax, and war exhaustion grows. Entering a long war with debt already high is the classic way to default mid-war, and default also costs -5% to -50% offense and defense.\n\nSources (1.13.9): https://vic3.paradoxwikis.com/Budget, game files: common/mobilization_options/00_mobilization_option.txt"
 je_oiko_pb_ngf_pan_nationalism:0 "Playbook: Research pan-nationalism for the final unification"
 je_oiko_pb_ngf_pan_nationalism_reason:0 "unification · mid\n\npan-nationalism unlocks the play that forms Germany.\n\nHow it works: je_german_unification and dp_unify_germany both need pan-nationalism, Major Power rank and independence. Forming GER needs 73% of the states of greater Germany.\n\nSources (1.13.9): game files: common/journal_entries/00_german_unification.txt, common/country_formation/00_major_formables.txt"
 je_oiko_pb_gbr_no_new_navy:0 "Playbook: No new ships or naval administration in the opening"
 je_oiko_pb_gbr_no_new_navy_reason:0 "military · opening\n\nSpend construction on sectors and industry instead: nobody can contest the Royal Navy in the 1830s.\n\nHow it works: Each naval administration level puts 1,000 soldiers and officers on the military wage bill, and Britain's 136 levels already crew about 124,000 sailors for 196 ships. New hulls add grain, hardwood and wage upkeep with no strategic return.\n\nSources (1.13.9): game files: common/buildings/05_military.txt, common/ship_types/00_ship_types.txt, https://vic3.paradoxwikis.com/Patch_1.13"
 je_oiko_pb_gbr_construction:0 "Playbook: Add construction sectors in Lancashire and Yorkshire"
 je_oiko_pb_gbr_construction_reason:0 "industry · opening\n\nBritain starts with only 9 construction sector levels for the world's richest economy: add levels until the weekly surplus is close to zero.\n\nHow it works: Construction capacity is the bottleneck for every other plan. Lancashire and Yorkshire hold the coal (45 of 59 levels) and the tools, so sectors there keep their input chain short.\n\nSources (1.13.9): game files: common/history/buildings/00_west_europe.txt"
 je_oiko_pb_gbr_corn_laws:0 "Playbook: Repeal the Corn Laws: enact Free Trade while the Landowners are out"
 je_oiko_pb_gbr_corn_laws_reason:0 "corn_laws · early\n\nFree Trade needs no research for Britain; pass it while the Landowners sit in opposition.\n\nHow it works: Free Trade removes tariffs but gives +25% trade advantage, which suits the world's top exporter. Passing it completes the Corn Laws journal and gives labourer loyalists; the Landowners' approval penalty only applies if they are in government, so passing it while they are in opposition avoids it.\n\nSources (1.13.9): game files: common/journal_entries/00_corn_laws.txt, common/laws/00_trade_policy.txt"
 je_oiko_pb_gbr_grain_warning:0 "Playbook: Grain is over 25% above base: defuse the Corn Laws crisis"
 je_oiko_pb_gbr_grain_warning_reason:0 "corn_laws · early\n\nCut the grain import tariff or build rye farms in the Irish states.\n\nHow it works: The Corn Laws journal activates when grain is more than 25% above base and the Landowners are powerful and in government, and its events include a bread-starvation event. Ship upkeep also consumes grain, so a big navy pushes the price up.\n\nSources (1.13.9): game files: common/journal_entries/00_corn_laws.txt, common/ship_types/00_ship_types.txt"
 je_oiko_pb_gbr_fabric_glut:0 "Playbook: Stop expanding textiles"
 je_oiko_pb_gbr_fabric_glut_reason:0 "industry · early\n\nFabric sells below 80% of base price: build goods that are above base price instead.\n\nHow it works: A building's profit falls with its output price. With fabric far below base, new mills spread wages and dividends thinner across the whole sector and lower tax income. The exception is ship construction, which needs 390 fabric per ship of the line.\n\nSources (1.13.9): game files: common/history/buildings/00_west_europe.txt"
 je_oiko_pb_gbr_chartism:0 "Playbook: Answer the Chartists: enact Census Voting"
 je_oiko_pb_gbr_chartism_reason:0 "reforms · early\n\nWiden the franchise one step before radicalism grows.\n\nHow it works: Britain's radical party is the Chartist Party for as long as universal suffrage is missing. Widening the vote cuts radicals among the newly enfranchised middle classes, and Census Voting is a smaller jump than universal suffrage, so the Landowners resist it less.\n\nSources (1.13.9): game files: common/parties/radical_party.txt"
 je_oiko_pb_gbr_labour_laws:0 "Playbook: Move from Anti-Strike Laws to Right to Associate"
 je_oiko_pb_gbr_labour_laws_reason:0 "reforms · mid\n\nThen Regulatory Bodies: the Trade Unions are growing in the most industrial country on earth.\n\nHow it works: Britain alone starts with Labor Movement and its Trade Unions can start non-marginal. A strong union group opposed to anti-strike laws produces radicals and movements; giving them legal room keeps the workforce loyal.\n\nSources (1.13): game files: common/laws/00_labor_rights.txt, https://vic3.paradoxwikis.com/Great_Britain"
 je_oiko_pb_gbr_brazil_slave_trade:0 "Playbook: Pressure Brazil to drop the slave trade"
 je_oiko_pb_gbr_brazil_slave_trade_reason:0 "prestige · early\n\nIdeally while Brazil is in a civil war.\n\nHow it works: Britain carries −100 prestige and −10% influence until Brazil drops the slave trade; fixing it frees influence for managing the many subjects. The journal fails if Britain itself legalises slavery.\n\nSources (1.13): game files: common/journal_entries/02_brazilian_slavery.txt, https://vic3.paradoxwikis.com/Great_Britain"
 je_oiko_pb_gbr_raj:0 "Playbook: Raise colonial affairs to 5 and proclaim the British Raj"
 je_oiko_pb_gbr_raj_reason:0 "empire · mid\n\nTake 'Proclaim the British Raj' while at peace.\n\nHow it works: The decision ends East India Company rule (21 states) and moves India under the crown. It needs Civilizing Mission, colonial affairs at level 5, peace, and the Company as a non-player subject.\n\nSources (1.13.9): game files: common/decisions/british_raj_decisions.txt"
 je_oiko_pb_gbr_ironclads:0 "Playbook: Build shipyards before researching ironclads"
 je_oiko_pb_gbr_ironclads_reason:0 "military · mid\n\nExpand shipyards and hardwood and steel supply first.\n\nHow it works: Ships of the line and frigates turn obsolete the moment you have Ironclad tech, which weakens the whole 196-ship fleet at once. Replacements are limited by shipyard construction points, so build the capacity first and replace ships gradually.\n\nSources (1.13.9): game files: common/ship_types/00_ship_types.txt, https://vic3.paradoxwikis.com/Patch_1.13"
 je_oiko_pb_gbr_dominions:0 "Playbook: Unite Canada and Australia"
 je_oiko_pb_gbr_dominions_reason:0 "empire · mid\n\nUse the Canada and Australia journal buttons to merge the colonies.\n\nHow it works: Britain starts with 4 Canadian and 4 Australian colonies, each costing influence as a separate subject. Merging them cuts the subject count and the number of independent liberty-desire risks.\n\nSources (1.13): game files: common/journal_entries/00_canada_australia.txt, https://vic3.paradoxwikis.com/Great_Britain"
 je_oiko_pb_usa_construction_sectors:0 "Playbook: Turn the surplus into construction sectors in New York and Pennsylvania"
 je_oiko_pb_usa_construction_sectors_reason:0 "industry · opening\n\nThe USA starts with only 6 construction sector levels for a huge territory: add sectors in NY or PA (iron and coal nearby) until the weekly surplus is close to zero.\n\nHow it works: Every plan is limited by build speed. Construction sectors are paid from the budget through the goods they consume, so a surplus converts directly into build speed; stop when the surplus is gone, not when the queue is empty. The sectors start on Iron Frame, so watch iron and tools prices.\n\nSources (1.13): https://vic3.paradoxwikis.com/Strategy:_America, https://vic3.paradoxwikis.com/United_States, game files: common/history/buildings/05_north_america.txt"
 je_oiko_pb_usa_luxury_taxes:0 "Playbook: Tax luxuries before raising the general tax level"
 je_oiko_pb_usa_luxury_taxes_reason:0 "budget · opening\n\nPut consumption taxes on luxury goods (tobacco, liquor, wine, services, luxury furniture) in the Budget panel.\n\nHow it works: The USA starts at a Low tax level with very wealthy pops, so luxury consumption taxes mostly hit middle and upper strata who can afford them. Per-capita tax hits every pop equally, so raising the general level pushes poor workers into lower standard of living and radicalism. Consumption taxes cost authority, not money.\n\nSources (1.10): https://vic3.paradoxwikis.com/Strategy:_America"
 je_oiko_pb_usa_build_north:0 "Playbook: Build new factories in the North while slavery stands"
 je_oiko_pb_usa_build_north_reason:0 "slavery_debate · early\n\nPut new industry in New York, Pennsylvania, New England, Ohio and the Great Lakes states, not in the slave states.\n\nHow it works: If the Civil War fires, the slave states leave with their buildings and become the war zone, so southern factories turn into enemy assets. Northern industry keeps producing during the war and pays for it. After the Slavery Debate completes, southern investment is safe again.\n\nSources (1.13): https://vic3.paradoxwikis.com/Strategy:_America, game files: common/journal_entries/00_acw_entries.txt (je_acw_countdown)"
 je_oiko_pb_usa_dedicated_police:0 "Playbook: Replace Local Police with Dedicated Police"
 je_oiko_pb_usa_dedicated_police_reason:0 "slavery_debate · early\n\nLocal Police feeds the Southern Planters' political strength.\n\nHow it works: Local Police gives the Southern Planters (ig_landowners) +5% political strength per police institution level, and the USA starts at level 2. Removing it lowers Planter clout before abolition and lowers the radicalisation the slavery change causes.\n\nSources (1.13.9): game files: common/laws/00_policing.txt, https://vic3.paradoxwikis.com/Strategy:_America"
 je_oiko_pb_usa_not_yet_abolition:0 "Playbook: Do not rush abolition yet: time works for you"
 je_oiko_pb_usa_not_yet_abolition_reason:0 "slavery_debate · early\n\nSpend these years on construction and northern industry; enact Slavery Banned later.\n\nHow it works: The Missouri Compromise modifier gives the Planters +25% political strength and big voting power, but it decays over 50 years. Jacksonian Democrat characters back the pro-slavery movement, and changing the slavery law while Jackson lives can push the Yeoman Farmers to the secessionists.\n\nSources (1.13): game files: common/static_modifiers/content_1_modifiers.txt, common/political_movements/00_ideological_movements.txt, https://vic3.paradoxwikis.com/United_States"
 je_oiko_pb_usa_abolition_ready:0 "Playbook: You are ready: enact Slavery Banned"
 je_oiko_pb_usa_abolition_ready_reason:0 "slavery_debate · mid\n\nThe Planters are out of government and weak, and the budget is healthy. Start Slavery Banned and avoid any other war or big law change until the debate ends.\n\nHow it works: The Slavery Debate (je_acw_countdown) completes only after slavery has been banned for 10 years with no civil war. The war starts when the pro-slavery movement revolts, which is easier the stronger the Planters and the more unstable the country. A war fought in debt ends in default quickly, so start from a surplus.\n\nSources (1.13): game files: common/journal_entries/00_acw_entries.txt, https://vic3.paradoxwikis.com/Strategy:_America"
 je_oiko_pb_usa_war_industry:0 "Playbook: Build war industry in the North before abolition"
 je_oiko_pb_usa_war_industry_reason:0 "military · mid\n\nAdd arms industry, munition plants and artillery foundries in northern states.\n\nHow it works: The USA starts with 4 arms, 1 munitions and 1 artillery level. In a civil war mobilised battalions consume far more goods than at peace, so shortages cut combat strength and imports drain the treasury. Owning the factories turns war spending into domestic wages and profit.\n\nSources (1.13): https://vic3.paradoxwikis.com/Strategy:_America, game files: common/history/buildings/05_north_america.txt"
 je_oiko_pb_usa_manifest_destiny:0 "Playbook: Take the Manifest Destiny decision, then let infamy decay"
 je_oiko_pb_usa_manifest_destiny_reason:0 "manifest_destiny · early\n\nTake the decision now; declare on Mexico only after infamy has fallen, with a mobilised conscript army you demobilise right after the war.\n\nHow it works: The decision gives claims on Mexican regions and starts the Mexican Cession and Frontier Wars journals, whose completion adds American homelands. It costs about 24 infamy, so attacking at once invites great-power intervention and a costlier war.\n\nSources (1.13): game files: common/decisions/manifest_destiny.txt, https://vic3.paradoxwikis.com/United_States"
 je_oiko_pb_usa_texas:0 "Playbook: Annex Texas peacefully"
 je_oiko_pb_usa_texas_reason:0 "manifest_destiny · opening\n\nRaise relations with Texas to cordial and keep it out of other subject deals.\n\nHow it works: Texan Statehood (je_texas_usa) completes when Texas is independent, not at war and at least cordial with the USA, which leads to peaceful annexation. If Mexico crushes Texas first, Texas becomes a war goal instead.\n\nSources (1.13): game files: common/journal_entries/00_texas.txt, https://vic3.paradoxwikis.com/Strategy:_America"
 je_oiko_pb_usa_quinine:0 "Playbook: Research pharmaceuticals, then quinine"
 je_oiko_pb_usa_quinine_reason:0 "manifest_destiny · early\n\nThey speed up frontier colonisation and unlock the western mapping expeditions needed for Oregon.\n\nHow it works: Colonies are land without people; finishing them sooner gives room for farms and migrants, and the expeditions are a prerequisite for the Oregon journal.\n\nSources (1.10): https://vic3.paradoxwikis.com/Strategy:_America"
 je_oiko_pb_usa_commercialized_agriculture:0 "Playbook: Enact Commercialized Agriculture now that slavery is gone"
 je_oiko_pb_usa_commercialized_agriculture_reason:0 "industry · mid\n\nHomesteading reserves 35% of arable land for subsistence farming.\n\nHow it works: That reserve caps the farms and plantations you can build. Commercialized Agriculture frees the land and pushes peasants into wage work. Before abolition the Planters and Yeoman Farmers block it; after, it also weakens the Planters further.\n\nSources (1.13.9): game files: common/laws/00_land_reform.txt, https://vic3.paradoxwikis.com/Strategy:_America"
 je_oiko_pb_usa_multicultural:0 "Playbook: Enact Multiculturalism to draw migrants"
 je_oiko_pb_usa_multicultural_reason:0 "reforms · mid\n\nThe USA is short of people, not land; a Humanitarian interest-group leader makes the law easier.\n\nHow it works: Migrants prefer countries that accept their culture, and Multiculturalism accepts all. It is also the main step of the Reconstruction journal (je_acw_equality) if the Civil War happened.\n\nSources (1.10): https://vic3.paradoxwikis.com/Strategy:_America, game files: law_multicultural (unlocked by human_rights)"
 je_oiko_pb_usa_debt_during_debate:0 "Playbook: Get debt down while the slavery clock runs"
 je_oiko_pb_usa_debt_during_debate_reason:0 "slavery_debate · mid\n\nSlavery is banned and debt is over half the credit limit: cut construction and military spending until it falls.\n\nHow it works: In the 10 years after abolition the pro-slavery revolt can still fire. High debt means a civil war would push you into default fast, and a stable surplus keeps standard of living up, which lowers radicalism in the southern states.\n\nSources (1.13): https://vic3.paradoxwikis.com/Strategy:_America"
 je_oiko_pb_usa_planters_out:0 "Playbook: Remove the Southern Planters from government"
 je_oiko_pb_usa_planters_out_reason:0 "slavery_debate · mid\n\nThey are in government while slavery is banned.\n\nHow it works: An interest group in government that hates a current law loses approval and radicalises its supporters. Planters in government after abolition is a direct path to the pro-slavery revolution that fails the Slavery Debate.\n\nSources (1.13.9): game files: common/journal_entries/00_acw_entries.txt"
 je_oiko_pb_sar_construction:0 "Playbook: Queue two more construction sector levels in Piedmont first"
 je_oiko_pb_sar_construction_reason:0 "industry · opening\n\nSardinia-Piedmont starts with a single construction sector, so every other project waits in line. Use Iron Frame Buildings: iron is cheap at the start.\n\nHow it works: A construction sector is a state building: its wages and its iron, tools and wood show up as government spending. Add levels only while the weekly balance stays positive, or a bigger queue just drains the treasury faster.\n\nSources (1.12): https://vic3.paradoxwikis.com/Sardinia-Piedmont, game files: common/history/buildings/01_south_europe.txt"
 je_oiko_pb_sar_coal:0 "Playbook: Open coal mines in Piedmont"
 je_oiko_pb_sar_coal_reason:0 "industry · opening\n\nYou start with no coal mines; Piedmont can hold 28 levels.\n\nHow it works: Atmospheric Engine is already researched: its steam production methods burn coal, and so do railways. Importing all of it keeps the price high and pushes up input costs across the economy.\n\nSources (1.12): https://vic3.paradoxwikis.com/Sardinia-Piedmont, game files: map_data/state_regions/01_south_europe.txt"
 je_oiko_pb_sar_railways_research:0 "Playbook: Research railways now"
 je_oiko_pb_sar_railways_research_reason:0 "industry · opening\n\nBoth prerequisites are owned at the start, so railways is one step away.\n\nHow it works: Railways raise infrastructure and market access; without them Piedmont's goods cannot reach the rest of your market and new buildings run below capacity. The wiki calls early railways a priority for Sardinia-Piedmont.\n\nSources (1.12): game files: common/technology/technologies/10_production.txt, https://vic3.paradoxwikis.com/Sardinia-Piedmont"
 je_oiko_pb_sar_sulfur:0 "Playbook: Open a sulfur mine in Sardinia"
 je_oiko_pb_sar_sulfur_reason:0 "industry · early\n\nSulfur is over 10% above base price; Sardinia can hold 20 sulfur mine levels.\n\nHow it works: Sardinian sulfur is the main reason to invest outside Piedmont. Sulfur later feeds explosives and fertilizer, and keeping it cheap stops Two Sicilies' sulfur companies from gaining the prestige good.\n\nSources (1.12): https://vic3.paradoxwikis.com/Sardinia-Piedmont, https://steamcommunity.com/app/529340/discussions/0/604168947372498524/"
 je_oiko_pb_sar_subventions:0 "Playbook: Drop the import subventions on small arms and artillery"
 je_oiko_pb_sar_subventions_reason:0 "budget · opening\n\nIn the trade panel, remove the high import subventions on small arms and artillery unless you are at war.\n\nHow it works: The 1836 setup subsidises imported small arms and artillery: the state pays part of the import price, so every musket the army buys costs the treasury twice. In peacetime that is money spent for nothing.\n\nSources (1.13.9): game files: common/history/countries/sar - sardinia.txt"
 je_oiko_pb_sar_no_early_wars:0 "Playbook: No wars under the Austrian umbrella before 1850: stop growing the army"
 je_oiko_pb_sar_no_early_wars_reason:0 "military · early\n\nPut the money into construction instead.\n\nHow it works: Austria guarantees Two Sicilies and Tuscany by treaty until about 1850, and Modena, Tuscany, Parma and Two Sicilies sit in its power bloc. An early war against a neighbour means war with Austria, while soldiers' wages and goods are a fixed weekly cost that earns nothing.\n\nSources (1.13.9): game files: common/history/treaties, common/history/power_blocs, https://vic3.paradoxwikis.com/Sardinia-Piedmont"
 je_oiko_pb_sar_nationalism:0 "Playbook: Research nationalism after railways"
 je_oiko_pb_sar_nationalism_reason:0 "unification · early\n\nNationalism gates the Risorgimento journal, Italian candidacy, both unification plays and the Treaty of Turin.\n\nHow it works: Candidacy also requires every Italian country to know nationalism; researching it early lets tech spread carry it to the minors sooner.\n\nSources (1.13): game files: common/journal_entries/00_italian_unification.txt, common/country_formation/00_major_formables.txt, https://vic3.paradoxwikis.com/Formable_nations"
 je_oiko_pb_sar_risorgimento:0 "Playbook: Back the Risorgimento and bring a liberal or patriotic group into government"
 je_oiko_pb_sar_risorgimento_reason:0 "unification · early\n\nChoose 'Italy must be restored' in Whispers of Risorgimento; only conservative groups govern now.\n\nHow it works: The pro option sets the stance that peaceful absorption of the minors requires and gives liberal and patriotic groups +25% political strength. With only conservatives ruling, the Italian national movement turns radical, and while the journal is active a revolution can hand your country to a higher-ranked Italian state.\n\nSources (1.13.9): game files: events/italian_unification.txt"
 je_oiko_pb_sar_two_sicilies:0 "Playbook: Two Sicilies, not Austria, decides a peaceful Italy"
 je_oiko_pb_sar_two_sicilies_reason:0 "unification · mid\n\nKeep relations with every Italian minor at Friendly (treaties help) and stay the highest-ranked Italian state.\n\nHow it works: Italy needs 12 of the 17 Italian states, and the independent Italian states own exactly 12, so a war-free Italy needs every minor including Two Sicilies (5 states). Peaceful absorption fires about 10% a month when you are the sole candidate and a Friendly neighbouring minor also backs unification.\n\nSources (1.13.9): game files: common/country_formation/00_major_formables.txt, events/italian_unification.txt, https://steamcommunity.com/app/529340/discussions/0/604168947372498524/"
 je_oiko_pb_sar_war_chest:0 "Playbook: Build a reserve before any war with Austria"
 je_oiko_pb_sar_war_chest_reason:0 "unification · mid\n\nDebt is over 30% of the credit limit: do not start the unification play or a war with Austria yet.\n\nHow it works: Mobilisation raises military wages and goods sharply while war exhaustion and blockades cut income. A debt-funded war against Austria is the fastest route to bankruptcy.\n\nSources (1.13): https://vic3.paradoxwikis.com/Budget"
 je_oiko_pb_sar_turin:0 "Playbook: Consider the Treaty of Turin before attacking Austria"
 je_oiko_pb_sar_turin_reason:0 "unification · mid\n\nCeding Savoy and Nice to France buys a French obligation.\n\nHow it works: Savoy is not one of the 17 Italian formation states, so ceding it costs no progress, and France owing you makes French support against Austria likelier. The decision needs peace, cordial relations with France and France owning all of Rhône.\n\nSources (1.12): game files: common/decisions/france_savoy.txt, https://vic3.paradoxwikis.com/Sardinia-Piedmont"
 je_oiko_pb_ita_integrate:0 "Playbook: Absorb Italy before expanding further"
 je_oiko_pb_ita_integrate_reason:0 "reforms · late\n\nPause new expansion and fix shortages, production methods, infrastructure and bureaucracy in the new states, Emilia first.\n\nHow it works: Formation multiplies your size 4–6 times overnight. The new states bring unemployed pops, missing bureaucracy and old production methods, so the administrative and wage bill jumps before their taxes arrive.\n\nSources (1.12): https://vic3.paradoxwikis.com/Sardinia-Piedmont, https://vic3.paradoxwikis.com/Two_Sicilies"
 je_oiko_pb_fra_iron:0 "Playbook: Dig iron in Alsace-Lorraine, Lorraine and Burgundy"
 je_oiko_pb_fra_iron_reason:0 "industry · opening\n\nFrance has only 6 iron mine levels but tooling, steel and construction all use iron: build mines until iron is back at base price.\n\nHow it works: When an input is short, every building that uses it pays more, so construction and factories both get dearer. Domestic mines turn that import bill into wages you can tax. Found Mines d'Anzin at once: the coal is already there.\n\nSources (1.13.9): game files: common/history/buildings/00_west_europe.txt, https://vic3.paradoxwikis.com/France"
 je_oiko_pb_fra_engines:0 "Playbook: Make your own engines, then drop the engine import subsidy"
 je_oiko_pb_fra_engines_reason:0 "industry · opening\n\nBuild a motor industry; the state pays part of the price of every imported engine.\n\nHow it works: France starts with import subventions on engines. Railways and mechanised production need engines, Britain supplies almost all of them and can rival or embargo you. A home motor industry ends both the subsidy and the dependence.\n\nSources (1.13.9): game files: common/history/countries/fra - france.txt, https://vic3.paradoxwikis.com/France"
 je_oiko_pb_fra_haiti_margin:0 "Playbook: Your surplus is smaller than it looks"
 je_oiko_pb_fra_haiti_margin_reason:0 "budget · opening\n\nKeep a margin before adding permanent costs: part of your tax income is the Haitian indemnity.\n\nHow it works: The Haitian independence payments modifier adds tax income that shrinks in steps as Haiti pays and vanishes if Haiti cancels the debt. A barely positive budget can flip negative overnight while army wages and construction costs stay where they are.\n\nSources (1.13.9): game files: common/static_modifiers/agitators_2_modifiers.txt, common/scripted_buttons/00_hispaniola_buttons.txt"
 je_oiko_pb_fra_census_before_1848:0 "Playbook: Pass Census Voting before 1848"
 je_oiko_pb_fra_census_before_1848_reason:0 "reforms · early\n\nEnact Census Voting while the Intelligentsia are in government; the 200-franc amendment survives it.\n\nHow it works: Owning Egalitarianism draws France into the Springtime of the Peoples, which adds 25–35% to radicalism and to liberal and radical movement support. You get through it without a revolution if a liberal group governs and Census Voting or Universal Suffrage is in force.\n\nSources (1.13.9): game files: common/journal_entries/00_peoples_springtime_je.txt, common/amendments/00_amendments_historical_04.txt"
 je_oiko_pb_fra_orleanists:0 "Playbook: Keep the Orléanists in front: bring the Industrialists back into government"
 je_oiko_pb_fra_orleanists_reason:0 "divided_monarchists · early\n\nAnd keep factories profitable.\n\nHow it works: The Orléanist bar grows with profitable manufacturing levels, Orléanist characters' popularity and the clout of Orléanist-led groups (doubled in government), plus legitimacy because Louis-Philippe is Orléanist. Reaching 480 first lets you cement the dynasty, which removes the Legacy of the French Revolution malus (revolution clock +12.5%, radicals from low legitimacy ×2).\n\nSources (1.13.9): game files: common/scripted_effects/00_victoria_scripted_effects.txt, common/journal_entries/01_french_monarchism.txt"
 je_oiko_pb_fra_algeria:0 "Playbook: Conquer Algeria one principality at a time"
 je_oiko_pb_fra_algeria_reason:0 "algeria · early\n\nTake Mascara, Constantine and Ait Abbas, then Touggourt, with single-target plays, mobilising only the formations you need.\n\nHow it works: The Conquest of Algeria has no deadline and fails only if you lose all three footholds. Completing it gives Saharan and Tunisian claims, double incorporation speed and follow-up journals. Mobilising the whole army against small unrecognised principalities raises military spending for weeks for nothing.\n\nSources (1.13.9): game files: common/journal_entries/01_algeria.txt, https://vic3.paradoxwikis.com/France"
 je_oiko_pb_fra_schneider:0 "Playbook: Build steel in Burgundy and found Schneider-Creusot"
 je_oiko_pb_fra_schneider_reason:0 "industry · early\n\nFive steel mill levels in Burgundy unlock the company, once iron and coal are not short.\n\nHow it works: In 1.13.9 Schneider-Creusot needs 5 steel mill levels in Burgundy. Its buildings are steel, artillery and motor industry, exactly the chain France lacks, and companies add productivity to their buildings. Build the mills only when iron and coal are cheap, or they run at a loss.\n\nSources (1.13.9): game files: common/company_types/00_companies_france.txt"
 je_oiko_pb_fra_vineyards:0 "Playbook: Stop expanding vineyards"
 je_oiko_pb_fra_vineyards_reason:0 "industry · early\n\nWine sells below 85% of base: put construction into industry or food processing instead.\n\nHow it works: France starts with 78 vineyard levels and taxes wine consumption. Extra supply pushes the price down, which cuts the profits and wages of every vineyard.\n\nSources (1.13.9): game files: common/history/buildings/00_west_europe.txt"
 je_oiko_pb_fra_egypt_treaty:0 "Playbook: Drop the Egypt treaty's arms shipments"
 je_oiko_pb_fra_egypt_treaty_reason:0 "military · early\n\nIts 20-year binding period has ended: renegotiate or let lapse the free arms shipments and the military assistance.\n\nHow it works: The treaty ships 10 small arms and 5 artillery to Egypt on top of your own army's needs and obliges France to fight in Egypt's wars. After about November 1844 both are optional costs.\n\nSources (1.13.9): game files: common/history/treaties/00_historical_treaties.txt, https://vic3.paradoxwikis.com/France"
 je_oiko_pb_fra_natural_borders:0 "Playbook: Not now: Natural Borders needs a sound budget"
 je_oiko_pb_fra_natural_borders_reason:0 "natural_borders · mid\n\nDo not start the push for the Rhine and Belgium while losing money or carrying heavy debt.\n\nHow it works: Natural Borders targets Belgium and Prussia's Rhineland: major wars and heavy infamy. Mobilisation multiplies military spending, so starting it in deficit is a fast way to default.\n\nSources (1.13.9): game files: common/journal_entries/01_natural_borders_of_france.txt, https://vic3.paradoxwikis.com/France"
 je_oiko_pb_fra_abolition:0 "Playbook: Abolish colonial slavery while the liberals govern"
 je_oiko_pb_fra_abolition_reason:0 "reforms · early\n\nEnact Slavery Banned after taxation and census voting.\n\nHow it works: France abolished colonial slavery in 1848. Liberal groups favour it, and enslaved pops earn no wages and buy little, so they add little to the market. It is far easier to pass during a liberal government.\n\nSources (1.13.9): game files: common/laws"
 je_oiko_pb_aus_per_capita:0 "Playbook: First law: switch to Per-Capita Taxation"
 je_oiko_pb_aus_per_capita_reason:0 "budget · opening\n\nLand-based taxation leaves 20 million pops paying almost no direct tax.\n\nHow it works: Land-based taxation only taxes land rents and consumption: no poll tax and no income tax. Per-capita taxation adds a poll tax on every pop plus a small income tax, Austria's single biggest revenue lever, and it is unlocked from day one. The Geheime Staatskonferenz slows every enactment by 20%, so pass laws one at a time and start with this one.\n\nSources (1.13.9): game files: common/laws/00_taxation.txt, common/amendments/00_amendments_historical_04.txt"
 je_oiko_pb_aus_tax_capacity:0 "Playbook: Build government administrations in Bohemia, Moravia, the Galicias and Lombardy"
 je_oiko_pb_aus_tax_capacity_reason:0 "budget · opening\n\nBefore new factories there: these states are far over their tax capacity.\n\nHow it works: A state taxes only 10,000 pops per point of tax capacity: 100 base points plus about 10 per administration level. Bohemia (4.15M pops), Moravia (2.1M with 1 level), both Galicias and Lombardy are well over that, so every tax there is cut proportionally. Administrations cost wages and paper but raise the yield of taxes you already levy.\n\nSources (1.13): game files: common/defines/00_defines.txt, common/production_methods/07_government.txt, https://vic3.paradoxwikis.com/Strategy:_Austria"
 je_oiko_pb_aus_construction:0 "Playbook: Add construction sectors in Austria and Bohemia, one at a time"
 je_oiko_pb_aus_construction_reason:0 "industry · opening\n\nSeven levels are slow for an empire of 20 million; grow only while the balance stays positive.\n\nHow it works: Construction sectors are state buildings: their wages and their wood, iron and tools are government expenses, so grow them only as far as current income covers. Bohemia combines iron 45, coal 48 and the largest workforce for the inputs.\n\nSources (1.13): https://vic3.paradoxwikis.com/Strategy:_Austria"
 je_oiko_pb_aus_engines_first:0 "Playbook: Steel and engines before railways"
 je_oiko_pb_aus_engines_first_reason:0 "industry · early\n\nBuild steel mills and a motor industry in Bohemia before laying more railways.\n\nHow it works: Austria starts with the railways tech but no steel or engine production. Early trains consume engines and coal, and railways running on imported, overpriced engines lose money, a loss their owners or the state carry.\n\nSources (1.13.9): game files: common/production_methods/11_private_infrastructure.txt, common/history/countries/aus - austria.txt"
 je_oiko_pb_aus_coal:0 "Playbook: Open coal mines in West Galicia and Moravia"
 je_oiko_pb_aus_coal_reason:0 "industry · early\n\nCoal is over 15% above base and you have only 4 coal mines.\n\nHow it works: Steel, engines, railways and steam methods all eat coal. West Galicia (cap 140) and Moravia (56) are the deep deposits, and Galicia's spare peasant labour turns into taxable wages.\n\nSources (1.13.9): game files: map_data/state_regions"
 je_oiko_pb_aus_arms_out_of_lombardy:0 "Playbook: Build new arms capacity in Bohemia or Austria, not Lombardy"
 je_oiko_pb_aus_arms_out_of_lombardy_reason:0 "military · early\n\nSmall arms or artillery are over 15% above base price.\n\nHow it works: Five of 7 arms levels and both artillery foundries sit in Lombardy, an Italian homeland the Risorgimento targets first. If you lose it, army supply suddenly becomes imports bought at market price by the logistics centers.\n\nSources (1.13.9): game files: common/history/buildings, common/journal_entries/00_italian_unification.txt"
 je_oiko_pb_aus_no_army_growth:0 "Playbook: Don't grow the army before 1850"
 je_oiko_pb_aus_no_army_growth_reason:0 "military · early\n\nPut the money into construction instead.\n\nHow it works: Austria's 129 battalions already match Prussia's, and the Holy Alliance pacts with Russia and Prussia plus your Italian guarantees run until about 1850. A standing army is paid every week whether or not there is a war, and does not compound the way industry does.\n\nSources (1.13.9): game files: common/history/military_formations, common/history/treaties/00_historical_treaties.txt"
 je_oiko_pb_aus_metternich:0 "Playbook: Bring the Landowners back into government within six months"
 je_oiko_pb_aus_metternich_reason:0 "metternich · early\n\nThe Age of Metternich fails after 6 months without them.\n\nHow it works: je_metternich fails once the Landowners have been out of government for more than 6 consecutive months, and Metternich resigns and flees. Keep them in until Franz Joseph takes the throne for the orderly retirement instead.\n\nSources (1.13.9): game files: common/journal_entries/05_metternich.txt"
 je_oiko_pb_aus_before_1848:0 "Playbook: Get solvent before the 1848 wave"
 je_oiko_pb_aus_before_1848_reason:0 "stability · early\n\nPay down debt and get the weekly balance positive.\n\nHow it works: The Springtime of the Peoples starts as soon as any European great power has a 25% revolution, and Austria's Egalitarianism pulls it in. A revolution takes states and their taxes away and forces mobilisation, so income falls as costs rise; entering it in deficit means bankruptcy. A 25% revolution also fails the Metternich journal.\n\nSources (1.13.9): game files: common/on_actions/00_code_on_actions.txt, common/journal_entries/00_peoples_springtime_je.txt"
 je_oiko_pb_aus_appointed_bureaucrats:0 "Playbook: Replace Crownland Diets with Appointed Bureaucrats"
 je_oiko_pb_aus_appointed_bureaucrats_reason:0 "budget · early\n\nHave the new administrations in place first: bureaucracy use will rise.\n\nHow it works: Crownland Diets make bureaucracy 25% cheaper and strengthen aristocrats but add no tax capacity. Appointed Bureaucrats add +25% tax capacity in every state and are required to abolish crown-land autonomy later.\n\nSources (1.13.9): game files: common/laws/00_bureaucracy.txt, common/scripted_buttons/05_austria_buttons.txt"
 je_oiko_pb_aus_hungary_later:0 "Playbook: Leave Hungary, Transylvania and Croatia as crown lands until after 1848"
 je_oiko_pb_aus_hungary_later_reason:0 "hungary · early\n\nIntegrate them after the Springtime, once every crown land is at liberty desire 25 or below.\n\nHow it works: Integration adds Hungarian, Polish and Croat radicals and −10% authority just when the Springtime is most likely. As crown lands they already fight your wars without needing your tax capacity.\n\nSources (1.13): game files: common/decisions/austria_decisions.txt, https://vic3.paradoxwikis.com/Strategy:_Austria"
 je_oiko_pb_aus_dual_monarchy_blocks_germany:0 "Playbook: Do not establish the Dual Monarchy if you want Germany"
 je_oiko_pb_aus_dual_monarchy_blocks_germany_reason:0 "unification · mid\n\nThe button is now available; choose your track: Greater Germany or a Habsburg empire.\n\nHow it works: Germany cannot be formed by a dual or triple monarchy, and the button's own tooltip says so. Clicking it rules out Greater Germany for good; choose it only for the Habsburg track (Dual Monarchy, then the Federal Solution).\n\nSources (1.13.9): game files: common/scripted_buttons/05_austria_buttons.txt, common/country_formation/00_major_formables.txt"
 je_oiko_pb_aus_pan_nationalism:0 "Playbook: Research pan-nationalism to contest the German leadership"
 je_oiko_pb_aus_pan_nationalism_reason:0 "unification · mid\n\nThen court Bavaria and Saxony, keep Britain and Russia neutral, and raise relations with Prussia.\n\nHow it works: Germany can only be formed with pan-nationalism by a major power, and je_german_unification needs it too. Until then you cannot contest Prussia's leadership play. Release or puppet non-German lands before forming to avoid 70–84 infamy.\n\nSources (1.13): game files: common/country_formation/00_major_formables.txt, https://vic3.paradoxwikis.com/Strategy:_Austria"
 je_oiko_pb_aus_no_war_on_credit:0 "Playbook: No leadership war against Prussia on credit"
 je_oiko_pb_aus_no_war_on_credit_reason:0 "unification · mid\n\nClear debt before you start or accept the German leadership play.\n\nHow it works: Mobilising pulls workers out of factories, cutting taxes, while military goods spending jumps and interest compounds. Prussia's army is about the size of yours and Austria's infantry-heavy army does better defending, so expect a long war a deficit cannot carry.\n\nSources (1.13): https://vic3.paradoxwikis.com/Strategy:_Austria"
 je_oiko_pb_aus_venetia_sulfur:0 "Playbook: Build sulfur mines in Venetia and hold it"
 je_oiko_pb_aus_venetia_sulfur_reason:0 "industry · early\n\nSulfur is over 15% above base; Venetia is your only deposit.\n\nHow it works: Venetia (cap 36) is Austria's only sulfur. Sulfur feeds explosives and later fertiliser, so losing Venetia to Italian unification makes those industries import-dependent; concede Lombardy before Venetia.\n\nSources (1.13): game files: map_data/state_regions, https://vic3.paradoxwikis.com/Strategy:_Austria"
 je_oiko_pb_aus_citizenship:0 "Playbook: Drop National Supremacy: return to Subjecthood or go Multicultural"
 je_oiko_pb_aus_citizenship_reason:0 "reforms · any\n\nAbout three quarters of your pops are not south German.\n\nHow it works: Discriminated pops earn less, radicalise faster and feed secession movements. The Federal Solution rejects National Supremacy and Ethnostate, and Austria-Hungary needs Subjecthood or Multiculturalism.\n\nSources (1.13.9): game files: common/journal_entries/05_danubian_federation.txt, common/country_formation/00_formable_countries.txt"
