l_english:
 oiko_numbers:0 "Weekly balance: #bold [GetPlayer.MakeScope.ScriptValue('oiko_balance')|D]#! @money!\nTreasury: #bold [GetPlayer.MakeScope.ScriptValue('oiko_treasury')|D]#! @money! (lasts about #bold [GetPlayer.MakeScope.ScriptValue('oiko_weeks_to_debt')|0]#! weeks)\nDebt / credit limit: #bold [GetPlayer.MakeScope.ScriptValue('oiko_debt_share')|0%]#!\nMilitary share of spending: #bold [GetPlayer.MakeScope.ScriptValue('oiko_military_share')|0%]#!"

 je_oiko_budget_guard:0 "Budget Guard"
 je_oiko_budget_guard_reason:0 "The state spends more than it earns.\n\n#bold How it works:#! a deficit is not a problem by itself. Once the treasury is empty the state borrows, and borrowing to build pays back through the taxes and dividends of the new buildings. It becomes one when it pays for upkeep (army, administration) instead of growth: debt only grows, interest is added, and when debt passes the credit limit the country defaults (construction stops, production, offense and defense penalties up to -50%).\n\n#bold Levers:#! tax level and wages (military, government) in the Budget panel, a smaller or cheaper peacetime army, cheaper goods the state buys (paper, arms), and new buildings that pay taxes."

 oiko_box_military:0 "[SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(GetPlayer.MakeScope.ScriptValue('oiko_military_target'), GetPlayer.MakeScope.ScriptValue('oiko_military_share')),'@green_checkmark_box!','@simple_box!')] Military under 40% of spending (now [GetPlayer.MakeScope.ScriptValue('oiko_military_share')|0%])"
 oiko_box_balance:0 "[SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(GetPlayer.MakeScope.ScriptValue('oiko_balance'), GetPlayer.MakeScope.ScriptValue('oiko_zero')),'@green_checkmark_box!','@simple_box!')] Weekly balance not negative (now [GetPlayer.MakeScope.ScriptValue('oiko_balance')|D] @money!)"
 oiko_box_paper:0 "[SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(GetPlayer.MakeScope.ScriptValue('oiko_paper_ok'), GetPlayer.MakeScope.ScriptValue('oiko_one')),'@green_checkmark_box!','@simple_box!')] Paper at most 10% above base price (paper mills)"
 oiko_box_small_arms:0 "[SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(GetPlayer.MakeScope.ScriptValue('oiko_small_arms_ok'), GetPlayer.MakeScope.ScriptValue('oiko_one')),'@green_checkmark_box!','@simple_box!')] Small arms at most 10% above base price (arms industry)"
 oiko_box_construction:0 "[SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(GetPlayer.MakeScope.ScriptValue('oiko_construction_levels'), GetPlayer.MakeScope.ScriptValue('oiko_construction_target')),'@green_checkmark_box!','@simple_box!')] At least 10 construction sector levels (now [GetPlayer.MakeScope.ScriptValue('oiko_construction_levels')|0])"

 je_oiko_pru_opening:0 "Playbook: Prussia's Opening"
 je_oiko_pru_opening_reason:0 "In 1836 the army is Prussia's whole deficit: about 70% of income goes to its wages and supplies.\n\n#bold How it works:#! since 1.13 every battalion pays wages through its barracks and buys arms, ammunition and grain on the market through the Army Logistics Center, even in peace. 81 skirmish infantry battalions (2 small arms + 1 ammunition a week each) cost about 13.8K; as line infantry they would cost about 4.9K, roughly the whole deficit. Conscription centers cost almost nothing until raised.\n\n#bold Order:#! 1) disband or convert lancers, cuirassiers and dragoons, then part of the rear skirmish infantry; 2) paper mills (paper is most of the 16K administration bill); 3) arms industry in Brandenburg and logging camps for wood; 4) construction sectors one at a time, paid from the treasury, not debt. Rebuild the army on cheap domestic arms before the leadership war with Austria (1850s–60s)."
 je_oiko_pru_opening_status:0 "$oiko_box_military$\n$oiko_box_balance$\n$oiko_box_paper$\n$oiko_box_small_arms$\n$oiko_box_construction$"

 je_oiko_pru_germany:0 "Playbook: Road to Germany"
 je_oiko_pru_germany_reason:0 "#bold How it works:#! unification starts from cultural fervor (north German 40, south German 30), which grows with public schools, literacy and nationalism techs. The North German Federation forms once Schleswig-Holstein is solved, you have nationalism and you are the sole candidate (usually by beating Austria in the leadership play); every north German state in your Zollverein or backing your candidacy is then annexed. Finally you need #bold pan-nationalism#!, Major Power rank and 73% of the states of greater Germany.\n\nA war in deficit is the classic road to bankruptcy: mobilisation multiplies arms and ammunition upkeep by 1.5 and adds grain."
 je_oiko_pru_germany_status:0 "[SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(GetPlayer.MakeScope.ScriptValue('oiko_has_public_schools'), GetPlayer.MakeScope.ScriptValue('oiko_one')),'@green_checkmark_box!','@simple_box!')] Public schools (cultural fervor)\n[SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(GetPlayer.MakeScope.ScriptValue('oiko_has_nationalism'), GetPlayer.MakeScope.ScriptValue('oiko_one')),'@green_checkmark_box!','@simple_box!')] Nationalism researched\n[SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(GetPlayer.MakeScope.ScriptValue('oiko_schleswig_solved'), GetPlayer.MakeScope.ScriptValue('oiko_one')),'@green_checkmark_box!','@simple_box!')] Schleswig-Holstein question solved\n[SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(GetPlayer.MakeScope.ScriptValue('oiko_war_chest_ok'), GetPlayer.MakeScope.ScriptValue('oiko_one')),'@green_checkmark_box!','@simple_box!')] Debt under 30% of the credit limit (ready for war)\n[SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(GetPlayer.MakeScope.ScriptValue('oiko_is_ngf'), GetPlayer.MakeScope.ScriptValue('oiko_one')),'@green_checkmark_box!','@simple_box!')] North German Federation formed\n[SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(GetPlayer.MakeScope.ScriptValue('oiko_has_pan_nationalism'), GetPlayer.MakeScope.ScriptValue('oiko_one')),'@green_checkmark_box!','@simple_box!')] Pan-nationalism researched"

 oiko.1.t:0 "The Treasury on the Brink"
 oiko.1.d:0 "The state borrows to pay its running costs and debt is approaching the credit limit.\n\n$oiko_numbers$\n\n#bold Do it now:#! raise taxes one level, lower military and government wages one level, pause the most expensive construction and start no war. Details and levers: the #bold Budget Guard#! journal entry."
 oiko.1.f:0 "Past the credit limit comes default: construction stops, and penalties to production, offense and defense grow every week up to -50%."
 oiko.1.a:0 "I'll fix the budget"

 je_oiko_dashboard:0 "Oikonomia: Budget Dashboard"
 je_oiko_dashboard_reason:0 "Live budget numbers. Every week this entry also writes them to the game log, where the Oikonomia Analyzer (overlay and Muse) reads them live, without waiting for an autosave."
 je_oiko_dashboard_status:0 "$oiko_numbers$\n\n[GetPlayer.GetCustom('oiko_budget_verdict')]"
 je_oiko_budget_guard_status:0 "$oiko_numbers$\n\n[GetPlayer.GetCustom('oiko_budget_verdict')]"

 je_group_oikonomia:0 "Oikonomia Advisor"
 oiko_debt_progress_bar:0 "Debt / credit limit"
 oiko_debt_progress_bar_desc:0 "How close the debt is to the credit limit; at 100% the country defaults. Borrowing to build is fine up to about half the limit; past it, stop the debt growing."

 oiko_verdict_critical:0 "#bold Default is close!#! This week: military and government wages down one level, taxes up one level, pause the most expensive construction, start no war."
 oiko_verdict_danger:0 "#bold Debt is past half the credit limit.#! Stop it growing: military and government wages down first, then taxes up one level. No new wars or costly laws."
 oiko_verdict_hoarding:0 "#bold Surplus and a full treasury.#! Money in the treasury earns nothing: queue more construction."
 oiko_verdict_surplus:0 "#bold Surplus.#! Keep every construction sector busy: the surplus is what pays for growth."
 oiko_verdict_military:0 "#bold Deficit, and the army takes [GetPlayer.MakeScope.ScriptValue('oiko_military_share')|0%] of spending.#! This deficit pays upkeep, not growth: in peacetime use cheaper production methods or fewer battalions before raising taxes."
 oiko_verdict_deficit:0 "#bold Deficit, debt well below the credit limit.#! Fine while the money pays for construction (Budget panel: construction is the biggest expense), so keep building. If it pays wages and upkeep instead, cut those first."

 rule_oiko_help_level:0 "Oikonomia: advisor help"
 setting_oiko_help_budget:0 "Budget only"
 setting_oiko_help_budget_desc:0 "Only the budget guard, dashboard, alerts and warnings. No playbook tips, no chapters."
 setting_oiko_help_standard:0 "Standard"
 setting_oiko_help_standard_desc:0 "Budget help plus at most three playbook tips at once (urgent ones always) and the chapter checklists."
 setting_oiko_help_all:0 "Everything"
 setting_oiko_help_all_desc:0 "Every playbook tip that applies, with no limit."
 rule_oiko_warnings:0 "Oikonomia: warning popups"
 setting_oiko_warnings_on:0 "On"
 setting_oiko_warnings_on_desc:0 "A popup when you start a diplomatic play or a law with a weak budget, and one after a default."
 setting_oiko_warnings_off:0 "Off"
 setting_oiko_warnings_off_desc:0 "No popups; the journal and alerts still warn."

 oiko_pb_skip_button:0 "Skip this tip"
 oiko_pb_skip_button_desc:0 "Removes this playbook tip for the rest of the campaign and frees its place for the next one."

 oiko.2.t:0 "A Diplomatic Play on a Weak Budget"
 oiko.2.d:0 "A diplomatic play has started while the budget is already losing money or carrying debt.\n\n$oiko_numbers$\n\n#bold Before it turns into war:#! mobilisation multiplies the army's ammunition and arms costs and adds grain, so the deficit grows sharply the day you mobilise. Back down or settle early unless the treasury can carry months of war; mobilise as late as possible and only the formations you need."
 oiko.2.f:0 "Most bankruptcies of first campaigns start with a war entered in deficit."
 oiko.2.a:0 "Understood"

 oiko.3.t:0 "A New Law on Borrowed Money"
 oiko.3.d:0 "You started enacting a law while the debt is high.\n\n$oiko_numbers$\n\n#bold Check the cost:#! schools, health, police and welfare laws add permanent institution or payment costs to the budget. Laws that cost nothing (taxation, trade, voting) are safe; for the others, see the law's budget effect before it passes, and stop it if the deficit would grow."
 oiko.3.f:0 "A law is paid every week for the rest of the game, not once."
 oiko.3.a:0 "I'll check the cost"

 oiko.4.t:0 "The State Has Defaulted"
 oiko.4.d:0 "Debt passed the credit limit: construction stops and production, offense and defense penalties grow every week.\n\n#bold The way back:#! raise taxes as high as the interest groups tolerate, lower military and government wages, demobilise and leave any war, and pause the most expensive construction until the debt is back under the limit. Every week in default costs more than the cuts."
 oiko.4.f:0 "Default ends as soon as the debt is back under the credit limit."
 oiko.4.a:0 "Back to the budget"

 je_oiko_construction_idle:0 "Construction Is Running Dry"
 je_oiko_construction_idle_reason:0 "The state's construction queue has less than two weeks of work left. You pay for every construction sector whether it builds or not, so an empty queue is money spent on nothing.\n\n#bold Do:#! queue buildings now. The Oikonomia Analyzer ranks expansions by how fast each pays back its construction cost; when in doubt, build what is dearest on your market (see the goods panel) or what your factories lack.\n\nThis entry closes once the queue holds at least four weeks of work."

 je_oiko_chapter_1:0 "Chapter I: Foundations"
 je_oiko_chapter_1_reason:0 "The first years decide whether the economy can compound. Get construction going, make its inputs cheap, start schooling and prepare railways, all without drowning in debt.\n\nThe next chapter opens when all five are done (or in 1850)."
 je_oiko_chapter_1_status:0 "[SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(GetPlayer.MakeScope.ScriptValue('oiko_ch_construction_ok'), GetPlayer.MakeScope.ScriptValue('oiko_one')),'@green_checkmark_box!','@simple_box!')] At least 5 construction sector levels\n[SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(GetPlayer.MakeScope.ScriptValue('oiko_ch_tools_ok'), GetPlayer.MakeScope.ScriptValue('oiko_one')),'@green_checkmark_box!','@simple_box!')] Tools less than 20% above base price\n[SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(GetPlayer.MakeScope.ScriptValue('oiko_ch_schools_ok'), GetPlayer.MakeScope.ScriptValue('oiko_one')),'@green_checkmark_box!','@simple_box!')] A school law (not No Schools)\n[SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(GetPlayer.MakeScope.ScriptValue('oiko_ch_railways_tech_ok'), GetPlayer.MakeScope.ScriptValue('oiko_one')),'@green_checkmark_box!','@simple_box!')] Railways researched\n[SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(GetPlayer.MakeScope.ScriptValue('oiko_war_chest_ok'), GetPlayer.MakeScope.ScriptValue('oiko_one')),'@green_checkmark_box!','@simple_box!')] Debt under 30% of the credit limit"
 je_oiko_chapter_2:0 "Chapter II: Industry"
 je_oiko_chapter_2_reason:0 "Railways and heavy industry turn the early economy into a great power. Connect the states, make steel cheap, build knowledge and a professional army.\n\nThe next chapter opens when all five are done (or in 1885)."
 je_oiko_chapter_2_status:0 "[SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(GetPlayer.MakeScope.ScriptValue('oiko_ch_railways_ok'), GetPlayer.MakeScope.ScriptValue('oiko_one')),'@green_checkmark_box!','@simple_box!')] At least 10 railway levels\n[SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(GetPlayer.MakeScope.ScriptValue('oiko_ch_steel_ok'), GetPlayer.MakeScope.ScriptValue('oiko_one')),'@green_checkmark_box!','@simple_box!')] Steel less than 20% above base price\n[SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(GetPlayer.MakeScope.ScriptValue('oiko_ch_university_ok'), GetPlayer.MakeScope.ScriptValue('oiko_one')),'@green_checkmark_box!','@simple_box!')] A university\n[SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(GetPlayer.MakeScope.ScriptValue('oiko_ch_army_ok'), GetPlayer.MakeScope.ScriptValue('oiko_one')),'@green_checkmark_box!','@simple_box!')] No peasant levies\n[SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(GetPlayer.MakeScope.ScriptValue('oiko_has_public_schools'), GetPlayer.MakeScope.ScriptValue('oiko_one')),'@green_checkmark_box!','@simple_box!')] Public Schools"
 je_oiko_chapter_3:0 "Chapter III: Modern State"
 je_oiko_chapter_3_reason:0 "Late game: electricity and oil drive productivity, welfare keeps the population loyal, and a sound budget carries the great war if it comes."
 je_oiko_chapter_3_status:0 "[SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(GetPlayer.MakeScope.ScriptValue('oiko_ch_power_ok'), GetPlayer.MakeScope.ScriptValue('oiko_one')),'@green_checkmark_box!','@simple_box!')] A power plant\n[SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(GetPlayer.MakeScope.ScriptValue('oiko_ch_oil_ok'), GetPlayer.MakeScope.ScriptValue('oiko_one')),'@green_checkmark_box!','@simple_box!')] Oil less than 20% above base price\n[SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(GetPlayer.MakeScope.ScriptValue('oiko_ch_welfare_ok'), GetPlayer.MakeScope.ScriptValue('oiko_one')),'@green_checkmark_box!','@simple_box!')] A welfare law\n[SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(GetPlayer.MakeScope.ScriptValue('oiko_war_chest_ok'), GetPlayer.MakeScope.ScriptValue('oiko_one')),'@green_checkmark_box!','@simple_box!')] Debt under 30% of the credit limit\n[SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(GetPlayer.MakeScope.ScriptValue('oiko_ch_radicals_ok'), GetPlayer.MakeScope.ScriptValue('oiko_one')),'@green_checkmark_box!','@simple_box!')] Radicals under 10%"

